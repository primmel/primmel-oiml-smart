# PR/push gates for the documentation site.
#
# Runs the same checks a developer runs locally (see README.md → "The
# gates"): markdown lint over docs/, the SVG background/palette contract,
# a full build (sync + Astro + Pagefind + sitemap), and the internal
# link check over the built site. Any red gate blocks the merge.
#
# deploy.yml runs the same gate sequence before publishing, so nothing
# reaches GitHub Pages that has not passed here.

name: Check (astro check, lint, svg, build, links)

on:
  pull_request:
  push:
    branches: [v1]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (astro check)
        run: npm run check

      - name: Markdown lint (docs/)
        run: npm run lint:md

      - name: SVG palette contract (diagrams dark-mode safety)
        run: npm run check:svg

      - name: Build (syncs docs/ → src/content/docs/, Astro, Pagefind, sitemap)
        run: npm run build

      - name: Link check (zero broken internal refs over dist/)
        run: npm run check:links
