# Deploy the Starlight documentation site to GitHub Pages.
#
# `npm run build` first runs `npm run sync` (scripts/sync-content.mjs), which
# copies docs/ into src/content/docs/ — so the published site always reflects
# the docs/ source of truth.
#
# One-time repo setup: Settings → Pages → Build and deployment → Source:
# "GitHub Actions". If the site is served from a project page
# (https://<user>.github.io/<repo>/), set `site` and `base` in
# astro.config.mjs to match.

name: Deploy documentation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with Astro (syncs docs/ → src/content/docs/ first)
        uses: withastro/action@v3
        # with:
        #   path: .            # repo root
        #   node-version: 20   # action default
        #   package-manager: npm

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
