# Deploy the Starlight documentation site to GitHub Pages.
#
# The build job runs the full gate sequence first (markdown lint, SVG
# palette contract, link check over the built site) — a red gate means
# nothing is published. `npm run build` runs `npm run sync`
# (scripts/sync-content.mjs), which copies docs/ into src/content/docs/ —
# so the published site always reflects the docs/ source of truth.
#
# check.yml runs the same gates on pull requests, so a red build here
# should never be a surprise.
#
# One-time repo setup: Settings → Pages → Build and deployment → Source:
# "GitHub Actions". The site deploys as a project page
# (https://primmel.github.io/primmel-smart-docs/) — `site` and `base` in
# astro.config.mjs already match.
#
# Root cause of the 2026-08 unstyled-pages incident: the repo was renamed
# (primmel-oiml-smart → primmel-smart-docs) and the base changed with it,
# but the deployed build was never re-run — the live site kept serving a
# stale build whose asset URLs pointed at the OLD base
# (/primmel-oiml-smart/_astro/*.css), so every page loaded unstyled. The
# config was right all along; the deploy was old. This comment cited the
# old URL too, and public/manifest.json + the PageFrame manifest/favicon
# refs carried the stale base as well (fixed in the same change). Any
# future base change must ship with a fresh deploy of the current tree.

name: Deploy documentation to GitHub Pages

on:
  push:
    branches: [v1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (astro check)
        run: npm run check

      - name: Markdown lint (docs/)
        run: npm run lint:md

      - name: SVG palette contract (diagrams dark-mode safety)
        run: npm run check:svg

      - name: Build with Astro (syncs docs/ → src/content/docs/ first)
        run: npm run build

      - name: Link check (zero broken internal refs over dist/)
        run: npm run check:links

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
