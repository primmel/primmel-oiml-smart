<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrRt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrRtV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9333ea"/>
    </marker>
  </defs>

  <text x="50" y="34" font-size="18" font-weight="700" fill="#0f172a">The Annex-B runtime — live feeds into continuous judgment</text>
  <text x="50" y="54" font-size="12.5" fill="#475569">connectors serve model registers · the monitor rides the same verdict engine (INV-9) · evidence accrues, never rewrites.</text>

  <!-- sources -->
  <rect x="50" y="95" width="260" height="250" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="1.8"/>
  <text x="180" y="121" font-size="12.5" font-weight="700" fill="#1e293b" text-anchor="middle">EXTERNAL SOURCES</text>
  <text x="180" y="139" font-size="10" fill="#475569" text-anchor="middle">the connector registry (task 33)</text>
  <text x="66" y="166" font-size="10" font-weight="700" fill="#334155">rest_json — poll + webhook · Bearer-only;</text>
  <text x="66" y="180" font-size="9.5" fill="#475569">any other credential material fails closed</text>
  <text x="66" y="202" font-size="10" font-weight="700" fill="#334155">mqtt — subscribe</text>
  <text x="66" y="216" font-size="9.5" fill="#475569">the broker client injected (no dependency)</text>
  <text x="66" y="238" font-size="10" font-weight="700" fill="#334155">file_drop — batch ingestion</text>
  <text x="66" y="252" font-size="9.5" fill="#475569">opc_ua — a declared stub</text>
  <rect x="66" y="268" width="228" height="52" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="80" y="288" font-size="10" font-weight="700" fill="#166534">the /twin feed — the simulated bench</text>
  <text x="80" y="303" font-size="9.5" fill="#14532d">serving ServedQuantity { value, unit,</text>
  <text x="80" y="315" font-size="9.5" fill="#14532d">kind, servedAt } — the demo driver</text>

  <!-- arrow sources -> gateway -->
  <line x1="310" y1="220" x2="336" y2="220" stroke="#475569" stroke-width="1.8" marker-end="url(#arrRt)"/>

  <!-- gateway -->
  <rect x="340" y="95" width="270" height="250" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="1.8"/>
  <text x="475" y="121" font-size="12.5" font-weight="700" fill="#6b21a8" text-anchor="middle">API GATEWAY</text>
  <text x="475" y="139" font-size="10" fill="#7e22ce" text-anchor="middle">bindings declared in model/gateway.yaml</text>
  <text x="356" y="166" font-size="10" font-weight="700" fill="#6b21a8">validated on declaration:</text>
  <text x="356" y="184" font-size="9.5" fill="#7e22ce">· the endpoint + operation resolve</text>
  <text x="356" y="200" font-size="9.5" fill="#7e22ce">· the credential scope covers the operation</text>
  <text x="356" y="216" font-size="9.5" fill="#7e22ce">· a serve with fresh_within covers every pair</text>
  <text x="356" y="244" font-size="10" font-weight="700" fill="#6b21a8">no secrets in models — credentials are</text>
  <text x="356" y="258" font-size="9.5" fill="#7e22ce">{ env: VAR_NAME }, resolved at runtime</text>
  <rect x="356" y="278" width="238" height="50" rx="8" fill="#ffffff" stroke="#9333ea" stroke-width="1.2"/>
  <text x="370" y="297" font-size="9.5" fill="#7e22ce">consumer-side runtime configuration —</text>
  <text x="370" y="311" font-size="9.5" fill="#7e22ce">deliberately outside the PRL codec</text>

  <!-- arrow gateway -> registers -->
  <line x1="610" y1="220" x2="636" y2="220" stroke="#475569" stroke-width="1.8" marker-end="url(#arrRt)"/>

  <!-- registers -->
  <rect x="640" y="95" width="270" height="250" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
  <text x="775" y="121" font-size="12.5" font-weight="700" fill="#3730a3" text-anchor="middle">MODEL REGISTERS</text>
  <text x="775" y="139" font-size="10" fill="#4f46e5" text-anchor="middle">serve bindings land here</text>
  <text x="656" y="168" font-size="10" fill="#3730a3">the register keeps the last-served</text>
  <text x="656" y="182" font-size="10" fill="#3730a3">value + timestamp</text>
  <rect x="656" y="200" width="238" height="76" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="670" y="220" font-size="10" font-weight="700" fill="#991b1b">fetch failure ⇒ unavailable</text>
  <text x="670" y="236" font-size="9.5" fill="#7f1d1d">the register is untouched; the freshness</text>
  <text x="670" y="250" font-size="9.5" fill="#7f1d1d">gate owns the judging (stale ⇒</text>
  <text x="670" y="264" font-size="9.5" fill="#7f1d1d">indeterminate, never a silent pass)</text>
  <text x="656" y="304" font-size="10" fill="#3730a3">the outage lands in the health log —</text>
  <text x="656" y="318" font-size="10" fill="#3730a3">never an exception into evidence</text>

  <!-- arrow registers -> monitor -->
  <line x1="700" y1="345" x2="250" y2="395" stroke="#475569" stroke-width="1.6" marker-end="url(#arrRt)"/>
  <text x="475" y="362" font-size="9.5" fill="#475569" text-anchor="middle">served values feed the cycle</text>

  <!-- monitor -->
  <rect x="50" y="395" width="280" height="190" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <text x="190" y="421" font-size="12.5" font-weight="700" fill="#92400e" text-anchor="middle">MONITOR (task 34)</text>
  <text x="190" y="439" font-size="10" fill="#b45309" text-anchor="middle">model/monitors.yaml · the INV-8 version pin</text>
  <text x="66" y="466" font-size="10" fill="#78350f">trigger — every | on_signal | on_change</text>
  <text x="66" y="484" font-size="10" fill="#78350f">→ gateway fetch → the freshness gate</text>
  <text x="66" y="500" font-size="9.5" fill="#92600e">(stale ⇒ indeterminate — silence is not</text>
  <text x="66" y="514" font-size="9.5" fill="#92600e">evidence) → evaluate → emit · escalate</text>
  <rect x="66" y="528" width="248" height="42" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="80" y="546" font-size="9.5" fill="#92400e">declarations: over / triggers / evaluate /</text>
  <text x="80" y="560" font-size="9.5" fill="#92400e">emit / escalate — a scheduler, not a service</text>

  <!-- arrow monitor -> verdict -->
  <line x1="330" y1="490" x2="366" y2="490" stroke="#475569" stroke-width="1.8" marker-end="url(#arrRt)"/>

  <!-- verdict engine -->
  <rect x="370" y="395" width="240" height="190" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="490" y="421" font-size="12.5" font-weight="700" fill="#991b1b" text-anchor="middle">THE VERDICT ENGINE</text>
  <text x="490" y="439" font-size="10" fill="#b91c1c" text-anchor="middle">the same one as the lab (INV-9)</text>
  <text x="386" y="466" font-size="10" fill="#7f1d1d">computeVerdicts per twin — the</text>
  <text x="386" y="480" font-size="10" fill="#7f1d1d">SAME OCL, never a second dialect</text>
  <text x="386" y="504" font-size="10" fill="#7f1d1d">applicability expanded per twin</text>
  <text x="386" y="518" font-size="10" fill="#7f1d1d">by the ONE engine</text>
  <rect x="386" y="532" width="208" height="40" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
  <text x="400" y="549" font-size="9.5" fill="#991b1b">verdict records appended — pass / fail /</text>
  <text x="400" y="563" font-size="9.5" fill="#991b1b">indeterminate / invalid</text>

  <!-- arrow verdict -> streams -->
  <line x1="610" y1="490" x2="646" y2="490" stroke="#475569" stroke-width="1.8" marker-end="url(#arrRt)"/>

  <!-- evidence streams -->
  <rect x="650" y="395" width="260" height="190" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="780" y="421" font-size="12.5" font-weight="700" fill="#166534" text-anchor="middle">EVIDENCE STREAMS</text>
  <text x="780" y="439" font-size="9.5" fill="#15803d" text-anchor="middle">append-only · window-queryable · version-pinned</text>
  <text x="666" y="466" font-size="10" fill="#14532d">the fact stream — every served value</text>
  <text x="666" y="482" font-size="10" fill="#14532d">the verdict stream — full snapshots</text>
  <text x="666" y="498" font-size="10" fill="#14532d">the escalation stream — flag/case dedupe</text>
  <rect x="666" y="512" width="228" height="60" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <text x="680" y="530" font-size="9.5" fill="#166534">re-judgment reads only stored snapshots</text>
  <text x="680" y="544" font-size="9.5" fill="#166534">(INV-5): rejudgeWindow re-runs a window</text>
  <text x="680" y="558" font-size="9.5" fill="#166534">against new limits — zero gateway calls</text>

  <!-- law bar -->
  <rect x="50" y="605" width="860" height="46" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="70" y="625" font-size="11.5" font-weight="600" fill="#0f172a">One engine, two tempos — the lab's verdict chain and the monitor's cycle are the same OCL over the same model.</text>
  <text x="70" y="641" font-size="10.5" fill="#475569">/app/twin wires this surface against the demo deployment (honestly bannered); e2e drives pass ⇒ drift-fail + escalation ⇒ outage-indeterminate.</text>
</svg>
