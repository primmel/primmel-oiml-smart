<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="casc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="facet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">The CASCO foundation — delegation, classification, never restatement</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">The scheme references four foundation packages. Amber dashed edges are the facet trio resolving against registers.</text>

  <!-- ================= oiml-cs (consumer) ================= -->
  <rect x="285" y="86" width="330" height="118" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="285" y="86" width="330" height="30" rx="12" fill="#4f46e5"/>
  <text x="450" y="106" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">oiml-cs &#183; the scheme package (kind: core)</text>
  <g font-size="10.5" fill="#3730a3">
    <text x="303" y="136">framework &#183; documents corpus &#183; PD-05 provisions</text>
    <text x="303" y="150">IA competence &#8594; delegates_to: iso-iec-17065 (&#167;5.2)</text>
    <text x="303" y="164">TL competence &#8594; delegates_to: iso-iec-17025 (&#167;5.3)</text>
    <text x="303" y="178">scheme shape &#8594; scheme_type: type_1a (B 18 &#167;1.3)</text>
  </g>
  <text x="303" y="198" font-size="10" font-weight="600" fill="#4338ca">requires: [iso-iec-17000, -17065, -17025, -17067]</text>

  <!-- ================= 17000 ================= -->
  <rect x="60" y="300" width="190" height="150" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="1.8"/>
  <rect x="60" y="300" width="190" height="30" rx="12" fill="#475569"/>
  <text x="155" y="320" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">iso-iec-17000:2020</text>
  <g font-size="10.5" fill="#334155">
    <text x="74" y="348">the CA vocabulary</text>
    <text x="74" y="362">(36 terms)</text>
    <text x="74" y="384" font-weight="600">activity-archetype register:</text>
    <text x="74" y="398">22 kinds; selection &#8594;</text>
    <text x="74" y="412">determination &#8594; review,</text>
    <text x="74" y="426">decision, attestation</text>
  </g>
  <text x="74" y="444" font-size="10" font-weight="600" fill="#475569">composes FIRST into every rec</text>

  <!-- ================= 17065 ================= -->
  <rect x="265" y="300" width="190" height="150" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <rect x="265" y="300" width="190" height="30" rx="12" fill="#16a34a"/>
  <text x="360" y="320" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">iso-iec-17065:2012</text>
  <g font-size="10.5" fill="#14532d">
    <text x="279" y="348">certification-body model</text>
    <text x="279" y="362">(IA competence, &#167;5.2)</text>
    <text x="279" y="384">31 provisions: 12 /body +</text>
    <text x="279" y="398">19 /process &#183; clause-7</text>
    <text x="279" y="412">functional approach as</text>
    <text x="279" y="426">11 abstract processes</text>
  </g>
  <text x="279" y="444" font-size="10" font-weight="600" fill="#15803d">the segregation: facet's home</text>

  <!-- ================= 17025 ================= -->
  <rect x="470" y="300" width="190" height="150" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <rect x="470" y="300" width="190" height="30" rx="12" fill="#d97706"/>
  <text x="565" y="320" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">iso-iec-17025:2017</text>
  <g font-size="10.5" fill="#78350f">
    <text x="484" y="348">laboratory-competence</text>
    <text x="484" y="362">model (TL, &#167;5.3; D 30)</text>
    <text x="484" y="384">33 provisions: 12 /lab</text>
    <text x="484" y="398">resource + 21 /process &#183;</text>
    <text x="484" y="412">clause-7 test lifecycle</text>
    <text x="484" y="426">(7.1 &#8594; 7.8 + off-sequence)</text>
  </g>
  <text x="484" y="444" font-size="10" font-weight="600" fill="#b45309">labs map SOPs to it (.prm)</text>

  <!-- ================= 17067 ================= -->
  <rect x="675" y="300" width="190" height="150" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="1.8"/>
  <rect x="675" y="300" width="190" height="30" rx="12" fill="#9333ea"/>
  <text x="770" y="320" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">iso-iec-17067:2013</text>
  <g font-size="10.5" fill="#581c87">
    <text x="689" y="348">the scheme taxonomy</text>
    <text x="689" y="362">(types 1a&#8211;6 + Table 1)</text>
    <text x="689" y="384" font-weight="600">scheme-type register:</text>
    <text x="689" y="398">7 types; 5.3.1 query —</text>
    <text x="689" y="412">1a/1b need no surveillance</text>
    <text x="689" y="426">22-item content checklist</text>
  </g>
  <text x="689" y="444" font-size="10" font-weight="600" fill="#7e22ce">(&#167;6.5.1 a&#8211;v)</text>

  <!-- ================= FACET EDGES (amber dashed) ================= -->
  <g stroke="#d97706" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#facet)">
    <!-- activity_kind resolution: processes tag against 17000 -->
    <line x1="330" y1="204" x2="180" y2="294"/>
    <!-- segregation home: 17065 clause 7 -->
    <line x1="420" y1="204" x2="370" y2="294"/>
    <!-- scheme_type resolution -->
    <line x1="560" y1="204" x2="745" y2="294"/>
  </g>
  <g font-size="9.5" fill="#b45309" font-weight="600">
    <text x="212" y="248" text-anchor="middle">activity_kind: [testing]</text>
    <text x="352" y="248" text-anchor="middle">segregation: pair</text>
    <text x="700" y="248" text-anchor="middle">scheme_type: type_1a</text>
  </g>

  <!-- delegation edges (slate solid) -->
  <g stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#casc)">
    <line x1="490" y1="204" x2="540" y2="294"/>
  </g>
  <text x="505" y="262" font-size="9.5" fill="#475569">delegates_to</text>

  <!-- ================= FACET TRIO BAR ================= -->
  <rect x="60" y="490" width="805" height="86" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="80" y="513" font-size="11.5" font-weight="700" fill="#78350f">The facet trio — classification, never inheritance</text>
  <g font-size="10.5" fill="#78350f">
    <text x="80" y="533">activity_kind: a process holds a REFERENCE into the 17000 register (R23/C58) — multi-kind deliberate (17065 3.3).</text>
    <text x="80" y="549">segregation:: cross-process personnel-set constraints; pair members are process ids, never roles (R24/C59).</text>
    <text x="80" y="565">scheme_type:: the scheme's own manifest declares it — resolved against a register composed earlier (checkUses).</text>
  </g>

  <!-- ================= BOTTOM BAR ================= -->
  <rect x="60" y="584" width="805" height="44" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="80" y="603" font-size="11.5" font-weight="600" fill="#0f172a">MECE: each standard's content lives only in its own package — a grep for ISO text inside data/oiml-cs/ returns nothing.</text>
  <text x="80" y="619" font-size="11" fill="#475569">Registers stay scheme-agnostic; schemes stay register-thin. Composition for structure, facets for the joins.</text>
</svg>
