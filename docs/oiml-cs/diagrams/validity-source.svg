<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="vs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="vsg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="vsr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">The register is the validity source — B 18:2025 &#167;15.8, executed</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">One RegisteredCopy per registered revision, SHA-256 over canonical registration content. One funnel writes; five honest answers read.</text>

  <!-- ================= LEFT: funnel ================= -->
  <rect x="60" y="90" width="240" height="120" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
  <rect x="60" y="90" width="240" height="30" rx="12" fill="#4f46e5"/>
  <text x="180" y="110" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">registration — one funnel</text>
  <g font-size="10" fill="#3730a3">
    <text x="76" y="140">biml-registration.service &#183;</text>
    <text x="76" y="154">useCertificate.registerWithBiml &#183;</text>
    <text x="76" y="168">seeded copies at seed time</text>
    <text x="76" y="190" font-weight="600">recordRegisteredCopy — the only writer</text>
  </g>

  <!-- ================= CENTER: the register ================= -->
  <rect x="380" y="90" width="250" height="240" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <rect x="380" y="90" width="250" height="30" rx="12" fill="#475569"/>
  <text x="505" y="110" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">the public register (/app/register)</text>

  <g font-size="10">
    <rect x="398" y="134" width="214" height="52" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="410" y="154" font-weight="700" fill="#14532d">RegisteredCopy r1 — CURRENT</text>
    <text x="410" y="172" fill="#15803d">sha256(canonicalRegistrationContent)</text>

    <rect x="398" y="196" width="214" height="44" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="410" y="214" font-weight="700" fill="#78350f">RegisteredCopy r0 — SUPERSEDED</text>
    <text x="410" y="230" fill="#b45309">error-correction revision (&#167;8.1.5)</text>

    <rect x="398" y="250" width="214" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="410" y="268" font-weight="700" fill="#475569">older revisions — ARCHIVED</text>
    <text x="410" y="284" fill="#64748b">otherwise (&#167;8.1.7)</text>
  </g>
  <text x="398" y="316" font-size="9.5" fill="#475569">deregistered: leaves the source — never resurrects</text>

  <line x1="300" y1="150" x2="374" y2="160" stroke="#475569" stroke-width="1.7" fill="none" marker-end="url(#vs)"/>
  <text x="337" y="146" font-size="9.5" fill="#475569" text-anchor="middle">writes</text>

  <!-- ================= RIGHT: the check ================= -->
  <rect x="700" y="90" width="170" height="60" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="714" y="112" font-size="10.5" font-weight="700" fill="#3730a3">presented certificate</text>
  <text x="714" y="130" font-size="9.5" fill="#4338ca">digest of presented content</text>
  <line x1="700" y1="120" x2="636" y2="140" stroke="#475569" stroke-width="1.7" fill="none" marker-end="url(#vs)"/>

  <text x="700" y="180" font-size="10" font-weight="700" fill="#0f172a">verifyPresentedCertificate:</text>
  <g font-size="10">
    <rect x="700" y="190" width="170" height="30" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
    <text x="712" y="209" fill="#14532d" font-weight="600">match</text>
    <rect x="700" y="226" width="170" height="30" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
    <text x="712" y="245" fill="#78350f" font-weight="600">mismatch (+ revision hint)</text>
    <rect x="700" y="262" width="170" height="30" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
    <text x="712" y="281" fill="#78350f" font-weight="600">superseded</text>
    <rect x="700" y="298" width="170" height="30" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
    <text x="712" y="317" fill="#7f1d1d" font-weight="600">deregistered</text>
    <rect x="700" y="334" width="170" height="30" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
    <text x="712" y="353" fill="#475569" font-weight="600">no_registered_copy</text>
  </g>
  <line x1="630" y1="210" x2="694" y2="205" stroke="#16a34a" stroke-width="1.6" fill="none" marker-end="url(#vsg)"/>

  <!-- ================= the operations that fold in ================= -->
  <rect x="60" y="380" width="810" height="86" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="80" y="402" font-size="11.5" font-weight="700" fill="#7f1d1d">Deregistration folds three consequences into one act</text>
  <text x="80" y="422" font-size="10.5" fill="#7f1d1d">certificate walks withdraw (WITHDRAWN/REVOKED) &#183; the DeregistrationRecord lands with the OIML Bulletin + website</text>
  <text x="80" y="438" font-size="10.5" fill="#7f1d1d">notice (PD-06 5.3) &#183; every registered copy leaves the validity source — re-running the funnel returns it unchanged.</text>
  <text x="80" y="456" font-size="10" fill="#b91c1d">Tracks: upheld incorrect-conclusions complaint + IA correction (PD-01 6.1) &#183; warned misuse + no upheld appeal (PD-06 5.2).</text>

  <!-- ================= BOTTOM BAR ================= -->
  <rect x="60" y="496" width="810" height="88" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="80" y="519" font-size="11.5" font-weight="600" fill="#0f172a">The &#167;15.8 principle is read from the governance model (fail-closed); the digest is over a deterministic canonical</text>
  <text x="80" y="535" font-size="11.5" font-weight="600" fill="#0f172a">construction; the funnel is idempotent per (certificate, revision).</text>
  <text x="80" y="556" font-size="11" fill="#475569">e2e: the presented certificate matches (r1) &#183; tampered content mismatches &#183; the deregistered certificate answers</text>
  <text x="80" y="572" font-size="11" fill="#475569">deregistered. Edition coexistence is inherent: the source is per-number, so two editions verify side by side (&#167;8.3).</text>
</svg>
