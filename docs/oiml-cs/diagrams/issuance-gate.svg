<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="gate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="blocked" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">The issuance gate — PD-08 cl. 5, enforced on both paths, failing closed</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">One checkpoint reads the composed framework + the registry. Every issuance route funnels through it.</text>

  <!-- ================= LEFT: the two paths ================= -->
  <text x="60" y="88" font-size="11" font-weight="700" fill="#4338ca">THE TWO PATHS — no route around</text>

  <rect x="60" y="98" width="270" height="96" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="74" y="120" font-size="11.5" font-weight="700" fill="#3730a3">action funnel</text>
  <g font-size="10" fill="#3730a3">
    <text x="74" y="140">useCertificate.issueCertificate</text>
    <text x="74" y="154">useCertificate.issueParallel</text>
    <text x="74" y="172" font-size="9.5" fill="#4338ca">IA console &#183; certificate-new &#183; import handler</text>
    <text x="74" y="186" font-size="9.5" fill="#4338ca">all reach issuance here — and throw</text>
  </g>

  <rect x="60" y="210" width="270" height="80" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="74" y="232" font-size="11.5" font-weight="700" fill="#3730a3">workflow guard</text>
  <g font-size="10" fill="#3730a3">
    <text x="74" y="252">workflow.service canIssueCertificate</text>
    <text x="74" y="270" font-size="9.5" fill="#4338ca">prerequisite check &#8743; signing gate,</text>
    <text x="74" y="284" font-size="9.5" fill="#4338ca">surfaced in certificate-new</text>
  </g>

  <!-- ================= CENTER: the checkpoint ================= -->
  <rect x="400" y="120" width="230" height="130" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <rect x="400" y="120" width="230" height="30" rx="12" fill="#dc2626"/>
  <text x="515" y="140" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">issuance-gate.ts</text>
  <g font-size="10" fill="#7f1d1d">
    <text x="414" y="170" font-weight="600">evaluateIssuanceGate</text>
    <text x="414" y="190">gate definition &#8592; std.framework</text>
    <text x="414" y="204">(declarations.signing_gate)</text>
    <text x="414" y="222">registry records &#8592; participant</text>
    <text x="414" y="236">stores (read, never restated)</text>
  </g>

  <g stroke="#475569" stroke-width="1.7" fill="none" marker-end="url(#gate)">
    <line x1="330" y1="146" x2="394" y2="165"/>
    <line x1="330" y1="250" x2="394" y2="215"/>
  </g>

  <!-- ================= RIGHT: the five checks ================= -->
  <text x="690" y="88" font-size="11" font-weight="700" fill="#15803d">THE CHECKS — in order</text>
  <g font-size="10">
    <rect x="690" y="98" width="180" height="34" rx="7" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
    <text x="702" y="119" fill="#14532d">1 gate definition composed?</text>
    <rect x="690" y="140" width="180" height="34" rx="7" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
    <text x="702" y="161" fill="#14532d">2 declaration present?</text>
    <rect x="690" y="182" width="180" height="34" rx="7" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
    <text x="702" y="203" fill="#14532d">3 status = signed?</text>
    <rect x="690" y="224" width="180" height="34" rx="7" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
    <text x="702" y="245" fill="#14532d">4 scope &#8715; category?</text>
    <rect x="690" y="266" width="180" height="34" rx="7" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
    <text x="702" y="287" fill="#14532d">5 scope &#8715; scheme?</text>
  </g>
  <line x1="630" y1="185" x2="684" y2="185" stroke="#16a34a" stroke-width="1.7" fill="none" marker-end="url(#gate)"/>

  <!-- ================= FAIL-CLOSED band ================= -->
  <rect x="400" y="330" width="470" height="64" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="418" y="351" font-size="11" font-weight="700" fill="#b91c1c">FAIL CLOSED — any failure blocks:</text>
  <text x="418" y="369" font-size="10" fill="#7f1d1d">no composed gate &#183; draft/suspended/withdrawn &#183;</text>
  <text x="418" y="384" font-size="10" fill="#7f1d1d">out-of-scope category or scheme &#183; no registered category</text>

  <!-- blocked arrows to red crosses -->
  <g stroke="#dc2626" stroke-width="1.7" fill="none" marker-end="url(#blocked)">
    <line x1="780" y1="300" x2="780" y2="324"/>
  </g>

  <!-- ================= the pipeline feeds the gate ================= -->
  <rect x="60" y="330" width="270" height="120" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="74" y="352" font-size="11.5" font-weight="700" fill="#14532d">what discharges it</text>
  <g font-size="10" fill="#14532d">
    <text x="74" y="372">the approval pipeline:</text>
    <text x="74" y="388">SUBMITTED &#8594; ASSESSMENT &#8594;</text>
    <text x="74" y="402">RC_REVIEW &#8594; MC_VOTE (80 %) &#8594;</text>
    <text x="74" y="416">DECLARATION_PENDING &#8594; ACTIVE</text>
    <text x="74" y="436" font-weight="600">signDeclaration: draft &#8594; signed</text>
  </g>
  <line x1="330" y1="390" x2="394" y2="356" stroke="#16a34a" stroke-width="1.7" fill="none" marker-end="url(#gate)"/>

  <!-- ================= per-standard note ================= -->
  <rect x="60" y="480" width="810" height="52" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="80" y="501" font-size="11" font-weight="700" fill="#78350f">Fail-closed is per-standard: only seeded categories (load-cells, traffic-speed-meters) open the gate.</text>
  <text x="80" y="519" font-size="10.5" fill="#78350f">r129/r144 dev workspaces block with &#8220;no instrument category registered&#8221; — deliberate PD-08 behavior, not a regression.</text>

  <!-- ================= BOTTOM BAR ================= -->
  <rect x="60" y="552" width="810" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="80" y="573" font-size="11.5" font-weight="600" fill="#0f172a">The gate is model content executed: the definition lives in framework/declarations.yaml, the check in one pure module.</text>
  <text x="80" y="589" font-size="11" fill="#475569">e2e: unsigned IA blocked &#8594; Executive Secretary signs &#8594; gate discharged &#8594; the IA issues (R60/2021-A-XX1-&#8230;).</text>
</svg>
