<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="cov" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">The coverage machinery — four maps, one report, mutation-proven</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">Every pair documented, every gap named with a reason, the asserted coverage recomputed (the tripwire).</text>

  <!-- ================= LEFT: the four maps ================= -->
  <text x="60" y="88" font-size="11" font-weight="700" fill="#4338ca">THE MAPS (.prm)</text>
  <g font-size="10">
    <rect x="60" y="98" width="250" height="66" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="74" y="118" font-weight="700" fill="#3730a3">platform-to-oiml-cs.prm</text>
    <text x="74" y="134" fill="#4338ca">platform &#8658; PD-05 (49 components)</text>
    <text x="74" y="150" fill="#4338ca">5 named gaps</text>

    <rect x="60" y="174" width="250" height="66" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="74" y="194" font-weight="700" fill="#3730a3">platform-to-cs-documents.prm</text>
    <text x="74" y="210" fill="#4338ca">platform &#8658; corpus + framework</text>
    <text x="74" y="226" fill="#4338ca">51 pairs &#183; 52 gaps &#183; 171 assertions</text>

    <rect x="60" y="250" width="250" height="66" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="74" y="270" font-weight="700" fill="#14532d">oiml-cs-to-17065.prm</text>
    <text x="74" y="286" fill="#15803d">corpus &#8658; functional approach</text>
    <text x="74" y="302" fill="#15803d">14 pairs &#183; surveillance discharged</text>

    <rect x="60" y="326" width="250" height="66" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="74" y="346" font-weight="700" fill="#14532d">oiml-cs-to-17067.prm</text>
    <text x="74" y="362" fill="#15803d">corpus &#8658; &#167;6.5.1 a&#8211;v checklist</text>
    <text x="74" y="378" fill="#15803d">67 pairs from 53 corpus elements</text>
  </g>

  <!-- ================= CENTER: the unified report ================= -->
  <rect x="390" y="98" width="250" height="294" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <rect x="390" y="98" width="250" height="30" rx="12" fill="#d97706"/>
  <text x="515" y="118" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">cs-coverage.ts — one report</text>
  <g font-size="9.5" fill="#78350f">
    <text x="404" y="146" font-weight="700">per-document accounting:</text>
    <text x="404" y="164">pd-05   42 mand. &#183; 37 cov. &#183; 5 gaps</text>
    <text x="404" y="180">pd-04 &#183; pd-08 &#183; pd-09 &#183; cid-01 &#160;full</text>
    <text x="404" y="196">pd-02   0/15 + 15 (expert pipeline)</text>
    <text x="404" y="212">pd-01   10/11 + 1 (dispute mediation)</text>
    <text x="404" y="228">pd-03   19/22 + 3 (periodic review)</text>
    <text x="404" y="244">pd-06   3/8 + 5 (owner-side use)</text>
    <text x="404" y="260">od-02   0/5 + 5 (advisory TLF)</text>
    <text x="404" y="276">&#8230; framework &#183; 17065 &#183; 17067</text>
  </g>
  <rect x="404" y="292" width="222" height="42" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="515" y="310" font-size="10.5" font-weight="700" fill="#14532d" text-anchor="middle">CORPUS: 152 / 200 covered</text>
  <text x="515" y="326" font-size="10" fill="#15803d" text-anchor="middle">48 justified named gaps &#183; 0 errors</text>
  <text x="404" y="362" font-size="9.5" fill="#b45309">gates: documented pairs &#183; no dangling &#183; tripwire</text>
  <text x="404" y="378" font-size="9.5" fill="#b45309">mandatory-or-gapped &#183; realized_by &#8660; .prm</text>

  <g stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#cov)">
    <line x1="310" y1="131" x2="384" y2="150"/>
    <line x1="310" y1="207" x2="384" y2="210"/>
    <line x1="310" y1="283" x2="384" y2="270"/>
    <line x1="310" y1="359" x2="384" y2="330"/>
  </g>

  <!-- ================= RIGHT: the discharges + mutations ================= -->
  <rect x="700" y="98" width="170" height="140" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="1.6"/>
  <text x="714" y="120" font-size="10.5" font-weight="700" fill="#581c87">mechanical discharges</text>
  <g font-size="9.5" fill="#581c87">
    <text x="714" y="140">scheme_type: type_1a</text>
    <text x="714" y="156">re-resolved vs register:</text>
    <text x="714" y="174">surveillance N/A (5.3.1)</text>
    <text x="714" y="190">mark ownership N/A (T.1 V d)</text>
    <text x="714" y="208">reason must invoke the</text>
    <text x="714" y="222">classification — or fail</text>
  </g>

  <rect x="700" y="252" width="170" height="140" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="714" y="274" font-size="10.5" font-weight="700" fill="#7f1d1d">mutation proofs</text>
  <g font-size="9.5" fill="#7f1d1d">
    <text x="714" y="294">dropped pair &#8594; fail</text>
    <text x="714" y="310">stale / reasonless gap &#8594; fail</text>
    <text x="714" y="326">dangling end &#8594; fail</text>
    <text x="714" y="342">tripwire flip &#8594; fail</text>
    <text x="714" y="358">type 2 &#8594; surveillance fails</text>
    <text x="714" y="374">mark type &#8594; mark gap fails</text>
  </g>
  <line x1="640" y1="245" x2="694" y2="180" stroke="#9333ea" stroke-width="1.5" fill="none" marker-end="url(#cov)"/>
  <line x1="640" y1="300" x2="694" y2="320" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#cov)"/>

  <!-- ================= doctrine bar ================= -->
  <rect x="60" y="430" width="810" height="78" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="80" y="452" font-size="11.5" font-weight="700" fill="#0f172a">The named-gap doctrine</text>
  <g font-size="10.5" fill="#475569">
    <text x="80" y="472">a gap requires a reason with a closure &#183; a covered gap is STALE and fails &#183; a mandatory component is covered</text>
    <text x="80" y="488">with documentation or gapped with a reason — silence fails &#183; the pair is the fulfilment documentation.</text>
  </g>
  <text x="80" y="504" font-size="10" fill="#64748b">abstract processes: directly mapped or named-gapped — shall provisions inherit their bound process's mapping only.</text>

  <!-- ================= BOTTOM BAR ================= -->
  <rect x="60" y="530" width="810" height="76" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1"/>
  <text x="80" y="553" font-size="11.5" font-weight="600" fill="#3730a3">&#8220;Does this platform fulfil the scheme?&#8221; is a graph computation, not a document review.</text>
  <text x="80" y="571" font-size="11" fill="#4338ca">The operator reads the gaps as the build list; the assessor reads the pairs as the evidence — descriptions and</text>
  <text x="80" y="587" font-size="11" fill="#4338ca">justifications against real records, the asserted coverage recomputed at every validate run.</text>
</svg>
