<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="fwref" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="fwblock" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="fwdel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9333ea"/>
    </marker>
  </defs>

  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">The B 18:2025 constitution — five framework files</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">Kinds and rules, never instances. Solid arrows are link-checked references (R25); the red edge is the signing gate.</text>

  <!-- ================= participants.yaml ================= -->
  <rect x="60" y="86" width="250" height="150" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
  <rect x="60" y="86" width="250" height="30" rx="12" fill="#4f46e5"/>
  <text x="185" y="106" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">participants.yaml &#183; clause 5</text>
  <g font-size="10.5" fill="#3730a3">
    <text x="74" y="134">issuing_authority (3.28, &#167;5.2)</text>
    <text x="74" y="148">test_laboratory (3.40, &#167;5.3) + 3 subkinds</text>
    <text x="74" y="162">utilizer &#183; associate (&#167;5.6)</text>
    <text x="74" y="176">applicant &#8594; certificate_owner (3.3 Note)</text>
    <text x="74" y="190">experts LME / MSE (PD-02)</text>
    <text x="74" y="204">7 organs as actors (mandate only)</text>
  </g>
  <text x="74" y="226" font-size="10" font-weight="600" fill="#4338ca">competence: delegates_to &#167;5.2 / &#167;5.3</text>

  <!-- ================= documents.yaml ================= -->
  <rect x="590" y="86" width="250" height="150" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="1.8"/>
  <rect x="590" y="86" width="250" height="30" rx="12" fill="#475569"/>
  <text x="715" y="106" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">documents.yaml &#183; clause 6</text>
  <g font-size="10.5" fill="#334155">
    <text x="604" y="134">hierarchy a)&#8211;e): B 18 &gt; CID-01 &gt;</text>
    <text x="604" y="148">OD &gt; PD &gt; guidance, forms, templates</text>
    <text x="604" y="166">higher position prevails</text>
    <text x="604" y="188" font-weight="600">auto_inclusion (&#167;4.2 a&#8211;d):</text>
    <text x="604" y="202">requirements &#183; test procedures &#183;</text>
    <text x="604" y="216">TRF &#183; type evaluation report format</text>
  </g>

  <!-- ================= schemes.yaml ================= -->
  <rect x="60" y="296" width="250" height="160" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <rect x="60" y="296" width="250" height="30" rx="12" fill="#16a34a"/>
  <text x="185" y="316" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">schemes.yaml &#183; &#167;4.3, clause 15</text>
  <g font-size="10.5" fill="#14532d">
    <text x="74" y="344">Scheme B — self-declaration (&#167;5.4.2)</text>
    <text x="74" y="358">Scheme A — peer evaluation (&#167;5.4.3)</text>
  </g>
  <rect x="80" y="378" width="84" height="26" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
  <text x="122" y="395" font-size="10" fill="#14532d" text-anchor="middle">SCHEME_B</text>
  <rect x="206" y="378" width="84" height="26" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
  <text x="248" y="395" font-size="10" fill="#14532d" text-anchor="middle">SCHEME_A</text>
  <line x1="164" y1="391" x2="202" y2="391" stroke="#16a34a" stroke-width="1.6" fill="none" marker-end="url(#fwref)"/>
  <text x="183" y="382" font-size="9" fill="#15803d" text-anchor="middle">2 years &#167;15.2</text>
  <text x="74" y="428" font-size="10" font-weight="600" fill="#15803d">entry: SCHEME_B on inclusion (&#167;15.1)</text>
  <text x="74" y="442" font-size="10" font-weight="600" fill="#15803d">CIML: early &#167;15.2 &#183; defer &#167;15.3 &#183; reverse &#167;15.7</text>

  <!-- ================= declarations.yaml ================= -->
  <rect x="590" y="296" width="250" height="160" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <rect x="590" y="296" width="250" height="30" rx="12" fill="#dc2626"/>
  <text x="715" y="316" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">declarations.yaml &#183; PD-08</text>
  <g font-size="10.5" fill="#7f1d1d">
    <text x="604" y="344">3 kinds: IA (&#167;5.5.1) &#183; Utilizer (&#167;5.6.1)</text>
    <text x="604" y="358">&#183; Associate (&#167;5.6.2) — TLs sign none</text>
    <text x="604" y="376">scope: categories &#215; schemes (cl. 4 a)</text>
    <text x="604" y="390">statuses: draft &#8594; signed &#8594; suspended</text>
    <text x="604" y="404">&#8594; withdrawn</text>
  </g>
  <text x="604" y="432" font-size="10" font-weight="700" fill="#b91c1c">signing gate (cl. 5): blocks issue, evaluation</text>
  <text x="604" y="446" font-size="10" fill="#7f1d1d">unsigned &#183; suspended &#183; out-of-scope &#8658; blocked</text>

  <!-- ================= CASCO chip (bottom left) ================= -->
  <rect x="60" y="486" width="230" height="120" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <rect x="60" y="486" width="230" height="28" rx="12" fill="#d97706"/>
  <text x="175" y="505" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">the CASCO foundation (ch. 2)</text>
  <g font-size="10" fill="#78350f">
    <text x="74" y="532">iso-iec-17065 (IA competence)</text>
    <text x="74" y="546">iso-iec-17025 (TL competence)</text>
    <text x="74" y="568" font-weight="600">delegated, never restated —</text>
    <text x="74" y="582" font-weight="600">the delegates_to targets</text>
  </g>

  <!-- ================= governance.yaml ================= -->
  <rect x="325" y="486" width="250" height="120" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="1.8"/>
  <rect x="325" y="486" width="250" height="28" rx="12" fill="#9333ea"/>
  <text x="450" y="505" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">governance.yaml &#183; clauses 9&#8211;16</text>
  <g font-size="10.5" fill="#581c87">
    <text x="339" y="534">MC 80 % participation votes (&#167;11.4.2)</text>
    <text x="339" y="548">TLF advisory (&#167;12.2) &#183; BoA rulings (&#167;13.2)</text>
    <text x="339" y="562">registered-copy validity (&#167;15.8)</text>
    <text x="339" y="576">no entrance fees (&#167;16.3)</text>
  </g>

  <!-- ================= framework.ts chip (bottom right) ================= -->
  <rect x="610" y="486" width="230" height="120" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
  <rect x="610" y="486" width="230" height="28" rx="12" fill="#475569"/>
  <text x="725" y="505" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">browser/src/data/framework.ts</text>
  <g font-size="10" fill="#334155">
    <text x="624" y="532">evaluateSchemeLifecycle — the</text>
    <text x="624" y="546">&#167;15.2 two-year timer</text>
    <text x="624" y="568">checkSigningGate — the PD-08</text>
    <text x="624" y="582">cl. 5 gate. Pure functions, one home.</text>
  </g>

  <!-- ================= REFERENCE EDGES (slate) ================= -->
  <g stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#fwref)">
    <!-- participants.declaration -> declarations kinds -->
    <line x1="310" y1="200" x2="655" y2="292"/>
    <!-- schemes entry conditions_ref -> documents auto_inclusion -->
    <line x1="310" y1="340" x2="640" y2="240"/>
  </g>
  <g font-size="9.5" fill="#475569">
    <text x="360" y="206" text-anchor="middle">declaration: &#8594; declaration kinds</text>
    <text x="360" y="334" text-anchor="middle">conditions_ref: auto_inclusion</text>
  </g>

  <!-- ================= DELEGATION EDGE (violet dashed, left margin) ================= -->
  <polyline points="60,150 34,150 34,545 58,545" stroke="#9333ea" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#fwdel)"/>
  <text x="26" y="350" font-size="9.5" fill="#7e22ce" text-anchor="middle" transform="rotate(-90 26 350)">delegates_to: iso-iec-17065 &#183; iso-iec-17025</text>

  <!-- ================= SIGNING GATE EDGE (red) ================= -->
  <line x1="715" y1="456" x2="715" y2="482" stroke="#dc2626" stroke-width="1.8" fill="none" marker-end="url(#fwblock)"/>
  <text x="725" y="466" font-size="9.5" fill="#b91c1c">the gate calculus executes it</text>

  <!-- governance decision edges to schemes + declarations -->
  <g stroke="#9333ea" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#fwdel)">
    <line x1="360" y1="486" x2="270" y2="460"/>
    <line x1="540" y1="486" x2="630" y2="460"/>
  </g>
  <g font-size="9.5" fill="#7e22ce">
    <text x="272" y="478" font-size="9.5" text-anchor="end">decision: {rule}</text>
    <text x="560" y="472" font-size="9.5">decision: {rule}</text>
  </g>

  <!-- ================= BOTTOM BAR ================= -->
  <rect x="60" y="632" width="780" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="80" y="653" font-size="11.5" font-weight="600" fill="#0f172a">The constitution models kinds and rules — instances and enforcement are the runtimes (chapters 5&#8211;6).</text>
  <text x="80" y="671" font-size="11" fill="#475569">Every clause anchor cites the official published PDF; the local presentation XML (official&#8722;1) is never cited.</text>
</svg>
