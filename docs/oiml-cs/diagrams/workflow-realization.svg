<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="real" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">The certification workflow — abstract scheme process, concrete Core realization</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">Left: what PD-05 requires (abstract, clause-anchored, activity-tagged). Right: what the platform walks. Arrows are realized_by.</text>

  <text x="190" y="82" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">ABSTRACT — data/oiml-cs/evaluation/abstract-processes.yaml</text>
  <text x="700" y="82" font-size="11" font-weight="700" fill="#4338ca" text-anchor="middle">CONCRETE — data/core/evaluation/processes.yaml</text>

  <!-- ================= ABSTRACT STEPS ================= -->
  <g font-size="10.5">
    <rect x="60" y="92" width="260" height="52" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="74" y="113" font-weight="700" fill="#14532d">1 application &#183; &#167;4.1</text>
    <text x="74" y="131" fill="#15803d">[selection]</text>

    <rect x="60" y="158" width="260" height="52" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="74" y="179" font-weight="700" fill="#14532d">2 review &#183; &#167;4.2</text>
    <text x="74" y="197" fill="#15803d">[selection]</text>

    <rect x="60" y="224" width="260" height="52" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="74" y="245" font-weight="700" fill="#7f1d1d">3 dispatch &#183; &#167;4.3.1</text>
    <text x="74" y="263" fill="#b91c1c">untagged &#183; platform addition</text>

    <rect x="60" y="290" width="260" height="52" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="74" y="311" font-weight="700" fill="#14532d">4 testing &#183; &#167;4.3</text>
    <text x="74" y="329" fill="#15803d">[testing]</text>

    <rect x="60" y="356" width="260" height="52" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="74" y="377" font-weight="700" fill="#14532d">5 evaluation &#183; &#167;4.5</text>
    <text x="74" y="395" fill="#15803d">[selection, determination]</text>

    <rect x="60" y="422" width="260" height="52" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="74" y="443" font-weight="700" fill="#14532d">6 decision &#183; &#167;4.5.6</text>
    <text x="74" y="461" fill="#15803d">[decision]</text>

    <rect x="60" y="488" width="260" height="52" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="74" y="509" font-weight="700" fill="#14532d">7 issue &#183; &#167;4.6</text>
    <text x="74" y="527" fill="#15803d">[certification]</text>

    <rect x="60" y="554" width="260" height="52" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="74" y="575" font-weight="700" fill="#14532d">8 biml_registration &#183; clause 6</text>
    <text x="74" y="593" fill="#15803d">[attestation]</text>
  </g>

  <!-- ================= CONCRETE PROCESSES ================= -->
  <g font-size="10.5">
    <rect x="560" y="92" width="280" height="46" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="574" y="120" font-weight="700" fill="#3730a3">submit_application</text>

    <rect x="560" y="158" width="280" height="60" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="574" y="179" font-weight="700" fill="#3730a3">review_application</text>
    <text x="574" y="197" fill="#4338ca">accept_application &#183; reject_application</text>
    <text x="574" y="212" font-size="9.5" fill="#4338ca">(&#167;4.2.5&#8211;4.2.9 notices, refusal grounds a&#8211;d)</text>

    <rect x="560" y="290" width="280" height="52" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="574" y="311" font-weight="700" fill="#3730a3">conduct_tests &#183; compile_test_report</text>
    <text x="574" y="329" font-size="9.5" fill="#4338ca">the 18-element checklist gates compilation (&#167;4.4)</text>

    <rect x="560" y="372" width="280" height="56" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="574" y="393" font-weight="700" fill="#3730a3">compile_evaluation_report</text>
    <text x="574" y="411" font-size="9.5" fill="#4338ca">realizes steps 5+6 — incl. the &#167;4.5.6 conclusion</text>

    <rect x="560" y="488" width="280" height="46" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="574" y="516" font-weight="700" fill="#3730a3">issue_certificate</text>

    <rect x="560" y="554" width="280" height="46" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="574" y="582" font-weight="700" fill="#3730a3">register_certificate</text>
  </g>

  <!-- ================= realized_by EDGES ================= -->
  <g stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#real)">
    <line x1="320" y1="118" x2="554" y2="115"/>
    <line x1="320" y1="184" x2="554" y2="186"/>
    <line x1="320" y1="316" x2="554" y2="314"/>
    <line x1="320" y1="382" x2="554" y2="392"/>
    <line x1="320" y1="448" x2="554" y2="408"/>
    <line x1="320" y1="514" x2="554" y2="511"/>
    <line x1="320" y1="580" x2="554" y2="577"/>
  </g>

  <!-- dispatch named gap -->
  <text x="437" y="243" font-size="10" font-weight="700" fill="#b91c1c" text-anchor="middle">NAMED GAP</text>
  <text x="437" y="258" font-size="9.5" fill="#b91c1c" text-anchor="middle">PD-05 defines no dispatch step</text>

  <!-- ================= BOTTOM BAR ================= -->
  <rect x="60" y="626" width="780" height="60" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="80" y="647" font-size="11.5" font-weight="700" fill="#78350f">platform-to-oiml-cs.prm — every pair documented (description + justification), every gap named with a reason.</text>
  <text x="80" y="663" font-size="11" fill="#78350f">Gate state: 42 mandatory components, 37 covered, 5 justified named gaps — 42 of 49 components at full cover. The asserted</text>
  <text x="80" y="679" font-size="11" fill="#78350f">coverage block equals the computed one (the tripwire): coverage claims are computed, never authored.</text>
</svg>
