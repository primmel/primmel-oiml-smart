<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 684" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9333ea"/>
    </marker>
  </defs>

  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">Secondary models anchor to the subject</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">Requirement: binds aspect paths · Test: targets, constrains, observes · Form: binds fields into the chain.</text>

  <!-- Requirement satellite -->
  <rect x="60" y="86" width="260" height="100" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
  <text x="76" y="110" font-size="13" font-weight="700" fill="#1e293b">Requirement (secondary)</text>
  <text x="76" y="128" font-size="11" fill="#4f46e5">/req/metrological/mpe</text>
  <text x="76" y="148" font-size="10.5" fill="#475569">statement + clause reference + binds_to</text>
  <text x="76" y="164" font-size="10.5" fill="#475569">limit ocl{…} + uses · applicability</text>

  <!-- ConformanceTest satellite -->
  <rect x="580" y="86" width="250" height="100" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
  <text x="596" y="110" font-size="13" font-weight="700" fill="#1e293b">ConformanceTest (secondary)</text>
  <text x="596" y="128" font-size="11" fill="#4f46e5">/conf/metrological-tests/creep</text>
  <text x="596" y="148" font-size="10.5" fill="#475569">targets · variables (source + derivation)</text>
  <text x="596" y="164" font-size="10.5" fill="#475569">steps · preconditions · pass_if</text>

  <!-- Subject (center) -->
  <rect x="290" y="226" width="320" height="240" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="450" y="250" font-size="14" font-weight="700" fill="#3730a3" text-anchor="middle">Subject — LoadCell</text>
  <text x="450" y="266" font-size="10.5" fill="#4f46e5" text-anchor="middle">primary tier · the chain Family → Group → Model → Sample</text>

  <rect x="310" y="284" width="280" height="46" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="322" y="303" font-size="11" font-weight="600" fill="#14532d">IS — what it is by design</text>
  <text x="322" y="319" font-size="10" fill="#166534">e_max · designed conditions · promises</text>

  <rect x="310" y="338" width="280" height="46" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="322" y="357" font-size="11" font-weight="600" fill="#78350f">HAS — what it exhibits</text>
  <text x="322" y="373" font-size="10" fill="#92600e">d_max · accuracy_class · state · e_l</text>

  <rect x="310" y="392" width="280" height="46" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="322" y="411" font-size="11" font-weight="600" fill="#7f1d1d">DOES — what it does</text>
  <text x="322" y="427" font-size="10" fill="#991b1b">behaviors: creep · repeatability · durability</text>

  <!-- relations (violet) -->
  <g stroke="#9333ea" stroke-width="1.6" fill="none">
    <line x1="578" y1="118" x2="322" y2="118" marker-end="url(#arr)"/>
    <path d="M 290 186 C 272 224, 252 262, 306 303" marker-end="url(#arr)"/>
    <path d="M 170 186 C 160 250, 190 320, 306 357" marker-end="url(#arr)"/>
    <path d="M 640 186 C 650 250, 632 310, 594 348" marker-end="url(#arr)"/>
    <path d="M 700 186 C 712 260, 664 344, 594 376" marker-end="url(#arr)"/>
    <line x1="760" y1="186" x2="760" y2="516" marker-end="url(#arr)"/>
    <line x1="640" y1="520" x2="640" y2="470" marker-end="url(#arr)"/>
  </g>
  <g fill="#9333ea">
    <text x="450" y="110" font-size="10.5" font-weight="600" text-anchor="middle">targets</text>
    <text x="252" y="282" font-size="10.5" font-weight="600" text-anchor="end">binds_to</text>
    <text x="252" y="296" font-size="10" text-anchor="end">model.parameters.e_max</text>
    <text x="220" y="318" font-size="10" text-anchor="end">sample.test_context.d_max</text>
    <text x="220" y="332" font-size="10" text-anchor="end">observable:e_l</text>
    <text x="656" y="250" font-size="10.5" font-weight="600">constrains</text>
    <text x="656" y="264" font-size="10">inputs · conditions · state</text>
    <text x="672" y="314" font-size="10.5" font-weight="600">observes →</text>
    <text x="672" y="328" font-size="10">characteristics (e_l, c_c)</text>
    <text x="774" y="380" font-size="10.5" font-weight="600">result_forms</text>
    <text x="774" y="394" font-size="10">evidence lands</text>
    <text x="774" y="408" font-size="10">in the form</text>
    <text x="654" y="492" font-size="10.5" font-weight="600">bind: fields into the chain</text>
    <text x="654" y="506" font-size="10">prefill · write-through</text>
  </g>

  <!-- Form satellite -->
  <rect x="580" y="520" width="250" height="96" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
  <text x="596" y="542" font-size="13" font-weight="700" fill="#1e293b">Form (secondary)</text>
  <text x="596" y="558" font-size="11" fill="#4f46e5">r60-3/table-6.8 (creep-dr)</text>
  <text x="596" y="576" font-size="10.5" fill="#475569">bind: fields + unbound evidence slots</text>
  <text x="596" y="592" font-size="10.5" fill="#475569">measurement_method · pass_fail</text>

  <!-- Tertiary note -->
  <rect x="60" y="520" width="260" height="96" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="76" y="542" font-size="11.5" font-weight="700" fill="#475569">Tertiary tier (consumes, never contains)</text>
  <text x="76" y="560" font-size="10" fill="#64748b">test runs · evidence records · verdicts</text>
  <text x="76" y="576" font-size="10" fill="#64748b">verdicts re-execute requirement limits</text>
  <text x="76" y="592" font-size="10" fill="#64748b">against form evidence (INV-4 firewall)</text>

  <!-- bottom bar -->
  <rect x="60" y="636" width="780" height="36" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="80" y="652" font-size="11.5" font-weight="600" fill="#0f172a">The anchor set makes coverage a graph property:</text>
  <text x="80" y="666" font-size="11" fill="#475569">aspect ↔ requirement ↔ test ↔ form ↔ verdict — closure computed by the linter, not opined in review.</text>
</svg>
