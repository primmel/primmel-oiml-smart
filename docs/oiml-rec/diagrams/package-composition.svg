<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrow-violet" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#9333ea"/>
    </marker>
    <marker id="arrow-slate" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">Package composition — core + modules + overlay</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">A rec package composes by uses: reference upstream ids, never redefine them. The build composes one virtual tree per rec.</text>

  <!-- Rec overlay -->
  <rect x="60" y="84" width="400" height="124" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
  <rect x="60" y="84" width="400" height="32" rx="12" fill="#4f46e5"/>
  <text x="260" y="105" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Rec overlay — data/r60 · kind: rec</text>
  <g font-size="11" fill="#3730a3">
    <text x="78" y="136">subject · dimensions · attributes · behaviors</text>
    <text x="78" y="154">requirements · conformance tests · forms · tables</text>
    <text x="78" y="172">evaluation overlay: gateways, certificate template,</text>
    <text x="78" y="188">lab/sample selection · sample-data seed</text>
  </g>

  <!-- uses arrow 1 -->
  <line x1="260" y1="208" x2="260" y2="232" stroke="#9333ea" stroke-width="2.2" marker-end="url(#arrow-violet)"/>
  <text x="274" y="226" font-size="11" font-weight="600" fill="#9333ea">uses</text>

  <!-- Shared modules -->
  <rect x="60" y="236" width="400" height="164" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="1.8"/>
  <rect x="60" y="236" width="400" height="32" rx="12" fill="#9333ea"/>
  <text x="260" y="257" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Shared modules — data/modules/* (7 families)</text>
  <g font-size="10.5" fill="#6b21a8">
    <text x="78" y="290">emc-disturbances</text>
    <text x="78" y="308">env-iec60068</text>
    <text x="78" y="326">software-d31</text>
    <text x="78" y="344">reference-materials</text>
    <text x="248" y="290">specimen-governance</text>
    <text x="248" y="308">report-headers</text>
    <text x="248" y="326">examination-docs</text>
  </g>
  <text x="78" y="374" font-size="9.5" font-style="italic" fill="#7e22ce">method + form skeletons; the rec binds its own ids, severities,</text>
  <text x="78" y="388" font-size="9.5" font-style="italic" fill="#7e22ce">acceptance expressions and clause URNs</text>

  <!-- uses arrow 2 -->
  <line x1="260" y1="400" x2="260" y2="424" stroke="#9333ea" stroke-width="2.2" marker-end="url(#arrow-violet)"/>
  <text x="274" y="418" font-size="11" font-weight="600" fill="#9333ea">uses</text>

  <!-- Core -->
  <rect x="60" y="428" width="400" height="130" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="1.8"/>
  <rect x="60" y="428" width="400" height="32" rx="12" fill="#475569"/>
  <text x="260" y="449" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Core — data/core · kind: core (never a rec)</text>
  <g font-size="11" fill="#334155">
    <text x="78" y="480">subject chain + parties + workflow entities</text>
    <text x="78" y="498">evaluation skeletons: state machines, approvals, roles</text>
    <text x="78" y="516">OIML-CS 18-element checklist · obligation catalog</text>
    <text x="78" y="534">value-type base (SI unit register)</text>
  </g>

  <!-- merge arrows into the virtual tree -->
  <g stroke="#94a3b8" stroke-width="1.6" fill="none">
    <line x1="460" y1="146" x2="530" y2="228" marker-end="url(#arrow-slate)"/>
    <line x1="460" y1="318" x2="530" y2="256" marker-end="url(#arrow-slate)"/>
    <line x1="460" y1="493" x2="530" y2="288" marker-end="url(#arrow-slate)"/>
  </g>

  <!-- Composed virtual tree -->
  <rect x="536" y="190" width="304" height="118" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
  <text x="688" y="216" font-size="13" font-weight="700" fill="#3730a3" text-anchor="middle">Composed virtual tree</text>
  <g font-size="10.5" fill="#4f46e5" text-anchor="middle">
    <text x="688" y="238">core + modules + overlay, topologically merged</text>
    <text x="688" y="256">one id space per rec</text>
    <text x="688" y="274">duplicate id across layers = linker error</text>
    <text x="688" y="292">generators consume it unchanged</text>
  </g>

  <!-- consumed-by arrow -->
  <line x1="688" y1="308" x2="688" y2="340" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <text x="700" y="330" font-size="10" fill="#475569">consumed by</text>

  <!-- Codegen -->
  <rect x="536" y="344" width="304" height="168" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="1.8"/>
  <rect x="536" y="344" width="304" height="30" rx="12" fill="#475569"/>
  <text x="688" y="364" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Build codegen</text>
  <g font-size="10.5" fill="#334155">
    <text x="552" y="394">standards-registry → standards-meta</text>
    <text x="552" y="414">data-types-codegen → types + store manifest</text>
    <text x="552" y="434">sample-data-compiler → seed records</text>
    <text x="552" y="454">schema-validator → npm run validate</text>
  </g>
  <text x="552" y="482" font-size="9.5" font-style="italic" fill="#64748b">shared classes emitted once, from oiml-core</text>

  <!-- bottom rule bar -->
  <rect x="60" y="586" width="780" height="58" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="1"/>
  <text x="80" y="610" font-size="11.5" font-weight="600" fill="#0f172a">The composition law — reference, never redefine:</text>
  <text x="80" y="628" font-size="11" fill="#475569">an overlay binds upstream ids (entities, skeletons, checklists); restating one is a linker error. Order: core → modules → rec.</text>
</svg>
