<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f46e5"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">The test-sequence gate — order is declared data, violation invalidates</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">R39 checks the declaration (test XOR phase · refs resolve · depends_on earlier, acyclic) · the admissibility path enforces it.</text>

  <!-- Sequence 1: mdlo-creep-dr -->
  <text x="60" y="92" font-size="13" font-weight="700" fill="#1e293b">Sequence <tspan font-family="ui-monospace, monospace" font-size="12">mdlo-creep-dr</tspan> — same sample, same lab visit (R 60-2, 2.10 + 2.11.1/2.11.2 + 2.9.2)</text>

  <rect x="60" y="106" width="230" height="96" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
  <text x="76" y="128" font-size="11" font-weight="700" fill="#3730a3">order 1 · role baseline</text>
  <text x="76" y="148" font-size="12" font-weight="700" fill="#1e293b">MDLO test</text>
  <text x="76" y="166" font-size="10.5" fill="#475569">measurement error + repeatability</text>
  <text x="76" y="184" font-size="10.5" fill="#475569">establishes the baseline</text>

  <rect x="335" y="106" width="230" height="96" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
  <text x="351" y="128" font-size="11" font-weight="700" fill="#475569">order 2 · role follow_up · depends_on 1</text>
  <text x="351" y="148" font-size="12" font-weight="700" fill="#1e293b">Creep test</text>
  <text x="351" y="166" font-size="10.5" fill="#475569">30 min under D_max</text>
  <text x="351" y="184" font-size="10.5" fill="#475569">before MDLO ⇒ baseline contaminated</text>

  <rect x="610" y="106" width="230" height="96" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
  <text x="626" y="128" font-size="11" font-weight="700" fill="#475569">order 3 · role follow_up · depends_on 2</text>
  <text x="626" y="148" font-size="12" font-weight="700" fill="#1e293b">DR test</text>
  <text x="626" y="166" font-size="10.5" fill="#475569">D_min reading AFTER the creep</text>
  <text x="626" y="184" font-size="10.5" fill="#475569">loading — chained by physics (2.9.2)</text>

  <g stroke="#4f46e5" stroke-width="1.8" fill="none">
    <line x1="290" y1="154" x2="331" y2="154" marker-end="url(#arrI)"/>
    <line x1="565" y1="154" x2="606" y2="154" marker-end="url(#arrI)"/>
  </g>

  <!-- Sequence 2: temperature-cycling -->
  <text x="60" y="248" font-size="13" font-weight="700" fill="#1e293b">Sequence <tspan font-family="ui-monospace, monospace" font-size="12">temperature-cycling</tspan> — the environment program (R 60-2, 2.10.1.13)</text>

  <g>
    <rect x="60" y="262" width="170" height="56" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
    <text x="145" y="285" font-size="11.5" font-weight="600" fill="#78350f" text-anchor="middle">phase 1 · 20 °C</text>
    <text x="145" y="303" font-size="10" fill="#92600e" text-anchor="middle">reference</text>
    <rect x="258" y="262" width="170" height="56" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
    <text x="343" y="285" font-size="11.5" font-weight="600" fill="#78350f" text-anchor="middle">phase 2 · T_high</text>
    <text x="343" y="303" font-size="10" fill="#92600e" text-anchor="middle">then the higher temperature</text>
    <rect x="456" y="262" width="170" height="56" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
    <text x="541" y="285" font-size="11.5" font-weight="600" fill="#78350f" text-anchor="middle">phase 3 · T_low</text>
    <text x="541" y="303" font-size="10" fill="#92600e" text-anchor="middle">then the lower temperature</text>
    <rect x="654" y="262" width="186" height="56" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
    <text x="747" y="285" font-size="11.5" font-weight="600" fill="#78350f" text-anchor="middle">phase 4 · 20 °C return</text>
    <text x="747" y="303" font-size="10" fill="#92600e" text-anchor="middle">the operations of 2.10.1.3 per step</text>
  </g>
  <g stroke="#d97706" stroke-width="1.6" fill="none">
    <line x1="230" y1="290" x2="254" y2="290" marker-end="url(#arrS)"/>
    <line x1="428" y1="290" x2="452" y2="290" marker-end="url(#arrS)"/>
    <line x1="626" y1="290" x2="650" y2="290" marker-end="url(#arrS)"/>
  </g>
  <text x="60" y="344" font-size="10.5" fill="#64748b">phase steps carry no test ref — the program orders the environment and gates no run by itself.</text>

  <!-- The gate -->
  <text x="60" y="398" font-size="13" font-weight="700" fill="#1e293b">The gate — a scheduled run meets the declared order</text>

  <rect x="60" y="412" width="370" height="66" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="76" y="434" font-size="11.5" font-weight="700" fill="#14532d">In order — ADMISSIBLE</text>
  <text x="76" y="452" font-size="10.5" fill="#166534">the run proceeds (PLANNED → evidence → COMPLETED);</text>
  <text x="76" y="468" font-size="10.5" fill="#166534">the sequence is invisible, as it should be</text>

  <rect x="470" y="412" width="370" height="66" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="486" y="434" font-size="11.5" font-weight="700" fill="#7f1d1d">Out of order — INADMISSIBLE ⇒ INVALIDATED</text>
  <text x="486" y="452" font-size="10.5" fill="#991b1b">the run is voided as a run; the verdict chain never fires</text>
  <text x="486" y="468" font-size="10.5" fill="#991b1b">(the task-29 doctrine — same as a violated precondition)</text>

  <!-- never fail stamp -->
  <g>
    <rect x="610" y="500" width="230" height="44" rx="22" fill="#ffffff" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="725" y="520" font-size="11.5" font-weight="700" fill="#dc2626" text-anchor="middle">never FAIL</text>
    <text x="725" y="536" font-size="9.5" fill="#991b1b" text-anchor="middle">the instrument was never on trial</text>
    <line x1="655" y1="478" x2="690" y2="502" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrR)"/>
  </g>
  <text x="60" y="528" font-size="10.5" fill="#475569">A sequence violation says the <tspan font-weight="700">program</tspan> was wrong, not the instrument —</text>
  <text x="60" y="544" font-size="10.5" fill="#475569">so the outcome is a voided run, and no verdict path fires.</text>

  <!-- bottom bar -->
  <rect x="60" y="576" width="780" height="48" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="80" y="597" font-size="11.5" font-weight="600" fill="#0f172a">Order is data: specification/test-sequences.yaml — declared once, R39-checked, scheduler-consumed.</text>
  <text x="80" y="614" font-size="11" fill="#475569">The two R 60 pilots prove both shapes: test-ordered (mdlo-creep-dr) and phase-ordered (temperature-cycling).</text>
</svg>
