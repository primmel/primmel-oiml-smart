<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrCv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f46e5"/>
    </marker>
    <marker id="arrCr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">The competence cover — test declares, laboratory covers, refusal is explicit</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">required_competence (the test's demand) vs accreditation_scope (the lab's offer) — uncovered ⇒ named refusal, never a silent assignment.</text>

  <!-- test side -->
  <rect x="60" y="86" width="330" height="200" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="76" y="110" font-size="13" font-weight="700" fill="#3730a3">The test declares its demand</text>
  <text x="76" y="128" font-size="10.5" fill="#4f46e5">required_competence: on every conformance test (R29)</text>

  <rect x="76" y="142" width="298" height="62" rx="8" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.2"/>
  <text x="88" y="161" font-size="10.5" font-weight="700" fill="#1e293b">kind: force_measurement</text>
  <text x="88" y="178" font-size="10" fill="#475569" font-family="ui-monospace, monospace">range { max: e_max, unit: kg }</text>
  <text x="88" y="194" font-size="9.5" fill="#64748b">parameter-bound — resolved against the dispatch context</text>

  <rect x="76" y="212" width="298" height="62" rx="8" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.2"/>
  <text x="88" y="231" font-size="10.5" font-weight="700" fill="#1e293b">kind: temperature_control</text>
  <text x="88" y="248" font-size="10" fill="#475569" font-family="ui-monospace, monospace">range { min: t_min, max: t_max, unit: degC }</text>
  <text x="88" y="264" font-size="9.5" fill="#64748b">stability ≤ 2 °C (R 60-2, 2.7.3.1)</text>

  <!-- lab side -->
  <rect x="510" y="86" width="330" height="200" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="526" y="110" font-size="13" font-weight="700" fill="#14532d">The laboratory declares its offer</text>
  <text x="526" y="128" font-size="10.5" fill="#166534">accreditation_scope: on the TestLaboratory (number-only ranges)</text>

  <rect x="526" y="142" width="298" height="62" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
  <text x="538" y="161" font-size="10.5" font-weight="700" fill="#1e293b">kind: force_measurement</text>
  <text x="538" y="178" font-size="10" fill="#475569" font-family="ui-monospace, monospace">range { min: 20, max: 61183, unit: kg }</text>
  <text x="538" y="194" font-size="9.5" fill="#64748b">substantiated: equipment_refs → the deadweight machine</text>

  <rect x="526" y="212" width="298" height="62" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
  <text x="538" y="231" font-size="10.5" font-weight="700" fill="#1e293b">kind: temperature_control</text>
  <text x="538" y="248" font-size="10" fill="#475569" font-family="ui-monospace, monospace">range { min: -40, max: 80, unit: degC }</text>
  <text x="538" y="264" font-size="9.5" fill="#64748b">personnel_refs — referenced, never copied</text>

  <!-- the calculus -->
  <path d="M 450 330 L 510 370 L 450 410 L 390 370 z" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <text x="450" y="362" font-size="10.5" font-weight="700" fill="#78350f" text-anchor="middle">covers(scope,</text>
  <text x="450" y="376" font-size="10.5" font-weight="700" fill="#78350f" text-anchor="middle">required)?</text>
  <text x="450" y="394" font-size="8.5" fill="#92600e" text-anchor="middle">one home: competence.ts</text>

  <line x1="300" y1="286" x2="410" y2="346" stroke="#4f46e5" stroke-width="1.6" marker-end="url(#arrCv)"/>
  <line x1="600" y1="286" x2="490" y2="346" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrCv)"/>

  <text x="450" y="432" font-size="9.5" fill="#475569" text-anchor="middle">kind equal · range covers · method_standard equal-or-compatible · resolution/stability at-least-as-good (lab ≤ required)</text>

  <!-- outcomes -->
  <rect x="60" y="456" width="380" height="84" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="76" y="478" font-size="11.5" font-weight="700" fill="#14532d">Covered — eligible</text>
  <text x="76" y="496" font-size="10.5" fill="#166534">planDispatch ranks the covering labs in caller order (the IA's</text>
  <text x="76" y="512" font-size="10.5" fill="#166534">preference); the first covering lab wins the assignment —</text>
  <text x="76" y="528" font-size="10.5" fill="#166534">preference decides only among labs that can</text>

  <rect x="460" y="456" width="380" height="84" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="476" y="478" font-size="11.5" font-weight="700" fill="#7f1d1d">Uncovered — explicit refusal</text>
  <text x="476" y="496" font-size="10.5" fill="#991b1b">the lab is ineligible for the test, and the refusal names the</text>
  <text x="476" y="512" font-size="10.5" fill="#991b1b">uncovered entries — never a silent assignment, never a</text>
  <text x="476" y="528" font-size="10.5" fill="#991b1b">silent pass</text>

  <line x1="450" y1="410" x2="250" y2="452" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrCv)"/>
  <line x1="450" y1="410" x2="650" y2="452" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrCr)"/>

  <!-- bottom bar -->
  <rect x="60" y="566" width="780" height="56" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="80" y="588" font-size="11.5" font-weight="600" fill="#0f172a">Eligibility is computed; a negative answer names its reason — the admissibility-gate doctrine, at dispatch.</text>
  <text x="80" y="606" font-size="11" fill="#475569">Proven: the R 60 programme dispatches MTL-first; EMC, power, barometric and software spill to the covering NMI.</text>
</svg>
