<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">Layer 0 — IS: the ground of individuation</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">IS ⊆ O × O — relates an object to another object (often a kind).</text>

  <!-- Formal signature box -->
  <rect x="60" y="90" width="280" height="80" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
  <text x="80" y="116" font-size="12" font-weight="700" fill="#0f172a">Formal signature</text>
  <text x="80" y="140" font-size="14" font-family="ui-monospace, Menlo, monospace" fill="#0f172a">IS  ⊆  O × O</text>
  <text x="80" y="158" font-size="10" fill="#475569">codomain is O — kinds are objects (Rule 1)</text>

  <!-- Example: Rex is a mammal -->
  <rect x="380" y="90" width="460" height="200" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <rect x="380" y="90" width="460" height="32" rx="10" fill="#16a34a"/>
  <text x="610" y="111" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Example — "Rex is a mammal"</text>

  <!-- Rex object -->
  <circle cx="470" cy="200" r="50" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="470" y="196" font-size="13" font-weight="700" fill="#3730a3" text-anchor="middle">Rex</text>
  <text x="470" y="214" font-size="9.5" fill="#4f46e5" text-anchor="middle">instance object</text>

  <!-- Arrow: IS -->
  <line x1="525" y1="200" x2="700" y2="200" stroke="#16a34a" stroke-width="2.4" marker-end="url(#isa)"/>
  <text x="612" y="188" font-size="13" font-weight="700" fill="#16a34a" text-anchor="middle">IS</text>
  <text x="612" y="222" font-size="9.5" font-style="italic" fill="#166534" text-anchor="middle">"is a kind of"</text>

  <!-- Mammal object (a kind) -->
  <rect x="710" y="160" width="120" height="80" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="770" y="194" font-size="13" font-weight="700" fill="#3730a3" text-anchor="middle">mammal</text>
  <text x="770" y="212" font-size="9.5" fill="#4f46e5" text-anchor="middle">abstract object</text>
  <text x="770" y="226" font-size="9.5" fill="#4f46e5" text-anchor="middle">(a kind)</text>

  <!-- Annotation under arrow -->
  <text x="610" y="270" font-size="10" fill="#475569" text-anchor="middle">Both ends are members of O. The right end is an object that</text>
  <text x="610" y="284" font-size="10" fill="#475569" text-anchor="middle">itself bears properties (warm blood, hair) — see Closure Rule 1.</text>

  <!-- Two jobs of IS -->
  <rect x="60" y="220" width="280" height="200" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <rect x="60" y="220" width="280" height="32" rx="10" fill="#d97706"/>
  <text x="200" y="241" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">IS does two jobs</text>

  <text x="80" y="276" font-size="11" font-weight="700" fill="#78350f">1. Identity</text>
  <text x="80" y="292" font-size="10.5" fill="#92600e">"this is the same entity as before"</text>
  <text x="80" y="306" font-size="10" fill="#92600e">individuation criterion — lets us</text>
  <text x="80" y="320" font-size="10" fill="#92600e">track a persisting subject</text>
  <text x="80" y="334" font-size="10" fill="#92600e">through change.</text>

  <text x="80" y="362" font-size="11" font-weight="700" fill="#78350f">2. Kind-membership</text>
  <text x="80" y="378" font-size="10.5" fill="#92600e">"this falls under that kind"</text>
  <text x="80" y="392" font-size="10" fill="#92600e">type-grain individuation.</text>
  <text x="80" y="406" font-size="10" fill="#92600e">Both jobs are IS(x, y) with y ∈ O.</text>

  <!-- Key claim -->
  <rect x="380" y="310" width="460" height="110" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="400" y="334" font-size="11.5" font-weight="700" fill="#7f1d1d">Key claim — IS is logically prior to HAS</text>
  <text x="400" y="356" font-size="10.5" fill="#991b1b">A value that happens never to change is contingent constancy. An IS-fact</text>
  <text x="400" y="370" font-size="10.5" fill="#991b1b">is individuating necessity — losing it doesn't change the entity, it dissolves</text>
  <text x="400" y="384" font-size="10.5" fill="#991b1b">what counted as the entity at all.</text>
  <text x="400" y="406" font-size="10.5" font-style="italic" fill="#dc2626">IS is therefore the precondition for property-tracking to be meaningful.</text>

  <!-- Bottom -->
  <rect x="60" y="490" width="780" height="80" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="80" y="514" font-size="11" font-weight="700" fill="#3730a3">Why this matters for the algebra</text>
  <text x="80" y="534" font-size="10.5" fill="#4338ca">Because IS ⊆ O × O has codomain O (not a separate TYPE sort), the system</text>
  <text x="80" y="548" font-size="10.5" fill="#4338ca">needs no ninth primitive for "type." Type-membership and instance-identity</text>
  <text x="80" y="562" font-size="10.5" fill="#4338ca">are the same relation at different grains — see Closure Rule 1.</text>

  <defs>
    <marker id="isa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
