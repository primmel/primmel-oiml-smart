<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">Layer 3 — DOES, TRANSITION: the dynamic axis</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">t : V_in → V_out — input, transform, output. Transitions compose (and the composite is a transition).</text>

  <!-- Formal signature -->
  <rect x="60" y="90" width="280" height="100" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
  <text x="80" y="116" font-size="12" font-weight="700" fill="#0f172a">Formal signature</text>
  <text x="80" y="142" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#0f172a">DOES  ⊆  O × T</text>
  <text x="80" y="162" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#0f172a">t  :  V_in  →  V_out</text>
  <text x="80" y="180" font-size="10" fill="#475569">input → transform → output</text>

  <!-- A single transition -->
  <rect x="380" y="90" width="460" height="160" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <rect x="380" y="90" width="460" height="32" rx="10" fill="#dc2626"/>
  <text x="610" y="111" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">A transition — input → transform → output</text>

  <!-- Input port -->
  <rect x="400" y="170" width="100" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="450" y="194" font-size="11" font-weight="700" fill="#14532d" text-anchor="middle">V_in</text>
  <text x="450" y="212" font-size="9.5" fill="#166534" text-anchor="middle">input value</text>

  <!-- Transform box -->
  <rect x="540" y="160" width="140" height="76" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="610" y="190" font-size="13" font-weight="700" fill="#7f1d1d" text-anchor="middle">t</text>
  <text x="610" y="208" font-size="9.5" fill="#991b1b" text-anchor="middle">transform rule</text>
  <text x="610" y="222" font-size="9" font-style="italic" fill="#991b1b" text-anchor="middle">e.g. "boils water"</text>

  <!-- Output port -->
  <rect x="720" y="170" width="100" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="770" y="194" font-size="11" font-weight="700" fill="#14532d" text-anchor="middle">V_out</text>
  <text x="770" y="212" font-size="9.5" fill="#166534" text-anchor="middle">output value</text>

  <!-- Arrows -->
  <line x1="500" y1="198" x2="540" y2="198" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="680" y1="198" x2="720" y2="198" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- Composition: two transitions become one -->
  <rect x="60" y="220" width="280" height="220" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <rect x="60" y="220" width="280" height="32" rx="10" fill="#d97706"/>
  <text x="200" y="241" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Transitions compose</text>

  <!-- t1 -->
  <rect x="80" y="270" width="80" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="120" y="286" font-size="11" font-weight="700" fill="#7f1d1d" text-anchor="middle">t₁</text>
  <text x="120" y="300" font-size="8.5" fill="#991b1b" text-anchor="middle">A → B</text>

  <!-- t2 -->
  <rect x="240" y="270" width="80" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="280" y="286" font-size="11" font-weight="700" fill="#7f1d1d" text-anchor="middle">t₂</text>
  <text x="280" y="300" font-size="8.5" fill="#991b1b" text-anchor="middle">B → C</text>

  <line x1="160" y1="290" x2="240" y2="290" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- t2 ∘ t1 -->
  <rect x="140" y="370" width="120" height="50" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="200" y="388" font-size="11.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">t₂ ∘ t₁</text>
  <text x="200" y="404" font-size="9.5" fill="#991b1b" text-anchor="middle">A → C (composite)</text>

  <line x1="200" y1="316" x2="200" y2="370" stroke="#475569" stroke-width="1.4" stroke-dasharray="3,2"/>

  <text x="200" y="424" font-size="9.5" font-style="italic" fill="#92600e" text-anchor="middle">same shape, larger grain</text>

  <!-- The recursion result -->
  <rect x="380" y="270" width="460" height="170" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="400" y="294" font-size="11.5" font-weight="700" fill="#3730a3">The recursion result</text>
  <text x="400" y="316" font-size="10.5" fill="#4338ca">A step is a small process. A process is a large step.</text>
  <text x="400" y="334" font-size="10.5" fill="#4338ca">"Transition between steps" and "transition between processes"</text>
  <text x="400" y="348" font-size="10.5" fill="#4338ca">are the same operation at different scales.</text>
  <text x="400" y="372" font-size="10.5" fill="#4338ca">Composition never produces a new kind of arrow.</text>
  <text x="400" y="396" font-size="10" font-style="italic" fill="#4f46e5">Categorically: transitions are morphisms; objects are value-interfaces;</text>
  <text x="400" y="410" font-size="10" font-style="italic" fill="#4f46e5">closure under composition is definitional. See Chapter 9.</text>

  <!-- Boundary interface callout -->
  <rect x="60" y="490" width="780" height="80" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="80" y="514" font-size="11" font-weight="700" fill="#7f1d1d">Boundary, not identity</text>
  <text x="80" y="534" font-size="10.5" fill="#991b1b">The input need not be the same object as the output. The transition is</text>
  <text x="80" y="548" font-size="10.5" fill="#991b1b">specified by its interface — V_in on one side, V_out on the other — not by</text>
  <text x="80" y="562" font-size="10.5" fill="#991b1b">mutating a specific receiver. This is what makes composition well-defined.</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
</svg>
