<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="ui-sans-serif, system-ui, sans-serif">
  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">Algorithm — evaluation (runtime protocol)</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">Apply a transition to a bound input. Same protocol for atomic steps and composed processes.</text>

  <!-- Signature -->
  <rect x="60" y="90" width="780" height="56" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/>
  <text x="80" y="124" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#115e59">eval :  T × V_in  →  V_out × O-state</text>

  <!-- Flowchart -->
  <rect x="60" y="170" width="780" height="320" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.4"/>

  <!-- Input pair -->
  <rect x="100" y="200" width="200" height="80" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <rect x="100" y="200" width="200" height="26" rx="10" fill="#dc2626"/>
  <text x="200" y="218" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Input pair</text>
  <text x="200" y="246" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#7f1d1d" text-anchor="middle">(t, input)</text>
  <text x="200" y="266" font-size="9" fill="#991b1b" text-anchor="middle">transition + bound value</text>

  <line x1="300" y1="240" x2="350" y2="240" stroke="#475569" stroke-width="1.8" marker-end="url(#ev-arr)"/>

  <!-- Decision: atomic or composite? -->
  <polygon points="450,200 540,240 450,280 360,240" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text x="450" y="232" font-size="10" font-weight="700" fill="#78350f" text-anchor="middle">Atomic?</text>
  <text x="450" y="248" font-size="9" fill="#92600e" text-anchor="middle">or composite?</text>

  <!-- Atomic branch (up) -->
  <line x1="450" y1="200" x2="450" y2="180" stroke="#475569" stroke-width="1.4"/>
  <line x1="450" y1="180" x2="620" y2="180" stroke="#475569" stroke-width="1.4"/>
  <line x1="620" y1="180" x2="620" y2="220" stroke="#475569" stroke-width="1.4" marker-end="url(#ev-arr)"/>
  <text x="510" y="172" font-size="9" fill="#16a34a" text-anchor="middle">yes</text>

  <rect x="540" y="220" width="180" height="50" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="630" y="240" font-size="10" font-weight="700" fill="#14532d" text-anchor="middle">Apply t's implementation</text>
  <text x="630" y="256" font-size="9" fill="#166534" text-anchor="middle">to input</text>

  <!-- Composite branch (down) -->
  <line x1="450" y1="280" x2="450" y2="320" stroke="#475569" stroke-width="1.4" marker-end="url(#ev-arr)"/>
  <text x="460" y="304" font-size="9" fill="#d97706">no</text>

  <rect x="350" y="320" width="220" height="76" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="460" y="340" font-size="10" font-weight="700" fill="#7f1d1d" text-anchor="middle">Recursively eval first sub-t</text>
  <text x="460" y="356" font-size="9" fill="#991b1b" text-anchor="middle">thread output to next sub-t</text>
  <text x="460" y="376" font-size="9" font-style="italic" fill="#dc2626" text-anchor="middle">(composition in action)</text>

  <line x1="570" y1="358" x2="620" y2="358" stroke="#475569" stroke-width="1.4"/>
  <line x1="620" y1="358" x2="620" y2="280" stroke="#475569" stroke-width="1.4" marker-end="url(#ev-arr)"/>

  <!-- Output -->
  <line x1="720" y1="245" x2="780" y2="245" stroke="#475569" stroke-width="1.8" marker-end="url(#ev-arr)"/>
  <rect x="780" y="200" width="60" height="100" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
  <text x="810" y="220" font-size="10" font-weight="700" fill="#3730a3" text-anchor="middle">Output</text>
  <text x="810" y="244" font-size="9" font-family="ui-monospace, Menlo, monospace" fill="#4338ca" text-anchor="middle">output</text>
  <text x="810" y="262" font-size="9" font-family="ui-monospace, Menlo, monospace" fill="#4338ca" text-anchor="middle">+</text>
  <text x="810" y="280" font-size="9" font-family="ui-monospace, Menlo, monospace" fill="#4338ca" text-anchor="middle">new</text>
  <text x="810" y="292" font-size="9" font-family="ui-monospace, Menlo, monospace" fill="#4338ca" text-anchor="middle">state</text>

  <!-- Side panel: composition matters -->
  <rect x="100" y="320" width="220" height="120" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="120" y="344" font-size="10.5" font-weight="700" fill="#3730a3">Why composition matters</text>
  <text x="120" y="362" font-size="9.5" fill="#4338ca">Because t₂ ∘ t₁ is itself a</text>
  <text x="120" y="376" font-size="9.5" fill="#4338ca">transition, the same eval</text>
  <text x="120" y="390" font-size="9.5" fill="#4338ca">protocol handles atomic</text>
  <text x="120" y="404" font-size="9.5" fill="#4338ca">steps and composed processes.</text>
  <text x="120" y="424" font-size="9" font-style="italic" fill="#4f46e5">No second interpreter for</text>
  <text x="120" y="436" font-size="9" font-style="italic" fill="#4f46e5">"the whole process."</text>

  <!-- Bottom -->
  <rect x="60" y="510" width="780" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="80" y="532" font-size="11" font-weight="700" fill="#7f1d1d">Scale invariance, in one sentence</text>
  <text x="80" y="552" font-size="10.5" fill="#991b1b">There is no second interpreter for "the whole process" versus "one step." Composition closure</text>
  <text x="80" y="566" font-size="10.5" fill="#991b1b">(Theorem 1, Chapter 4) means the same protocol serves every grain.</text>

  <defs>
    <marker id="ev-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
</svg>
