<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">FAQ — where do I look?</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">Decision tree: pick your question type, follow the arrow to the chapter that answers it.</text>

  <!-- Root -->
  <rect x="350" y="100" width="200" height="56" rx="10" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <text x="450" y="124" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">What's your question?</text>
  <text x="450" y="142" font-size="10" fill="#475569" text-anchor="middle">pick a category</text>

  <!-- 4 branches -->
  <g stroke="#94a3b8" stroke-width="1.4" fill="none">
    <line x1="380" y1="156" x2="180" y2="220"/>
    <line x1="420" y1="156" x2="370" y2="220"/>
    <line x1="480" y1="156" x2="540" y2="220"/>
    <line x1="520" y1="156" x2="730" y2="220"/>
  </g>

  <!-- Branch 1: candidate primitives -->
  <rect x="60" y="220" width="240" height="170" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <rect x="60" y="220" width="240" height="32" rx="10" fill="#dc2626"/>
  <text x="180" y="241" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">"Why not X?"</text>
  <text x="180" y="270" font-size="10" fill="#7f1d1d" text-anchor="middle">candidate primitives:</text>
  <g font-size="10" fill="#991b1b">
    <text x="80" y="294">STATE, STEP, CAN,</text>
    <text x="80" y="308">RECEIVES, RELATES-TO,</text>
    <text x="80" y="322">BECOMES, TIME</text>
  </g>
  <text x="180" y="356" font-size="10" font-weight="700" fill="#7f1d1d" text-anchor="middle">→ Chapter 7</text>
  <text x="180" y="372" font-size="9" font-style="italic" fill="#991b1b" text-anchor="middle">derived vocabulary proofs</text>

  <!-- Branch 2: methodology comparison -->
  <rect x="320" y="220" width="240" height="170" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <rect x="320" y="220" width="240" height="32" rx="10" fill="#d97706"/>
  <text x="440" y="241" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">"vs other methodologies?"</text>
  <text x="440" y="270" font-size="10" fill="#78350f" text-anchor="middle">comparisons:</text>
  <g font-size="10" fill="#92600e">
    <text x="340" y="294">OOP, UML, BPMN,</text>
    <text x="340" y="308">EXPRESS, RDF/OWL,</text>
    <text x="340" y="322">Petri nets, OPM,</text>
    <text x="340" y="336">SysML v2 / KerML</text>
  </g>
  <text x="440" y="366" font-size="10" font-weight="700" fill="#78350f" text-anchor="middle">→ Chapter 8</text>
  <text x="440" y="380" font-size="9" font-style="italic" fill="#92600e" text-anchor="middle">comparative analysis</text>

  <!-- Branch 3: foundations -->
  <rect x="580" y="220" width="240" height="170" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <rect x="580" y="220" width="240" height="32" rx="10" fill="#16a34a"/>
  <text x="700" y="241" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">"Formal grounding?"</text>
  <text x="700" y="270" font-size="10" fill="#14532d" text-anchor="middle">the math:</text>
  <g font-size="10" fill="#166534">
    <text x="600" y="294">eight terms, closure</text>
    <text x="600" y="308">rules, theorems,</text>
    <text x="600" y="322">kernel/surface arch,</text>
    <text x="600" y="336">category theory</text>
  </g>
  <text x="700" y="366" font-size="10" font-weight="700" fill="#14532d" text-anchor="middle">→ Chapters 3–6, 9</text>
  <text x="700" y="380" font-size="9" font-style="italic" fill="#166534" text-anchor="middle">formal system + categorical</text>

  <!-- Branch 4: limits and adoption -->
  <rect x="820" y="220" width="60" height="170" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
  <rect x="820" y="220" width="60" height="32" rx="10" fill="#475569"/>
  <text x="850" y="241" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">limits?</text>
  <text x="850" y="270" font-size="9" fill="#334155" text-anchor="middle">→ Ch 11</text>

  <!-- Bottom: quick start -->
  <rect x="60" y="430" width="780" height="150" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="80" y="454" font-size="12" font-weight="700" fill="#3730a3">If you only have ten minutes</text>
  <text x="80" y="476" font-size="10.5" fill="#4338ca">Read [Chapter 1 §1.1 The three natural questions](01-intuition.md).</text>

  <text x="80" y="504" font-size="12" font-weight="700" fill="#3730a3">If you have an hour</text>
  <text x="80" y="524" font-size="10.5" fill="#4338ca">Read Chapters 1–4 (Novice track + Professional start).</text>

  <text x="80" y="552" font-size="12" font-weight="700" fill="#3730a3">If you want to defend the system against a skeptic</text>
  <text x="80" y="572" font-size="10.5" fill="#4338ca">Read Chapters 2, 4, 7, 8, 11 — the falsifiability and comparative chapters.</text>
</svg>
