<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="ui-sans-serif, system-ui, sans-serif">
  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">STATE = (ρ(t), t_i) — a positional identifier</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">Not a property of the entity. A pointer pair: which execution, and where it currently stands.</text>

  <!-- Equation -->
  <rect x="60" y="90" width="780" height="56" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/>
  <text x="80" y="124" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#115e59">STATE(e)  =  (instance-identity, current-node-address)  =  (ρ(t), t_i)</text>

  <!-- Two readings distinguished -->
  <rect x="60" y="170" width="380" height="200" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <rect x="60" y="170" width="380" height="32" rx="10" fill="#dc2626"/>
  <text x="250" y="191" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">"Data state" — rejected reading</text>
  <text x="80" y="226" font-size="10.5" font-weight="700" fill="#7f1d1d">Example</text>
  <text x="80" y="244" font-size="10" fill="#991b1b">"The kettle's temperature is 100°C"</text>
  <text x="80" y="270" font-size="10.5" font-weight="700" fill="#7f1d1d">What it really is</text>
  <text x="80" y="288" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#991b1b">HAS(kettle)(temperature) = 100</text>
  <text x="80" y="310" font-size="10" fill="#991b1b">— a value-reading at a moment.</text>
  <text x="80" y="324" font-size="10" fill="#991b1b">No new primitive needed.</text>
  <text x="80" y="350" font-size="10" font-style="italic" fill="#dc2626">Already covered by HAS (Layer 2).</text>

  <!-- Control state — the live contender -->
  <rect x="460" y="170" width="380" height="200" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <rect x="460" y="170" width="380" height="32" rx="10" fill="#16a34a"/>
  <text x="650" y="191" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">"Control state" — the reduction</text>
  <text x="480" y="226" font-size="10.5" font-weight="700" fill="#14532d">Example</text>
  <text x="480" y="244" font-size="10" fill="#166534">"Process run #42 is paused before step 4"</text>
  <text x="480" y="270" font-size="10.5" font-weight="700" fill="#14532d">What it really is</text>
  <text x="480" y="288" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#166534">σ(e) = (ρ(t), t_i)</text>
  <text x="480" y="310" font-size="10" fill="#166534">— a pointer into the process's structure.</text>
  <text x="480" y="324" font-size="10" fill="#166534">Not a property of the entity.</text>
  <text x="480" y="350" font-size="10" font-style="italic" fill="#16a34a">A locator, like a program counter.</text>

  <!-- Composite decomposition -->
  <rect x="60" y="390" width="780" height="180" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="80" y="414" font-size="12" font-weight="700" fill="#3730a3">The composite — both halves come from existing sorts</text>

  <rect x="100" y="430" width="320" height="120" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
  <text x="260" y="452" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">First half: ρ(t)</text>
  <text x="260" y="472" font-size="10" fill="#475569" text-anchor="middle">which execution are we talking about?</text>
  <text x="260" y="492" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#115e59" text-anchor="middle">supplied by IS via reification</text>
  <text x="260" y="518" font-size="9" font-style="italic" fill="#4f46e5" text-anchor="middle">an object-reference (existing sort)</text>

  <rect x="460" y="430" width="320" height="120" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
  <text x="620" y="452" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Second half: t_i</text>
  <text x="620" y="472" font-size="10" fill="#475569" text-anchor="middle">which transition is currently active?</text>
  <text x="620" y="492" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#115e59" text-anchor="middle">read from execution's HAS-facts</text>
  <text x="620" y="518" font-size="9" font-style="italic" fill="#4f46e5" text-anchor="middle">an object-reference (existing sort)</text>
</svg>
