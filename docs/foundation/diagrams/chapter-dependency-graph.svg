<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="ui-sans-serif, system-ui, sans-serif">
  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">Chapter dependency graph</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">Each chapter depends only on chapters to its left. Read in order, or skip forward if you already know the prerequisites.</text>

  <!-- Layer columns labels -->
  <text x="100" y="100" font-size="11" font-weight="700" fill="#16a34a" text-anchor="middle">Novice</text>
  <text x="290" y="100" font-size="11" font-weight="700" fill="#d97706" text-anchor="middle">Professional</text>
  <text x="690" y="100" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">Expert</text>

  <!-- Novice -->
  <rect x="40" y="200" width="120" height="56" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="100" y="223" font-size="11" font-weight="700" fill="#14532d" text-anchor="middle">01</text>
  <text x="100" y="240" font-size="9.5" fill="#166534" text-anchor="middle">Intuition</text>

  <rect x="40" y="290" width="120" height="56" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="100" y="313" font-size="11" font-weight="700" fill="#14532d" text-anchor="middle">02</text>
  <text x="100" y="330" font-size="9.5" fill="#166534" text-anchor="middle">Claims &amp; Falsifiability</text>

  <!-- Professional -->
  <rect x="220" y="120" width="140" height="56" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text x="290" y="143" font-size="11" font-weight="700" fill="#78350f" text-anchor="middle">03</text>
  <text x="290" y="160" font-size="9.5" fill="#92600e" text-anchor="middle">Eight Terms</text>

  <rect x="220" y="200" width="140" height="56" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text x="290" y="223" font-size="11" font-weight="700" fill="#78350f" text-anchor="middle">04</text>
  <text x="290" y="240" font-size="9.5" fill="#92600e" text-anchor="middle">Proofs</text>

  <rect x="220" y="290" width="140" height="56" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text x="290" y="313" font-size="11" font-weight="700" fill="#78350f" text-anchor="middle">05</text>
  <text x="290" y="330" font-size="9.5" fill="#92600e" text-anchor="middle">Kernel/Surface</text>

  <rect x="220" y="380" width="140" height="56" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text x="290" y="403" font-size="11" font-weight="700" fill="#78350f" text-anchor="middle">06</text>
  <text x="290" y="420" font-size="9.5" fill="#92600e" text-anchor="middle">Algorithms</text>

  <rect x="220" y="470" width="140" height="56" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text x="290" y="493" font-size="11" font-weight="700" fill="#78350f" text-anchor="middle">07</text>
  <text x="290" y="510" font-size="9.5" fill="#92600e" text-anchor="middle">Derived Vocabulary</text>

  <!-- Expert -->
  <rect x="620" y="160" width="140" height="56" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="690" y="183" font-size="11" font-weight="700" fill="#7f1d1d" text-anchor="middle">08</text>
  <text x="690" y="200" font-size="9.5" fill="#991b1b" text-anchor="middle">Comparative Analysis</text>

  <rect x="620" y="240" width="140" height="56" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="690" y="263" font-size="11" font-weight="700" fill="#7f1d1d" text-anchor="middle">09</text>
  <text x="690" y="280" font-size="9.5" fill="#991b1b" text-anchor="middle">Categorical Found.</text>

  <rect x="620" y="320" width="140" height="56" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="690" y="343" font-size="11" font-weight="700" fill="#7f1d1d" text-anchor="middle">10</text>
  <text x="690" y="360" font-size="9.5" fill="#991b1b" text-anchor="middle">Executable Ground</text>

  <rect x="620" y="400" width="140" height="56" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="690" y="423" font-size="11" font-weight="700" fill="#7f1d1d" text-anchor="middle">11</text>
  <text x="690" y="440" font-size="9.5" fill="#991b1b" text-anchor="middle">Open Questions</text>

  <!-- Dependencies (arrows) -->
  <g stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#dep)">
    <!-- 01 → 02 -->
    <line x1="100" y1="256" x2="100" y2="290"/>
    <!-- 01,02 → 03 -->
    <line x1="160" y1="228" x2="220" y2="148"/>
    <line x1="160" y1="318" x2="220" y2="148"/>
    <!-- 03 → 04 -->
    <line x1="290" y1="176" x2="290" y2="200"/>
    <!-- 03 → 05 -->
    <line x1="290" y1="176" x2="290" y2="290" stroke-dasharray="3,2"/>
    <!-- 05 → 06 -->
    <line x1="290" y1="346" x2="290" y2="380"/>
    <!-- 05 → 07 -->
    <line x1="290" y1="346" x2="290" y2="470" stroke-dasharray="3,2"/>
    <!-- 04 → 07 (proofs inform derived vocab) -->
    <line x1="290" y1="256" x2="290" y2="470" stroke-dasharray="3,2"/>
    <!-- 05 → 08, 09 -->
    <line x1="360" y1="318" x2="620" y2="188"/>
    <line x1="360" y1="318" x2="620" y2="268"/>
    <!-- 09 → 10 -->
    <line x1="690" y1="296" x2="690" y2="320"/>
    <!-- 08,10 → 11 -->
    <line x1="690" y1="216" x2="690" y2="400" stroke-dasharray="3,2"/>
    <line x1="690" y1="376" x2="690" y2="400"/>
  </g>

  <defs>
    <marker id="dep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Legend -->
  <rect x="40" y="556" width="820" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="60" y="576" font-size="10" fill="#475569">
    Solid arrow: direct prerequisite. Dashed arrow: conceptual dependency (read for context, not strictly required).
  </text>
</svg>
