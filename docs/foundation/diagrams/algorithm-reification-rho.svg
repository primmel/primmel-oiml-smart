<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="ui-sans-serif, system-ui, sans-serif">
  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">Algorithm — reification (the ρ map)</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">Turn a transition into an object that can bear IS and HAS facts like any other.</text>

  <!-- Signature -->
  <rect x="60" y="90" width="780" height="56" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/>
  <text x="80" y="124" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#115e59">ρ :  T  →  O</text>

  <!-- Input: transition t -->
  <rect x="80" y="180" width="220" height="160" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <rect x="80" y="180" width="220" height="32" rx="10" fill="#dc2626"/>
  <text x="190" y="201" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Input: transition t</text>
  <text x="190" y="234" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#7f1d1d" text-anchor="middle">t : V_in → V_out</text>
  <text x="190" y="262" font-size="10" fill="#991b1b" text-anchor="middle">a rule — abstract,</text>
  <text x="190" y="276" font-size="10" fill="#991b1b" text-anchor="middle">a definition, not a run</text>
  <text x="190" y="304" font-size="9" font-style="italic" fill="#dc2626" text-anchor="middle">e.g. "boil_water"</text>
  <text x="190" y="320" font-size="9" font-style="italic" fill="#dc2626" text-anchor="middle">cold_water → boiling_water</text>

  <!-- The ρ map -->
  <line x1="300" y1="260" x2="430" y2="260" stroke="#4f46e5" stroke-width="2.4" marker-end="url(#rho-arr2)"/>
  <text x="365" y="248" font-size="18" font-weight="700" fill="#4f46e5" text-anchor="middle">ρ</text>
  <text x="365" y="280" font-size="9" font-style="italic" fill="#4f46e5" text-anchor="middle">reify</text>

  <!-- Steps above the arrow -->
  <rect x="320" y="170" width="90" height="50" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="365" y="186" font-size="9" font-weight="700" fill="#78350f" text-anchor="middle">Allocate</text>
  <text x="365" y="200" font-size="8" fill="#92600e" text-anchor="middle">fresh object</text>
  <text x="365" y="212" font-size="8" fill="#92600e" text-anchor="middle">ρ(t) ∈ O</text>

  <rect x="320" y="300" width="90" height="50" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="365" y="316" font-size="9" font-weight="700" fill="#78350f" text-anchor="middle">Attach</text>
  <text x="365" y="330" font-size="8" fill="#92600e" text-anchor="middle">IS + HAS</text>
  <text x="365" y="342" font-size="8" fill="#92600e" text-anchor="middle">facts</text>

  <!-- Output: ρ(t) -->
  <rect x="440" y="180" width="380" height="280" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="440" y="180" width="380" height="32" rx="10" fill="#4f46e5"/>
  <text x="630" y="201" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Output: ρ(t) — an object</text>

  <text x="460" y="236" font-size="10.5" font-weight="700" fill="#14532d">IS-facts</text>
  <text x="460" y="252" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#166534">ρ(t) is itself</text>
  <text x="460" y="266" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#166534">ρ(t) IS ProcessRun</text>

  <text x="460" y="296" font-size="10.5" font-weight="700" fill="#78350f">HAS-facts</text>
  <text x="460" y="312" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#92600e">started-at = 2026-07-22T11:02</text>
  <text x="460" y="326" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#92600e">current-position = "heating"</text>
  <text x="460" y="340" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#92600e">transition = t</text>
  <text x="460" y="354" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#92600e">bound-input = {cold_water}</text>

  <text x="460" y="384" font-size="10.5" font-weight="700" fill="#3730a3">Queryable, pausable,</text>
  <text x="460" y="398" font-size="10.5" font-weight="700" fill="#3730a3">retriable, serializable</text>
  <text x="460" y="418" font-size="9" font-style="italic" fill="#4338ca">— like any other object</text>
  <text x="460" y="436" font-size="9" font-style="italic" fill="#4338ca">in the model.</text>

  <!-- Why this matters -->
  <rect x="80" y="380" width="220" height="80" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="100" y="404" font-size="10.5" font-weight="700" fill="#7f1d1d">Why this matters</text>
  <text x="100" y="422" font-size="9.5" fill="#991b1b">Without ρ, a process</text>
  <text x="100" y="436" font-size="9.5" fill="#991b1b">instance would be an</text>
  <text x="100" y="450" font-size="9.5" fill="#991b1b">ephemeral stack frame.</text>

  <!-- Bottom -->
  <rect x="60" y="490" width="780" height="90" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="80" y="514" font-size="11" font-weight="700" fill="#3730a3">The trace is the model at instance grain</text>
  <text x="80" y="534" font-size="10.5" fill="#4338ca">Because ρ(t) ∈ O, the running process is an object in the model. Its IS-facts individuate it</text>
  <text x="80" y="548" font-size="10.5" fill="#4338ca">(which run is this?); its HAS-facts describe it (started-at, current-position, bound-inputs).</text>
  <text x="80" y="568" font-size="10" font-style="italic" fill="#4f46e5">This is what enables provenance, replay, and live introspection — see Chapter 10.</text>

  <defs>
    <marker id="rho-arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f46e5"/>
    </marker>
  </defs>
</svg>
