<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">TIME = ordering from composition + timestamps as values</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">A bonus reduction — falls out free once BECOMES is killed. Time is not a substance; it's an ordering.</text>

  <!-- Equation -->
  <rect x="60" y="90" width="780" height="56" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/>
  <text x="80" y="124" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#115e59">TIME  =  ordering(∘)  +  timestamps-as-values(via HAS)</text>

  <!-- Two pieces -->
  <rect x="60" y="170" width="780" height="240" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
  <rect x="60" y="170" width="780" height="32" rx="10" fill="#475569"/>
  <text x="450" y="191" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Time has two components — both already in the algebra</text>

  <!-- Ordering from composition -->
  <rect x="100" y="220" width="320" height="170" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="260" y="244" font-size="11.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">Ordering from composition</text>

  <!-- t1, t2 visual -->
  <g font-family="ui-monospace, Menlo, monospace">
    <rect x="120" y="270" width="80" height="40" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
    <text x="160" y="288" font-size="11" font-weight="700" fill="#7f1d1d" text-anchor="middle">t₁</text>
    <text x="160" y="302" font-size="9" fill="#991b1b" text-anchor="middle">A → B</text>

    <line x1="200" y1="290" x2="240" y2="290" stroke="#475569" stroke-width="1.6" marker-end="url(#tim-arr)"/>
    <text x="220" y="280" font-size="9" fill="#475569" text-anchor="middle">∘</text>

    <rect x="240" y="270" width="80" height="40" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
    <text x="280" y="288" font-size="11" font-weight="700" fill="#7f1d1d" text-anchor="middle">t₂</text>
    <text x="280" y="302" font-size="9" fill="#991b1b" text-anchor="middle">B → C</text>
  </g>

  <text x="260" y="334" font-size="10" fill="#991b1b" text-anchor="middle">If t₂ ∘ t₁ is well-defined,</text>
  <text x="260" y="348" font-size="10" fill="#991b1b" text-anchor="middle">then t₁ happened before t₂.</text>
  <text x="260" y="372" font-size="9" font-style="italic" fill="#dc2626" text-anchor="middle">Ordering comes from composition.</text>

  <!-- Timestamps as values -->
  <rect x="480" y="220" width="320" height="170" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text x="640" y="244" font-size="11.5" font-weight="700" fill="#78350f" text-anchor="middle">Timestamps as values</text>

  <text x="640" y="280" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#92600e" text-anchor="middle">HAS(event)(time)</text>
  <text x="640" y="296" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#92600e" text-anchor="middle">    = 2026-07-22T11:02</text>

  <text x="640" y="324" font-size="10" fill="#92600e" text-anchor="middle">A timestamp is just a value</text>
  <text x="640" y="338" font-size="10" fill="#92600e" text-anchor="middle">attached via HAS, like any</text>
  <text x="640" y="352" font-size="10" fill="#92600e" text-anchor="middle">other property.</text>
  <text x="640" y="372" font-size="9" font-style="italic" fill="#d97706" text-anchor="middle">No new "Time" sort required.</text>

  <!-- The independent discoveries -->
  <rect x="60" y="430" width="780" height="150" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="80" y="454" font-size="11.5" font-weight="700" fill="#3730a3">The independent discoveries</text>
  <text x="80" y="478" font-size="10.5" fill="#4338ca">This is what physicists and process calculi both discovered independently:</text>
  <text x="80" y="498" font-size="10.5" font-weight="700" fill="#3730a3">Time is not a substance; it's an ordering relation on events.</text>

  <text x="80" y="528" font-size="10.5" fill="#4338ca">• Special relativity: time is the causal ordering of events, not a background stage.</text>
  <text x="80" y="546" font-size="10.5" fill="#4338ca">• π-calculus and CCS: time is the reduction ordering, not a separate dimension.</text>
  <text x="80" y="564" font-size="10.5" fill="#4338ca">• Event-sourced systems: the log is the source of truth; the present state is a fold over it.</text>
  <text x="80" y="576" font-size="10" font-style="italic" fill="#4f46e5">The IS-HAS-DOES system inherits the same insight: composition gives the ordering for free.</text>

  <defs>
    <marker id="tim-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
</svg>
