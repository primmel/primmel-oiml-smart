<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="ui-sans-serif, system-ui, sans-serif">
  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">Tier 1 — the surface (eight primitives)</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">The vocabulary authors actually use. Each carries a distinction the kernel deliberately erases.</text>

  <!-- The 8 primitives in a 4x2 grid -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <!-- IS -->
    <rect x="80" y="100" width="180" height="100" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
    <rect x="80" y="100" width="180" height="28" rx="10" fill="#16a34a"/>
    <text x="170" y="119" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">IS</text>
    <text x="170" y="148" font-size="10" fill="#14532d" text-anchor="middle">attribution — what kind</text>
    <text x="170" y="170" font-size="9" font-style="italic" fill="#166534" text-anchor="middle">rigid classification</text>
    <text x="170" y="186" font-size="9" font-style="italic" fill="#166534" text-anchor="middle">(by axiom)</text>

    <!-- HAS -->
    <rect x="280" y="100" width="180" height="100" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
    <rect x="280" y="100" width="180" height="28" rx="10" fill="#d97706"/>
    <text x="370" y="119" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">HAS</text>
    <text x="370" y="148" font-size="10" fill="#78350f" text-anchor="middle">attribution — what value</text>
    <text x="370" y="170" font-size="9" font-style="italic" fill="#92600e" text-anchor="middle">along which property</text>

    <!-- DOES -->
    <rect x="480" y="100" width="180" height="100" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
    <rect x="480" y="100" width="180" height="28" rx="10" fill="#dc2626"/>
    <text x="570" y="119" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">DOES</text>
    <text x="570" y="148" font-size="10" fill="#7f1d1d" text-anchor="middle">dynamics — what transition</text>
    <text x="570" y="170" font-size="9" font-style="italic" fill="#991b1b" text-anchor="middle">participation in τ</text>

    <!-- object -->
    <rect x="680" y="100" width="140" height="100" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
    <rect x="680" y="100" width="140" height="28" rx="10" fill="#4f46e5"/>
    <text x="750" y="119" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">object</text>
    <text x="750" y="148" font-size="10" fill="#3730a3" text-anchor="middle">bearer</text>
    <text x="750" y="170" font-size="9" font-style="italic" fill="#4338ca" text-anchor="middle">claims attach here</text>

    <!-- property -->
    <rect x="80" y="240" width="180" height="100" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
    <rect x="80" y="240" width="180" height="28" rx="10" fill="#d97706"/>
    <text x="170" y="259" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">property</text>
    <text x="170" y="288" font-size="10" fill="#78350f" text-anchor="middle">slot — the dimension</text>
    <text x="170" y="302" font-size="10" fill="#92600e" text-anchor="middle">along which an object varies</text>

    <!-- value -->
    <rect x="280" y="240" width="180" height="100" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
    <rect x="280" y="240" width="180" height="28" rx="10" fill="#16a34a"/>
    <text x="370" y="259" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">value</text>
    <text x="370" y="288" font-size="10" fill="#14532d" text-anchor="middle">content — what fills</text>
    <text x="370" y="302" font-size="10" fill="#166534" text-anchor="middle">a property slot</text>

    <!-- process -->
    <rect x="480" y="240" width="180" height="100" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4,3"/>
    <rect x="480" y="240" width="180" height="28" rx="10" fill="#dc2626"/>
    <text x="570" y="259" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">process</text>
    <text x="570" y="288" font-size="10" fill="#7f1d1d" text-anchor="middle">reified transition</text>
    <text x="570" y="302" font-size="9" font-style="italic" fill="#991b1b" text-anchor="middle">an object that happens</text>
    <text x="570" y="316" font-size="9" font-style="italic" fill="#991b1b" text-anchor="middle">to be a transition</text>

    <!-- transition -->
    <rect x="680" y="240" width="140" height="100" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
    <rect x="680" y="240" width="140" height="28" rx="10" fill="#dc2626"/>
    <text x="750" y="259" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">transition</text>
    <text x="750" y="288" font-size="10" fill="#7f1d1d" text-anchor="middle">rule</text>
    <text x="750" y="302" font-size="9" font-style="italic" fill="#991b1b" text-anchor="middle">input → output</text>
  </g>

  <!-- Why retain them -->
  <rect x="60" y="380" width="780" height="200" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
  <text x="80" y="406" font-size="12" font-weight="700" fill="#0f172a">Why retain them — the questions each answers</text>
  <text x="80" y="428" font-size="10" fill="#475569">If everything were exposed merely as entity + transition, authors would lose intent. The eight primitives</text>
  <text x="80" y="442" font-size="10" fill="#475569">answer these questions by their shape:</text>

  <g font-size="10" fill="#334155">
    <text x="80" y="466">• Is this transition meant to <tspan font-weight="700">observe</tspan> or <tspan font-weight="700">mutate</tspan>?  (PROPERTY vs TRANSITION)</text>
    <text x="80" y="484">• Is this entity a <tspan font-weight="700">literal</tspan>, <tspan font-weight="700">kind</tspan>, <tspan font-weight="700">instance</tspan>, or <tspan font-weight="700">process definition</tspan>?  (VALUE, IS-classification, OBJECT, PROCESS)</text>
    <text x="80" y="502">• Is this reference <tspan font-weight="700">classificatory</tspan>, <tspan font-weight="700">attributive</tspan>, or <tspan font-weight="700">operational</tspan>?  (IS, HAS, DOES)</text>
    <text x="80" y="520">• Is this output a <tspan font-weight="700">computed value</tspan> or a <tspan font-weight="700">new persistent object</tspan>?  (VALUE vs OBJECT)</text>
    <text x="80" y="538">• Is this process <tspan font-weight="700">pure</tspan>, <tspan font-weight="700">stateful</tspan>, <tspan font-weight="700">idempotent</tspan>, <tspan font-weight="700">reversible</tspan>, or <tspan font-weight="700">destructive</tspan>?</text>
    <text x="80" y="562" font-style="italic" fill="#4f46e5">Without the surface vocabulary, these distinctions move from the type system into documentation discipline.</text>
  </g>
</svg>
