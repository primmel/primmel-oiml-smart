<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">Scale invariance — one construct at every scale</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">Statement, function, workflow, service, system — all the same shape, different grain.</text>

  <!-- Equation -->
  <rect x="60" y="90" width="780" height="56" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/>
  <text x="450" y="124" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#115e59" text-anchor="middle">t : V_in → V_out   (one shape, every scale)</text>

  <!-- Five scales -->
  <rect x="60" y="170" width="780" height="320" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
  <rect x="60" y="170" width="780" height="32" rx="10" fill="#475569"/>
  <text x="450" y="191" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Zoom levels of the same construct</text>

  <!-- Scale 1: statement -->
  <g>
    <rect x="90" y="230" width="120" height="50" rx="6" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.4"/>
    <text x="150" y="250" font-size="10" font-weight="700" fill="#115e59" text-anchor="middle">statement</text>
    <text x="150" y="266" font-size="9" font-family="ui-monospace, Menlo, monospace" fill="#0d9488" text-anchor="middle">x := x + 1</text>
    <text x="150" y="294" font-size="9" font-style="italic" fill="#475569" text-anchor="middle">grain: microsecond</text>
  </g>

  <!-- Scale 2: function -->
  <g>
    <rect x="240" y="230" width="120" height="50" rx="6" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.4"/>
    <text x="300" y="250" font-size="10" font-weight="700" fill="#115e59" text-anchor="middle">function</text>
    <text x="300" y="266" font-size="9" font-family="ui-monospace, Menlo, monospace" fill="#0d9488" text-anchor="middle">measure(force)</text>
    <text x="300" y="294" font-size="9" font-style="italic" fill="#475569" text-anchor="middle">grain: millisecond</text>
  </g>

  <!-- Scale 3: workflow -->
  <g>
    <rect x="390" y="230" width="120" height="50" rx="6" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.4"/>
    <text x="450" y="250" font-size="10" font-weight="700" fill="#115e59" text-anchor="middle">workflow</text>
    <text x="450" y="266" font-size="9" font-family="ui-monospace, Menlo, monospace" fill="#0d9488" text-anchor="middle">approve_loan</text>
    <text x="450" y="294" font-size="9" font-style="italic" fill="#475569" text-anchor="middle">grain: minutes</text>
  </g>

  <!-- Scale 4: service -->
  <g>
    <rect x="540" y="230" width="120" height="50" rx="6" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.4"/>
    <text x="600" y="250" font-size="10" font-weight="700" fill="#115e59" text-anchor="middle">service</text>
    <text x="600" y="266" font-size="9" font-family="ui-monospace, Menlo, monospace" fill="#0d9488" text-anchor="middle">payment_api</text>
    <text x="600" y="294" font-size="9" font-style="italic" fill="#475569" text-anchor="middle">grain: hours/days</text>
  </g>

  <!-- Scale 5: system -->
  <g>
    <rect x="690" y="230" width="120" height="50" rx="6" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.4"/>
    <text x="750" y="250" font-size="10" font-weight="700" fill="#115e59" text-anchor="middle">system</text>
    <text x="750" y="266" font-size="9" font-family="ui-monospace, Menlo, monospace" fill="#0d9488" text-anchor="middle">erp_platform</text>
    <text x="750" y="294" font-size="9" font-style="italic" fill="#475569" text-anchor="middle">grain: months/years</text>
  </g>

  <!-- All same shape, shown vertically -->
  <text x="450" y="338" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">All five are the same shape:</text>

  <rect x="350" y="350" width="60" height="30" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="380" y="370" font-size="10" font-weight="700" fill="#14532d" text-anchor="middle">V_in</text>

  <line x1="410" y1="365" x2="440" y2="365" stroke="#475569" stroke-width="1.4" marker-end="url(#sc-arr)"/>

  <rect x="440" y="345" width="80" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="480" y="370" font-size="11" font-weight="700" fill="#7f1d1d" text-anchor="middle">t</text>

  <line x1="520" y1="365" x2="550" y2="365" stroke="#475569" stroke-width="1.4" marker-end="url(#sc-arr)"/>

  <rect x="550" y="350" width="70" height="30" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="585" y="370" font-size="10" font-weight="700" fill="#14532d" text-anchor="middle">V_out</text>

  <text x="450" y="416" font-size="10" font-style="italic" fill="#475569" text-anchor="middle">Different scale, different name, same algebra.</text>
  <text x="450" y="432" font-size="10" font-style="italic" fill="#475569" text-anchor="middle">The runtime evaluates all five with the same protocol.</text>

  <text x="450" y="464" font-size="10" font-weight="700" fill="#115e59" text-anchor="middle">No second interpreter for "the whole" vs "one step."</text>

  <!-- Bottom: the alternative -->
  <rect x="60" y="510" width="780" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="80" y="532" font-size="11" font-weight="700" fill="#7f1d1d">What existing practice does instead</text>
  <text x="80" y="552" font-size="10" fill="#991b1b">Code for the small scale · UML for the middle · BPMN for business · ArchiMate for enterprise.</text>
  <text x="80" y="566" font-size="10" font-style="italic" fill="#dc2626">Each with its own model. Synchronization between them is done by hand — and is the universal failure mode.</text>

  <defs>
    <marker id="sc-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
</svg>
