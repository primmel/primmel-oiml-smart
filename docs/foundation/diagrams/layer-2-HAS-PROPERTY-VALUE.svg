<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="ui-sans-serif, system-ui, sans-serif">
  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">Layer 2 — HAS, PROPERTY, VALUE: the static axis</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">HAS : O → (P ⇀ V) — each object maps to a partial function from properties to values.</text>

  <!-- Formal signature -->
  <rect x="60" y="90" width="280" height="100" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
  <text x="80" y="116" font-size="12" font-weight="700" fill="#0f172a">Formal signature</text>
  <text x="80" y="142" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#0f172a">HAS : O → (P ⇀ V)</text>
  <text x="80" y="162" font-size="10" fill="#475569">P = set of properties (slots)</text>
  <text x="80" y="176" font-size="10" fill="#475569">V = set of values (slot fillers)</text>

  <!-- Example: a dog and its properties -->
  <rect x="380" y="90" width="460" height="240" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <rect x="380" y="90" width="460" height="32" rx="10" fill="#d97706"/>
  <text x="610" y="111" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Example — Rex and his property slots</text>

  <!-- Rex -->
  <circle cx="450" cy="200" r="48" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="450" y="200" font-size="13" font-weight="700" fill="#3730a3" text-anchor="middle">Rex</text>
  <text x="450" y="218" font-size="9.5" fill="#4f46e5" text-anchor="middle">object ∈ O</text>

  <!-- Properties radiating out -->
  <g stroke="#d97706" stroke-width="1.4" fill="none">
    <line x1="490" y1="180" x2="555" y2="148"/>
    <line x1="498" y1="200" x2="555" y2="200"/>
    <line x1="490" y1="220" x2="555" y2="252"/>
  </g>

  <!-- color property -->
  <rect x="560" y="130" width="100" height="38" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="610" y="146" font-size="9.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">color</text>
  <text x="610" y="160" font-size="9" fill="#991b1b" text-anchor="middle">= brown</text>

  <!-- mass property -->
  <rect x="560" y="180" width="100" height="38" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="610" y="196" font-size="9.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">mass</text>
  <text x="610" y="210" font-size="9" fill="#991b1b" text-anchor="middle">= 25 kg</text>

  <!-- owner property — reference value! -->
  <rect x="560" y="230" width="100" height="38" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="610" y="246" font-size="9.5" font-weight="700" fill="#14532d" text-anchor="middle">owner</text>
  <text x="610" y="260" font-size="9" fill="#166534" text-anchor="middle">→ ref(Alice)</text>

  <!-- Alice (referenced object) -->
  <line x1="660" y1="249" x2="730" y2="249" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="3,2"/>
  <circle cx="780" cy="249" r="32" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="780" y="247" font-size="10.5" font-weight="700" fill="#3730a3" text-anchor="middle">Alice</text>
  <text x="780" y="261" font-size="8.5" fill="#4f46e5" text-anchor="middle">an object</text>
  <text x="780" y="294" font-size="8.5" font-style="italic" fill="#166534" text-anchor="middle">ι(Alice) is the value</text>

  <!-- Property vs value distinction -->
  <rect x="60" y="220" width="280" height="200" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <rect x="60" y="220" width="280" height="32" rx="10" fill="#4f46e5"/>
  <text x="200" y="241" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Type/instance split</text>

  <text x="80" y="276" font-size="11" font-weight="700" fill="#3730a3">PROPERTY</text>
  <text x="80" y="292" font-size="10" fill="#4338ca">the slot — the dimension along</text>
  <text x="80" y="306" font-size="10" fill="#4338ca">which an object can vary</text>
  <text x="80" y="320" font-size="9.5" font-style="italic" fill="#4f46e5">e.g. color, mass, owner</text>

  <text x="80" y="350" font-size="11" font-weight="700" fill="#3730a3">VALUE</text>
  <text x="80" y="366" font-size="10" fill="#4338ca">what currently fills the slot</text>
  <text x="80" y="380" font-size="9.5" font-style="italic" fill="#4f46e5">e.g. brown, 25 kg, ref(Alice)</text>

  <text x="80" y="406" font-size="10" fill="#475569">Property is the question;</text>
  <text x="80" y="420" font-size="10" fill="#475569">value is today's answer.</text>

  <!-- Two consequences -->
  <rect x="380" y="350" width="460" height="120" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="400" y="374" font-size="11.5" font-weight="700" fill="#14532d">Two consequences</text>

  <text x="400" y="396" font-size="10.5" fill="#166534">1. Change needs no primitive — "becomes" is the diff between two</text>
  <text x="400" y="410" font-size="10.5" fill="#166534">   timestamped value-readings.</text>

  <text x="400" y="432" font-size="10.5" fill="#166534">2. Values can hold references (Rule 2, §3.8): O ↪ V. "Owned by Alice"</text>
  <text x="400" y="446" font-size="10.5" fill="#166534">   is a property whose value refers to Alice — relational vocabulary</text>
  <text x="400" y="460" font-size="10.5" fill="#166534">   (owns, adjacent-to, depends-on) is derivable, not primitive.</text>

  <!-- Bottom -->
  <rect x="60" y="490" width="780" height="80" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="80" y="514" font-size="11" font-weight="700" fill="#7f1d1d">The trap to avoid</text>
  <text x="80" y="534" font-size="10.5" fill="#991b1b">HAS-property (the slot) and HAS-value (the content) must never be blurred.</text>
  <text x="80" y="548" font-size="10.5" fill="#991b1b">The slot is the dimension; the value is what's measured along it today.</text>
  <text x="80" y="562" font-size="10.5" fill="#991b1b">Conflating them is the classic HAS/STATE confusion — see Chapter 7 §STATE.</text>
</svg>
