<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">Theorem 2 — Completeness (case analysis)</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">By the Claim-Form trichotomy, every atomic claim falls into one of three cases. Each case is caught by a primitive.</text>

  <!-- Root -->
  <rect x="350" y="100" width="200" height="56" rx="10" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <text x="450" y="124" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">atomic claim</text>
  <text x="450" y="142" font-size="10" fill="#475569" text-anchor="middle">about an entity</text>

  <!-- Branch arrows -->
  <g stroke="#94a3b8" stroke-width="1.6" fill="none">
    <line x1="380" y1="156" x2="180" y2="220"/>
    <line x1="450" y1="156" x2="450" y2="220"/>
    <line x1="520" y1="156" x2="720" y2="220"/>
  </g>

  <!-- Case 1: identity -->
  <rect x="60" y="220" width="240" height="240" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <rect x="60" y="220" width="240" height="32" rx="10" fill="#16a34a"/>
  <text x="180" y="241" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Case 1: identity</text>

  <text x="80" y="272" font-size="10.5" font-weight="700" fill="#14532d">Form</text>
  <text x="80" y="290" font-size="10" fill="#166534">"x is the same as before"</text>
  <text x="80" y="304" font-size="10" fill="#166534">"x is a K" (a kind)</text>

  <text x="80" y="332" font-size="10.5" font-weight="700" fill="#14532d">Expressible as</text>
  <text x="80" y="350" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#166534">IS(x, y),  y ∈ O</text>

  <text x="80" y="380" font-size="10.5" font-weight="700" fill="#14532d">Why it works</text>
  <text x="80" y="396" font-size="9.5" fill="#166534">Closure Rule 1: kinds</text>
  <text x="80" y="408" font-size="9.5" fill="#166534">live in O. Type-grain and</text>
  <text x="80" y="420" font-size="9.5" fill="#166534">instance-grain identity use</text>
  <text x="80" y="432" font-size="9.5" fill="#166534">the same relation.</text>
  <text x="80" y="452" font-size="9" font-style="italic" fill="#4d7c0f">✓ caught</text>

  <!-- Case 2: attribution -->
  <rect x="330" y="220" width="240" height="240" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <rect x="330" y="220" width="240" height="32" rx="10" fill="#d97706"/>
  <text x="450" y="241" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Case 2: attribution</text>

  <text x="350" y="272" font-size="10.5" font-weight="700" fill="#78350f">Form</text>
  <text x="350" y="290" font-size="10" fill="#92600e">"x holds v along p"</text>
  <text x="350" y="304" font-size="10" fill="#92600e">"x is owned by y" (relational)</text>

  <text x="350" y="332" font-size="10.5" font-weight="700" fill="#78350f">Expressible as</text>
  <text x="350" y="350" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#92600e">HAS(x)(p) = v</text>
  <text x="350" y="366" font-size="10" fill="#92600e">relational: v = ι(y)</text>

  <text x="350" y="396" font-size="10.5" font-weight="700" fill="#78350f">Why it works</text>
  <text x="350" y="412" font-size="9.5" fill="#92600e">Closure Rule 2: values</text>
  <text x="350" y="424" font-size="9.5" fill="#92600e">may be object-references.</text>
  <text x="350" y="436" font-size="9.5" fill="#92600e">Relational vocab is</text>
  <text x="350" y="448" font-size="9.5" fill="#92600e">derivable, not primitive.</text>
  <text x="350" y="452" font-size="9" font-style="italic" fill="#92600e" text-anchor="end"></text>

  <!-- Case 3: transformation -->
  <rect x="600" y="220" width="240" height="240" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <rect x="600" y="220" width="240" height="32" rx="10" fill="#dc2626"/>
  <text x="720" y="241" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Case 3: transformation</text>

  <text x="620" y="272" font-size="10.5" font-weight="700" fill="#7f1d1d">Form (type grain)</text>
  <text x="620" y="290" font-size="10" fill="#991b1b">"x can do t"</text>
  <text x="620" y="316" font-size="10.5" font-weight="700" fill="#7f1d1d">Form (instance grain)</text>
  <text x="620" y="334" font-size="10" fill="#991b1b">"this particular run of t"</text>

  <text x="620" y="362" font-size="10.5" font-weight="700" fill="#7f1d1d">Expressible as</text>
  <text x="620" y="380" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#991b1b">DOES(x, t),  t ∈ T</text>
  <text x="620" y="396" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#991b1b">instance: ρ(t) ∈ O</text>

  <text x="620" y="424" font-size="10.5" font-weight="700" fill="#7f1d1d">Why it works</text>
  <text x="620" y="440" font-size="9.5" fill="#991b1b">Closure Rule 3: a run is</text>
  <text x="620" y="452" font-size="9.5" fill="#991b1b">a reified transition — an</text>
  <text x="620" y="464" font-size="9.5" fill="#991b1b">object, IS/HAS-able.</text>

  <!-- Bottom line: every branch terminates -->
  <rect x="60" y="480" width="780" height="100" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="80" y="504" font-size="11.5" font-weight="700" fill="#3730a3">Every branch terminates in the eight terms</text>
  <text x="80" y="524" font-size="10.5" fill="#4338ca">No case requires a term outside them. The proof is by cases on the axiom's trichotomy,</text>
  <text x="80" y="538" font-size="10.5" fill="#4338ca">at both type and instance grain.</text>
  <text x="80" y="562" font-size="10.5" font-style="italic" fill="#4f46e5">Caveat: completeness is relative to the Claim-Form Axiom. See Chapter 2 §2.2.</text>
</svg>
