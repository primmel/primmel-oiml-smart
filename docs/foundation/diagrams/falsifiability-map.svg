<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="ui-sans-serif, system-ui, sans-serif">
  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">Falsifiability map — where the system could break</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">Load-bearing claims are columns holding up the roof. Each column names what would refute it.</text>

  <!-- Roof: the system's three theorems -->
  <rect x="100" y="90" width="700" height="80" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="450" y="116" font-size="13" font-weight="700" fill="#3730a3" text-anchor="middle">THE SYSTEM (Volume 0)</text>
  <text x="450" y="136" font-size="11" fill="#4338ca" text-anchor="middle">closure · completeness · extensibility</text>
  <text x="450" y="154" font-size="10" fill="#4f46e5" text-anchor="middle">+ executable runtime + adoption-via-executability</text>

  <!-- Columns (supports) -->
  <!-- Column 1: Claim-Form Axiom -->
  <rect x="115" y="180" width="170" height="280" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <rect x="115" y="180" width="170" height="32" rx="8" fill="#16a34a"/>
  <text x="200" y="201" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">Claim-Form Axiom</text>
  <text x="200" y="232" font-size="10.5" font-weight="700" fill="#14532d" text-anchor="middle">Holds up:</text>
  <text x="200" y="248" font-size="10" fill="#166534" text-anchor="middle">Theorem 2 (complete-</text>
  <text x="200" y="262" font-size="10" fill="#166534" text-anchor="middle">ness)</text>
  <text x="200" y="284" font-size="10" fill="#166534" text-anchor="middle">Theorem 3 (extensibility)</text>
  <line x1="135" y1="304" x2="265" y2="304" stroke="#16a34a" stroke-width="1"/>
  <text x="200" y="324" font-size="10.5" font-weight="700" fill="#dc2626" text-anchor="middle">Refute by:</text>
  <text x="200" y="344" font-size="9.5" fill="#7f1d1d" text-anchor="middle">exhibit a fourth</text>
  <text x="200" y="358" font-size="9.5" fill="#7f1d1d" text-anchor="middle">claim-form — an</text>
  <text x="200" y="372" font-size="9.5" fill="#7f1d1d" text-anchor="middle">atomic descriptive</text>
  <text x="200" y="386" font-size="9.5" fill="#7f1d1d" text-anchor="middle">claim that is neither</text>
  <text x="200" y="400" font-size="9.5" fill="#7f1d1d" text-anchor="middle">identity, attribution,</text>
  <text x="200" y="414" font-size="9.5" fill="#7f1d1d" text-anchor="middle">nor transformation,</text>
  <text x="200" y="428" font-size="9.5" fill="#7f1d1d" text-anchor="middle">nor reducible.</text>
  <text x="200" y="450" font-size="9.5" font-style="italic" fill="#4d7c0f" text-anchor="middle">Status: not yet found.</text>

  <!-- Column 2: Closure Rules -->
  <rect x="305" y="180" width="170" height="280" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <rect x="305" y="180" width="170" height="32" rx="8" fill="#d97706"/>
  <text x="390" y="201" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">Three Closure Rules</text>
  <text x="390" y="232" font-size="10.5" font-weight="700" fill="#78350f" text-anchor="middle">Holds up:</text>
  <text x="390" y="248" font-size="10" fill="#92600e" text-anchor="middle">Theorem 1 (closure)</text>
  <text x="390" y="262" font-size="10" fill="#92600e" text-anchor="middle">and the algebra itself</text>
  <line x1="325" y1="304" x2="455" y2="304" stroke="#d97706" stroke-width="1"/>
  <text x="390" y="324" font-size="10.5" font-weight="700" fill="#dc2626" text-anchor="middle">Refute by:</text>
  <text x="390" y="344" font-size="9.5" fill="#7f1d1d" text-anchor="middle">show that Rule 1</text>
  <text x="390" y="358" font-size="9.5" fill="#7f1d1d" text-anchor="middle">(kinds=objects),</text>
  <text x="390" y="372" font-size="9.5" fill="#7f1d1d" text-anchor="middle">Rule 2 (refs in values),</text>
  <text x="390" y="386" font-size="9.5" fill="#7f1d1d" text-anchor="middle">or Rule 3 (process =</text>
  <text x="390" y="400" font-size="9.5" fill="#7f1d1d" text-anchor="middle">reified transition) is</text>
  <text x="390" y="414" font-size="9.5" fill="#7f1d1d" text-anchor="middle">inconsistent with the</text>
  <text x="390" y="428" font-size="9.5" fill="#7f1d1d" text-anchor="middle">algebra's signature.</text>
  <text x="390" y="450" font-size="9.5" font-style="italic" fill="#92600e" text-anchor="middle">Status: signatures check.</text>

  <!-- Column 3: Runtime conformance -->
  <rect x="495" y="180" width="170" height="280" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <rect x="495" y="180" width="170" height="32" rx="8" fill="#dc2626"/>
  <text x="580" y="201" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">Runtime conformance</text>
  <text x="580" y="232" font-size="10.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">Holds up:</text>
  <text x="580" y="248" font-size="10" fill="#991b1b" text-anchor="middle">Chapter 10's practical</text>
  <text x="580" y="262" font-size="10" fill="#991b1b" text-anchor="middle">claims: executability,</text>
  <text x="580" y="276" font-size="10" fill="#991b1b" text-anchor="middle">scale invariance,</text>
  <text x="580" y="290" font-size="10" fill="#991b1b" text-anchor="middle">model=program</text>
  <line x1="515" y1="304" x2="645" y2="304" stroke="#dc2626" stroke-width="1"/>
  <text x="580" y="324" font-size="10.5" font-weight="700" fill="#dc2626" text-anchor="middle">Refute by:</text>
  <text x="580" y="344" font-size="9.5" fill="#7f1d1d" text-anchor="middle">show that the</text>
  <text x="580" y="358" font-size="9.5" fill="#7f1d1d" text-anchor="middle">implementation</text>
  <text x="580" y="372" font-size="9.5" fill="#7f1d1d" text-anchor="middle">diverges from the</text>
  <text x="580" y="386" font-size="9.5" fill="#7f1d1d" text-anchor="middle">algebra (e.g. a</text>
  <text x="580" y="400" font-size="9.5" fill="#7f1d1d" text-anchor="middle">transition it cannot</text>
  <text x="580" y="414" font-size="9.5" fill="#7f1d1d" text-anchor="middle">execute, or a process</text>
  <text x="580" y="428" font-size="9.5" fill="#7f1d1d" text-anchor="middle">it cannot reify).</text>
  <text x="580" y="450" font-size="9.5" font-style="italic" fill="#991b1b" text-anchor="middle">Status: algebra is reference.</text>

  <!-- Column 4: Adoption -->
  <rect x="685" y="180" width="100" height="280" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
  <rect x="685" y="180" width="100" height="32" rx="8" fill="#475569"/>
  <text x="735" y="201" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">Adoption</text>
  <text x="735" y="232" font-size="10" fill="#334155" text-anchor="middle">Not load-</text>
  <text x="735" y="246" font-size="10" fill="#334155" text-anchor="middle">bearing for</text>
  <text x="735" y="260" font-size="10" fill="#334155" text-anchor="middle">the algebra</text>
  <text x="735" y="290" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">Test:</text>
  <text x="735" y="310" font-size="9.5" fill="#7f1d1d" text-anchor="middle">no second</text>
  <text x="735" y="324" font-size="9.5" fill="#7f1d1d" text-anchor="middle">implementation</text>
  <text x="735" y="338" font-size="9.5" fill="#7f1d1d" text-anchor="middle">after N years</text>
  <text x="735" y="362" font-size="9.5" font-style="italic" fill="#475569" text-anchor="middle">→ "OPM fate"</text>
  <text x="735" y="450" font-size="9.5" font-style="italic" fill="#475569" text-anchor="middle">Status: to be earned.</text>

  <!-- Foundation -->
  <rect x="100" y="490" width="700" height="46" rx="6" fill="#0f172a"/>
  <text x="450" y="510" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">The Claim-Form Axiom</text>
  <text x="450" y="525" font-size="9.5" fill="#cbd5e1" text-anchor="middle">the philosophical bedrock the whole system rests on</text>

  <!-- Bottom caption -->
  <text x="450" y="568" font-size="10" font-style="italic" fill="#475569" text-anchor="middle">
    Falsifiability is a feature. A system that cannot be refuted is not a system, it is rhetoric.
  </text>
</svg>
