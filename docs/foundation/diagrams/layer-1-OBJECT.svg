<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">Layer 1 — OBJECT: what gets individuated</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">O is the universe of bearers — anything IS can individuate.</text>

  <!-- O universe (large container) -->
  <rect x="60" y="90" width="780" height="380" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="60" y="90" width="780" height="36" rx="14" fill="#4f46e5"/>
  <text x="450" y="113" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">O — the universe of objects</text>

  <!-- Examples inside O -->
  <!-- Physical -->
  <rect x="90" y="150" width="160" height="100" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="170" y="172" font-size="11" font-weight="700" fill="#14532d" text-anchor="middle">Physical</text>
  <text x="170" y="196" font-size="10" fill="#166534" text-anchor="middle">a dog</text>
  <text x="170" y="212" font-size="10" fill="#166534" text-anchor="middle">a door</text>
  <text x="170" y="228" font-size="10" fill="#166534" text-anchor="middle">a kettle</text>

  <!-- Abstract -->
  <rect x="270" y="150" width="160" height="100" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text x="350" y="172" font-size="11" font-weight="700" fill="#78350f" text-anchor="middle">Abstract</text>
  <text x="350" y="196" font-size="10" fill="#92600e" text-anchor="middle">a number</text>
  <text x="350" y="212" font-size="10" fill="#92600e" text-anchor="middle">a kind (mammal)</text>
  <text x="350" y="228" font-size="10" fill="#92600e" text-anchor="middle">a property (color)</text>

  <!-- Computational -->
  <rect x="450" y="150" width="160" height="100" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="530" y="172" font-size="11" font-weight="700" fill="#7f1d1d" text-anchor="middle">Computational</text>
  <text x="530" y="196" font-size="10" fill="#991b1b" text-anchor="middle">a program run</text>
  <text x="530" y="212" font-size="10" fill="#991b1b" text-anchor="middle">a transition</text>
  <text x="530" y="228" font-size="10" fill="#991b1b" text-anchor="middle">(when reified, §3.9)</text>

  <!-- Legal / institutional -->
  <rect x="630" y="150" width="190" height="100" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
  <text x="725" y="172" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Legal / institutional</text>
  <text x="725" y="196" font-size="10" fill="#475569" text-anchor="middle">a contract</text>
  <text x="725" y="212" font-size="10" fill="#475569" text-anchor="middle">a certificate</text>
  <text x="725" y="228" font-size="10" fill="#475569" text-anchor="middle">an organization</text>

  <!-- Properties of objects -->
  <rect x="90" y="280" width="730" height="170" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="110" y="304" font-size="12" font-weight="700" fill="#0f172a">What every object can bear (Layers 2–4 build outward from here)</text>

  <!-- IS -->
  <rect x="110" y="316" width="160" height="120" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="190" y="336" font-size="11" font-weight="700" fill="#14532d" text-anchor="middle">IS-facts</text>
  <text x="190" y="358" font-size="9.5" fill="#166534" text-anchor="middle">individuation</text>
  <text x="190" y="372" font-size="9.5" fill="#166534" text-anchor="middle">kind-membership</text>
  <text x="190" y="396" font-size="9" fill="#4d7c0f" text-anchor="middle">"which thing is this?"</text>
  <text x="190" y="410" font-size="9" fill="#4d7c0f" text-anchor="middle">"what kind?"</text>

  <!-- HAS -->
  <rect x="285" y="316" width="160" height="120" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="365" y="336" font-size="11" font-weight="700" fill="#78350f" text-anchor="middle">HAS-facts</text>
  <text x="365" y="358" font-size="9.5" fill="#92600e" text-anchor="middle">property-value pairs</text>
  <text x="365" y="372" font-size="9.5" fill="#92600e" text-anchor="middle">references to other</text>
  <text x="365" y="386" font-size="9.5" fill="#92600e" text-anchor="middle">objects (Rule 2)</text>
  <text x="365" y="410" font-size="9" fill="#92600e" text-anchor="middle">"what does it hold?"</text>

  <!-- DOES -->
  <rect x="460" y="316" width="160" height="120" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="540" y="336" font-size="11" font-weight="700" fill="#7f1d1d" text-anchor="middle">DOES-facts</text>
  <text x="540" y="358" font-size="9.5" fill="#991b1b" text-anchor="middle">transition participation</text>
  <text x="540" y="372" font-size="9.5" fill="#991b1b" text-anchor="middle">as input, output,</text>
  <text x="540" y="386" font-size="9.5" fill="#991b1b" text-anchor="middle">or executor</text>
  <text x="540" y="410" font-size="9" fill="#991b1b" text-anchor="middle">"what does it do?"</text>

  <!-- PROCESS -->
  <rect x="635" y="316" width="160" height="120" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="715" y="336" font-size="11" font-weight="700" fill="#7f1d1d" text-anchor="middle">PROCESS</text>
  <text x="715" y="358" font-size="9.5" fill="#991b1b" text-anchor="middle">a transition reified</text>
  <text x="715" y="372" font-size="9.5" fill="#991b1b" text-anchor="middle">as an object</text>
  <text x="715" y="396" font-size="9" fill="#991b1b" text-anchor="middle">(Layer 4)</text>
  <text x="715" y="410" font-size="9" fill="#991b1b" text-anchor="middle">⊆ O by Rule 3</text>

  <!-- Bottom takeaway -->
  <rect x="60" y="490" width="780" height="80" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="80" y="514" font-size="11" font-weight="700" fill="#3730a3">The crucial move</text>
  <text x="80" y="534" font-size="10.5" fill="#4338ca">There is deliberately no restriction to physical things; abstractness is not</text>
  <text x="80" y="548" font-size="10.5" fill="#4338ca">a disqualification. IS doesn't care what a thing is made of — only whether</text>
  <text x="80" y="562" font-size="10.5" fill="#4338ca">"same one again" is a coherent question about it. Numbers and kinds qualify.</text>
</svg>
