<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">Algorithm — state-location (the σ function)</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">Identify where an execution currently stands. State is a tuple of values, not a primitive.</text>

  <!-- Signature -->
  <rect x="60" y="90" width="780" height="56" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/>
  <text x="80" y="124" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#115e59">σ(e)  =  (p, t_i, I_i, O_i)</text>

  <!-- Execution e on the left -->
  <rect x="60" y="180" width="220" height="220" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
  <rect x="60" y="180" width="220" height="32" rx="10" fill="#4f46e5"/>
  <text x="170" y="201" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Execution e</text>

  <text x="80" y="232" font-size="10" font-weight="700" fill="#14532d">IS</text>
  <text x="80" y="248" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#166534">a reified process</text>
  <text x="80" y="262" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#166534">ρ(t) ∈ O</text>

  <text x="80" y="294" font-size="10" font-weight="700" fill="#78350f">HAS</text>
  <text x="80" y="310" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#92600e">started-at = …</text>
  <text x="80" y="324" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#92600e">current-pos = …</text>
  <text x="80" y="338" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#92600e">bound-input = …</text>
  <text x="80" y="352" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#92600e">bound-output = …</text>
  <text x="80" y="380" font-size="9" font-style="italic" fill="#4338ca">an object in the model</text>

  <!-- σ call -->
  <line x1="280" y1="290" x2="380" y2="290" stroke="#4f46e5" stroke-width="2.4" marker-end="url(#sig-arr)"/>
  <text x="330" y="280" font-size="14" font-weight="700" fill="#4f46e5" text-anchor="middle">σ</text>

  <!-- Output tuple on the right -->
  <rect x="380" y="180" width="460" height="220" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8"/>
  <rect x="380" y="180" width="460" height="32" rx="10" fill="#0d9488"/>
  <text x="610" y="201" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Output: (p, t_i, I_i, O_i) — a positional snapshot</text>

  <!-- p -->
  <rect x="400" y="234" width="100" height="68" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="450" y="252" font-size="11" font-weight="700" fill="#3730a3" text-anchor="middle">p</text>
  <text x="450" y="270" font-size="9" fill="#4338ca" text-anchor="middle">process</text>
  <text x="450" y="284" font-size="9" fill="#4338ca" text-anchor="middle">definition</text>
  <text x="450" y="296" font-size="8" font-style="italic" fill="#4338ca" text-anchor="middle">(object ref)</text>

  <!-- t_i -->
  <rect x="510" y="234" width="100" height="68" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="560" y="252" font-size="11" font-weight="700" fill="#7f1d1d" text-anchor="middle">t_i</text>
  <text x="560" y="270" font-size="9" fill="#991b1b" text-anchor="middle">current/next</text>
  <text x="560" y="284" font-size="9" fill="#991b1b" text-anchor="middle">transition</text>
  <text x="560" y="296" font-size="8" font-style="italic" fill="#991b1b" text-anchor="middle">(object ref)</text>

  <!-- I_i -->
  <rect x="620" y="234" width="100" height="68" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="670" y="252" font-size="11" font-weight="700" fill="#78350f" text-anchor="middle">I_i</text>
  <text x="670" y="270" font-size="9" fill="#92600e" text-anchor="middle">bound</text>
  <text x="670" y="284" font-size="9" fill="#92600e" text-anchor="middle">inputs</text>
  <text x="670" y="296" font-size="8" font-style="italic" fill="#92600e" text-anchor="middle">(value bag)</text>

  <!-- O_i -->
  <rect x="730" y="234" width="100" height="68" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="780" y="252" font-size="11" font-weight="700" fill="#14532d" text-anchor="middle">O_i</text>
  <text x="780" y="270" font-size="9" fill="#166534" text-anchor="middle">produced</text>
  <text x="780" y="284" font-size="9" fill="#166534" text-anchor="middle">outputs</text>
  <text x="780" y="296" font-size="8" font-style="italic" fill="#166534" text-anchor="middle">(value bag)</text>

  <text x="610" y="336" font-size="11" fill="#115e59" text-anchor="middle">All four are existing sorts — no new "state" primitive required.</text>
  <text x="610" y="356" font-size="10" fill="#0d9488" text-anchor="middle">Two object-references (p, t_i), two value-bags (I_i, O_i).</text>
  <text x="610" y="376" font-size="10" font-style="italic" fill="#0d9488" text-anchor="middle">"State" is bookkeeping over the kernel's existing machinery.</text>

  <!-- What state ISN'T -->
  <rect x="60" y="430" width="780" height="150" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="80" y="454" font-size="11.5" font-weight="700" fill="#7f1d1d">What state ISN'T</text>

  <text x="80" y="478" font-size="10.5" fill="#991b1b">It is not a primitive — see Chapter 7 §STATE. It is a tuple of values, derivable from the kernel.</text>
  <text x="80" y="496" font-size="10.5" fill="#991b1b">It is not a property of the entity — it is a positional identifier for a particular execution.</text>
  <text x="80" y="514" font-size="10.5" fill="#991b1b">It is not the same as "data state" (the value of some HAS-property at time t) — it is</text>
  <text x="80" y="528" font-size="10.5" fill="#991b1b">"control state" (which node in the transition graph is currently active for this run).</text>
  <text x="80" y="552" font-size="10" font-style="italic" fill="#dc2626">This is the distinction the design dialogue worked hard to clarify — see Chapter 7 §STATE for the full derivation.</text>

  <defs>
    <marker id="sig-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f46e5"/>
    </marker>
  </defs>
</svg>
