<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">BECOMES = diff across two value-readings</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">A comparison, not a fact. Arithmetic on the log of timestamped HAS-values.</text>

  <!-- Equation -->
  <rect x="60" y="90" width="780" height="56" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/>
  <text x="80" y="124" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#115e59">BECOMES(x, p, t₁, t₂)  ≡  HAS(x, p)(t₁)  ≠  HAS(x, p)(t₂)</text>

  <!-- Two snapshots and the diff -->
  <rect x="60" y="170" width="780" height="240" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
  <rect x="60" y="170" width="780" height="32" rx="10" fill="#475569"/>
  <text x="450" y="191" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">The door "becomes closed" — but it's just a subtraction</text>

  <!-- Snapshot at t1 -->
  <rect x="100" y="220" width="220" height="160" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text x="210" y="244" font-size="11.5" font-weight="700" fill="#78350f" text-anchor="middle">At time t₁</text>
  <text x="210" y="278" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#92600e" text-anchor="middle">HAS(door,</text>
  <text x="210" y="294" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#92600e" text-anchor="middle">     position,</text>
  <text x="210" y="310" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#92600e" text-anchor="middle">     open)</text>
  <text x="210" y="340" font-size="10" fill="#92600e" text-anchor="middle">value-reading 1</text>
  <text x="210" y="356" font-size="9" font-style="italic" fill="#92600e" text-anchor="middle">at timestamp t₁</text>

  <!-- Diff operation -->
  <line x1="320" y1="300" x2="400" y2="300" stroke="#dc2626" stroke-width="2" marker-end="url(#bec-arr)"/>
  <text x="360" y="290" font-size="14" font-weight="700" fill="#dc2626" text-anchor="middle">diff</text>
  <text x="360" y="320" font-size="9" fill="#991b1b" text-anchor="middle">(≠)</text>

  <!-- Snapshot at t2 -->
  <rect x="400" y="220" width="220" height="160" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="510" y="244" font-size="11.5" font-weight="700" fill="#14532d" text-anchor="middle">At time t₂</text>
  <text x="510" y="278" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#166534" text-anchor="middle">HAS(door,</text>
  <text x="510" y="294" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#166534" text-anchor="middle">     position,</text>
  <text x="510" y="310" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#166534" text-anchor="middle">     closed)</text>
  <text x="510" y="340" font-size="10" fill="#166534" text-anchor="middle">value-reading 2</text>
  <text x="510" y="356" font-size="9" font-style="italic" fill="#166534" text-anchor="middle">at timestamp t₂</text>

  <!-- Equals BECOMES -->
  <line x1="620" y1="300" x2="680" y2="300" stroke="#4f46e5" stroke-width="2" marker-end="url(#bec-arr2)"/>
  <text x="650" y="290" font-size="9" fill="#4f46e5" text-anchor="middle">yields</text>

  <rect x="680" y="220" width="160" height="160" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
  <text x="760" y="244" font-size="11.5" font-weight="700" fill="#3730a3" text-anchor="middle">BECOMES</text>
  <text x="760" y="270" font-size="11" font-style="italic" fill="#4338ca" text-anchor="middle">"the door</text>
  <text x="760" y="286" font-size="11" font-style="italic" fill="#4338ca" text-anchor="middle">becomes</text>
  <text x="760" y="302" font-size="11" font-style="italic" fill="#4338ca" text-anchor="middle">closed"</text>
  <text x="760" y="334" font-size="9" fill="#4f46e5" text-anchor="middle">a derived</text>
  <text x="760" y="348" font-size="9" fill="#4f46e5" text-anchor="middle">observation,</text>
  <text x="760" y="362" font-size="9" fill="#4f46e5" text-anchor="middle">not a fact</text>

  <!-- Database analogy -->
  <rect x="60" y="430" width="780" height="150" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="80" y="454" font-size="11.5" font-weight="700" fill="#7f1d1d">The database analogy</text>
  <text x="80" y="478" font-size="10.5" fill="#991b1b">No database schema includes a "BECOMES" column. Change is reconstructed by querying the log</text>
  <text x="80" y="492" font-size="10.5" fill="#991b1b">of timestamped values.</text>
  <text x="80" y="516" font-size="10.5" font-weight="700" fill="#7f1d1d">The trap:</text>
  <text x="80" y="536" font-size="10.5" fill="#991b1b">Human language has a convenient verb for this ("becomes," "turns into," "grows") that tricks</text>
  <text x="80" y="550" font-size="10.5" fill="#991b1b">us into thinking it names a type of thing, when it actually names an operation (delta/diff)</text>
  <text x="80" y="564" font-size="10.5" fill="#991b1b">performed on a timeline.</text>
  <text x="80" y="576" font-size="10" font-style="italic" fill="#dc2626">A derived quantity isn't a primitive.</text>

  <defs>
    <marker id="bec-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="bec-arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f46e5"/>
    </marker>
  </defs>
</svg>
