<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="ui-sans-serif, system-ui, sans-serif">
  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">Attack surface — four places the system could break</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">Falsifiability is a feature. A system that cannot be refuted is not a system, it is rhetoric.</text>

  <!-- The building metaphor: a roof held up by 4 columns -->
  <!-- Roof -->
  <rect x="80" y="100" width="740" height="60" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="450" y="124" font-size="13" font-weight="700" fill="#3730a3" text-anchor="middle">THE FOUNDATION</text>
  <text x="450" y="146" font-size="10.5" fill="#4338ca" text-anchor="middle">closure · completeness · extensibility · executability · adoption thesis</text>

  <!-- 4 columns -->
  <!-- Column 1: Claim-Form Axiom -->
  <rect x="100" y="180" width="160" height="320" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <rect x="100" y="180" width="160" height="32" rx="8" fill="#16a34a"/>
  <text x="180" y="200" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1. Claim-Form</text>
  <text x="180" y="214" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Axiom</text>

  <text x="180" y="240" font-size="9.5" font-weight="700" fill="#14532d" text-anchor="middle">Refute by:</text>
  <text x="180" y="262" font-size="9" fill="#166534" text-anchor="middle">Find a fourth</text>
  <text x="180" y="276" font-size="9" fill="#166534" text-anchor="middle">claim-form —</text>
  <text x="180" y="290" font-size="9" fill="#166534" text-anchor="middle">neither identity,</text>
  <text x="180" y="304" font-size="9" fill="#166534" text-anchor="middle">attribution, nor</text>
  <text x="180" y="318" font-size="9" fill="#166534" text-anchor="middle">transformation.</text>

  <text x="180" y="350" font-size="9.5" font-weight="700" fill="#14532d" text-anchor="middle">Would break:</text>
  <text x="180" y="368" font-size="9" fill="#166534" text-anchor="middle">Theorem 2</text>
  <text x="180" y="382" font-size="9" fill="#166534" text-anchor="middle">Theorem 3</text>

  <text x="180" y="416" font-size="9.5" font-weight="700" fill="#14532d" text-anchor="middle">Status:</text>
  <text x="180" y="434" font-size="9" fill="#16a34a" text-anchor="middle">not yet found</text>
  <text x="180" y="448" font-size="9" fill="#16a34a" text-anchor="middle">despite sustained</text>
  <text x="180" y="462" font-size="9" fill="#16a34a" text-anchor="middle">pressure (Ch 7)</text>

  <!-- Column 2: Closure Rules -->
  <rect x="280" y="180" width="160" height="320" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <rect x="280" y="180" width="160" height="32" rx="8" fill="#d97706"/>
  <text x="360" y="200" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2. Three Closure</text>
  <text x="360" y="214" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Rules</text>

  <text x="360" y="240" font-size="9.5" font-weight="700" fill="#78350f" text-anchor="middle">Refute by:</text>
  <text x="360" y="262" font-size="9" fill="#92600e" text-anchor="middle">Show Rule 1, 2,</text>
  <text x="360" y="276" font-size="9" fill="#92600e" text-anchor="middle">or 3 is</text>
  <text x="360" y="290" font-size="9" fill="#92600e" text-anchor="middle">inconsistent with</text>
  <text x="360" y="304" font-size="9" fill="#92600e" text-anchor="middle">the algebra's</text>
  <text x="360" y="318" font-size="9" fill="#92600e" text-anchor="middle">signature.</text>

  <text x="360" y="350" font-size="9.5" font-weight="700" fill="#78350f" text-anchor="middle">Would break:</text>
  <text x="360" y="368" font-size="9" fill="#92600e" text-anchor="middle">Theorem 1</text>
  <text x="360" y="382" font-size="9" fill="#92600e" text-anchor="middle">(closure)</text>

  <text x="360" y="416" font-size="9.5" font-weight="700" fill="#78350f" text-anchor="middle">Status:</text>
  <text x="360" y="434" font-size="9" fill="#d97706" text-anchor="middle">signatures check;</text>
  <text x="360" y="448" font-size="9" fill="#d97706" text-anchor="middle">no contradiction</text>
  <text x="360" y="462" font-size="9" fill="#d97706" text-anchor="middle">found</text>

  <!-- Column 3: Runtime conformance -->
  <rect x="460" y="180" width="160" height="320" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <rect x="460" y="180" width="160" height="32" rx="8" fill="#dc2626"/>
  <text x="540" y="200" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3. Runtime</text>
  <text x="540" y="214" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">conformance</text>

  <text x="540" y="240" font-size="9.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">Refute by:</text>
  <text x="540" y="262" font-size="9" fill="#991b1b" text-anchor="middle">Implementation</text>
  <text x="540" y="276" font-size="9" fill="#991b1b" text-anchor="middle">diverges from</text>
  <text x="540" y="290" font-size="9" fill="#991b1b" text-anchor="middle">algebra —</text>
  <text x="540" y="304" font-size="9" fill="#991b1b" text-anchor="middle">e.g. a transition</text>
  <text x="540" y="318" font-size="9" fill="#991b1b" text-anchor="middle">it cannot run.</text>

  <text x="540" y="350" font-size="9.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">Would break:</text>
  <text x="540" y="368" font-size="9" fill="#991b1b" text-anchor="middle">Chapter 10's</text>
  <text x="540" y="382" font-size="9" fill="#991b1b" text-anchor="middle">practical claims</text>
  <text x="540" y="396" font-size="9" fill="#991b1b" text-anchor="middle">(not the algebra)</text>

  <text x="540" y="416" font-size="9.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">Status:</text>
  <text x="540" y="434" font-size="9" fill="#dc2626" text-anchor="middle">one implementation</text>
  <text x="540" y="448" font-size="9" fill="#dc2626" text-anchor="middle">(Primmel);</text>
  <text x="540" y="462" font-size="9" fill="#dc2626" text-anchor="middle">need 2nd, 3rd</text>

  <!-- Column 4: Axiom coherence -->
  <rect x="640" y="180" width="160" height="320" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
  <rect x="640" y="180" width="160" height="32" rx="8" fill="#475569"/>
  <text x="720" y="200" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">4. Axiom</text>
  <text x="720" y="214" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">coherence</text>

  <text x="720" y="240" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Refute by:</text>
  <text x="720" y="262" font-size="9" fill="#475569" text-anchor="middle">Show the</text>
  <text x="720" y="276" font-size="9" fill="#475569" text-anchor="middle">trichotomy can't</text>
  <text x="720" y="290" font-size="9" fill="#475569" text-anchor="middle">be stated cleanly</text>
  <text x="720" y="304" font-size="9" fill="#475569" text-anchor="middle">— the three forms</text>
  <text x="720" y="318" font-size="9" fill="#475569" text-anchor="middle">aren't MECE.</text>

  <text x="720" y="350" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Would break:</text>
  <text x="720" y="368" font-size="9" fill="#475569" text-anchor="middle">The system's</text>
  <text x="720" y="382" font-size="9" fill="#475569" text-anchor="middle">structural</text>
  <text x="720" y="396" font-size="9" fill="#475569" text-anchor="middle">argument</text>

  <text x="720" y="416" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Status:</text>
  <text x="720" y="434" font-size="9" fill="#475569" text-anchor="middle">no dependence</text>
  <text x="720" y="448" font-size="9" fill="#475569" text-anchor="middle">demonstrated</text>

  <!-- Bottom -->
  <rect x="60" y="520" width="780" height="60" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="80" y="542" font-size="11" font-weight="700" fill="#3730a3">Anything else is preference, not refutation</text>
  <text x="80" y="560" font-size="10" fill="#4338ca">"I don't find it useful," "I prefer UML," "the syntax is ugly" — these are aesthetic judgments, not attacks on the system.</text>
  <text x="80" y="574" font-size="10" font-style="italic" fill="#4f46e5">The four columns above are the falsifiability surface. Demonstrate any one, and the foundation changes.</text>
</svg>
