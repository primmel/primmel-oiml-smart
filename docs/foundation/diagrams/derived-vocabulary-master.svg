<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">Six materialized views — the derived vocabulary</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">Every retired term is a query over the eight primitives. None is owed anything ontologically.</text>

  <!-- Eight primitives in center -->
  <circle cx="450" cy="320" r="80" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.4"/>
  <text x="450" y="304" font-size="11.5" font-weight="700" fill="#3730a3" text-anchor="middle">8 primitives</text>
  <text x="450" y="322" font-size="9.5" fill="#4338ca" text-anchor="middle">IS, HAS, DOES</text>
  <text x="450" y="336" font-size="9.5" fill="#4338ca" text-anchor="middle">object, property,</text>
  <text x="450" y="350" font-size="9.5" fill="#4338ca" text-anchor="middle">value, transition, process</text>

  <!-- Six retired terms radiating out, each with its composite form -->
  <!-- STATE (top) -->
  <line x1="450" y1="240" x2="450" y2="170" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="3,2"/>
  <rect x="350" y="110" width="200" height="60" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="450" y="130" font-size="11.5" font-weight="700" fill="#14532d" text-anchor="middle">STATE</text>
  <text x="450" y="146" font-size="9.5" font-family="ui-monospace, Menlo, monospace" fill="#166534" text-anchor="middle">(ρ(t), t_i)</text>
  <text x="450" y="160" font-size="8.5" font-style="italic" fill="#4d7c0f" text-anchor="middle">pointer pair</text>

  <!-- STEP (top-right) -->
  <line x1="510" y1="270" x2="600" y2="200" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="3,2"/>
  <rect x="600" y="170" width="220" height="60" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="710" y="190" font-size="11.5" font-weight="700" fill="#14532d" text-anchor="middle">STEP</text>
  <text x="710" y="206" font-size="9" font-family="ui-monospace, Menlo, monospace" fill="#166534" text-anchor="middle">ρ(t) + I + O + timestamp</text>
  <text x="710" y="220" font-size="8.5" font-style="italic" fill="#4d7c0f" text-anchor="middle">tuple of four values</text>

  <!-- CAN (right) -->
  <line x1="530" y1="320" x2="620" y2="320" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="3,2"/>
  <rect x="620" y="290" width="220" height="60" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text x="730" y="310" font-size="11.5" font-weight="700" fill="#78350f" text-anchor="middle">CAN</text>
  <text x="730" y="326" font-size="9.5" font-family="ui-monospace, Menlo, monospace" fill="#92600e" text-anchor="middle">DOES ∧ ¬running(ρ(t))</text>
  <text x="730" y="340" font-size="8.5" font-style="italic" fill="#92600e" text-anchor="middle">quantifier over instances</text>

  <!-- RELATES-TO (bottom-right) -->
  <line x1="510" y1="370" x2="600" y2="440" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="3,2"/>
  <rect x="600" y="410" width="220" height="60" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="710" y="430" font-size="11.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">RELATES-TO</text>
  <text x="710" y="446" font-size="9.5" font-family="ui-monospace, Menlo, monospace" fill="#991b1b" text-anchor="middle">HAS(x, p, ι(y))</text>
  <text x="710" y="460" font-size="8.5" font-style="italic" fill="#991b1b" text-anchor="middle">reference-valued property</text>

  <!-- BECOMES (bottom) -->
  <line x1="450" y1="400" x2="450" y2="470" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="3,2"/>
  <rect x="350" y="470" width="200" height="60" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
  <text x="450" y="490" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">BECOMES</text>
  <text x="450" y="506" font-size="9" font-family="ui-monospace, Menlo, monospace" fill="#475569" text-anchor="middle">HAS(x,p)(t₁) ≠ HAS(x,p)(t₂)</text>
  <text x="450" y="520" font-size="8.5" font-style="italic" fill="#64748b" text-anchor="middle">diff of two value-readings</text>

  <!-- TIME (bottom-left) -->
  <line x1="390" y1="370" x2="300" y2="440" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="3,2"/>
  <rect x="80" y="410" width="220" height="60" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
  <text x="190" y="430" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">TIME</text>
  <text x="190" y="446" font-size="9.5" font-family="ui-monospace, Menlo, monospace" fill="#475569" text-anchor="middle">ordering(∘) + timestamps as values</text>
  <text x="190" y="460" font-size="8.5" font-style="italic" fill="#64748b" text-anchor="middle">derives from composition</text>

  <!-- RECEIVES (left) -->
  <line x1="370" y1="320" x2="280" y2="320" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="3,2"/>
  <rect x="60" y="290" width="220" height="60" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="170" y="310" font-size="11.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">RECEIVES</text>
  <text x="170" y="326" font-size="9" font-family="ui-monospace, Menlo, monospace" fill="#991b1b" text-anchor="middle">DOES with input-contains-self</text>
  <text x="170" y="340" font-size="8.5" font-style="italic" fill="#991b1b" text-anchor="middle">passive-voice restatement</text>

  <!-- Top caption -->
  <rect x="60" y="554" width="780" height="36" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="450" y="576" font-size="11" font-weight="700" fill="#3730a3" text-anchor="middle">Each candidate is a name for a query over the eight primitives — useful for prose, owed nothing ontologically.</text>
</svg>
