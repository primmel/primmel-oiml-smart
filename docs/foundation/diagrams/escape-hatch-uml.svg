<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">UML's escape hatch — a dozen diagram types that don't compose</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">Each diagram type has its own semantics. fUML is a small carved subset bolted on after the fact.</text>

  <!-- The dozen diagrams -->
  <rect x="60" y="100" width="780" height="280" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <rect x="60" y="100" width="780" height="32" rx="10" fill="#dc2626"/>
  <text x="450" y="121" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">UML — multiple notations, manually reconciled</text>

  <!-- Diagram type boxes -->
  <g font-size="10">
    <rect x="80" y="160" width="140" height="50" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
    <text x="150" y="180" font-weight="700" fill="#7f1d1d" text-anchor="middle">class</text>
    <text x="150" y="196" font-size="9" fill="#991b1b" text-anchor="middle">structure</text>

    <rect x="230" y="160" width="140" height="50" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
    <text x="300" y="180" font-weight="700" fill="#7f1d1d" text-anchor="middle">object</text>
    <text x="300" y="196" font-size="9" fill="#991b1b" text-anchor="middle">instances</text>

    <rect x="380" y="160" width="140" height="50" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
    <text x="450" y="180" font-weight="700" fill="#7f1d1d" text-anchor="middle">activity</text>
    <text x="450" y="196" font-size="9" fill="#991b1b" text-anchor="middle">flows</text>

    <rect x="530" y="160" width="140" height="50" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
    <text x="600" y="180" font-weight="700" fill="#7f1d1d" text-anchor="middle">sequence</text>
    <text x="600" y="196" font-size="9" fill="#991b1b" text-anchor="middle">interactions</text>

    <rect x="680" y="160" width="140" height="50" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
    <text x="750" y="180" font-weight="700" fill="#7f1d1d" text-anchor="middle">state machine</text>
    <text x="750" y="196" font-size="9" fill="#991b1b" text-anchor="middle">lifecycle</text>

    <rect x="80" y="230" width="140" height="50" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
    <text x="150" y="250" font-weight="700" fill="#7f1d1d" text-anchor="middle">communication</text>
    <text x="150" y="266" font-size="9" fill="#991b1b" text-anchor="middle">runtime view</text>

    <rect x="230" y="230" width="140" height="50" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
    <text x="300" y="250" font-weight="700" fill="#7f1d1d" text-anchor="middle">component</text>
    <text x="300" y="266" font-size="9" fill="#991b1b" text-anchor="middle">modules</text>

    <rect x="380" y="230" width="140" height="50" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
    <text x="450" y="250" font-weight="700" fill="#7f1d1d" text-anchor="middle">deployment</text>
    <text x="450" y="266" font-size="9" fill="#991b1b" text-anchor="middle">physical</text>

    <rect x="530" y="230" width="140" height="50" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
    <text x="600" y="250" font-weight="700" fill="#7f1d1d" text-anchor="middle">use case</text>
    <text x="600" y="266" font-size="9" fill="#991b1b" text-anchor="middle">scenarios</text>

    <rect x="680" y="230" width="140" height="50" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
    <text x="750" y="250" font-weight="700" fill="#7f1d1d" text-anchor="middle">package</text>
    <text x="750" y="266" font-size="9" fill="#991b1b" text-anchor="middle">grouping</text>
  </g>

  <text x="450" y="312" font-size="11" font-weight="700" fill="#7f1d1d" text-anchor="middle">Each diagram has its own metaclass, its own semantics, its own consistency rules.</text>
  <text x="450" y="332" font-size="10" font-style="italic" fill="#dc2626" text-anchor="middle">The modeler maintains alignment across them — by hand.</text>
  <text x="450" y="358" font-size="10" fill="#991b1b" text-anchor="middle">fUML: a small executable subset, defined after the fact, by reference implementation in a Java-like pseudo-language.</text>

  <!-- Foundation comparison -->
  <rect x="60" y="400" width="780" height="180" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8"/>
  <rect x="60" y="400" width="780" height="32" rx="10" fill="#0d9488"/>
  <text x="450" y="421" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Foundation — one construct, every scale</text>

  <text x="80" y="458" font-size="11" font-weight="700" fill="#115e59">All diagrams are projections of one underlying representation</text>
  <text x="100" y="478" font-size="10" fill="#0d9488">class view ←</text>
  <text x="100" y="492" font-size="10" fill="#0d9488">object view ←</text>
  <text x="100" y="506" font-size="10" fill="#0d9488">activity view ←</text>
  <text x="100" y="520" font-size="10" fill="#0d9488">state view ←</text>
  <text x="380" y="478" font-size="10" font-weight="700" fill="#115e59">→ one model (the kernel)</text>
  <text x="380" y="498" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#0d9488">U + τ + ∘</text>
  <text x="380" y="528" font-size="10" font-style="italic" fill="#0d9488">No manual reconciliation — the views</text>
  <text x="380" y="542" font-size="10" font-style="italic" fill="#0d9488">are derived from one source of truth.</text>
  <text x="380" y="566" font-size="10" font-style="italic" fill="#0d9488">UML attempts to unify notations; the foundation unifies the modeled reality and its execution.</text>
</svg>
