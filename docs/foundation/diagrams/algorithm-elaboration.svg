<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">Algorithm — elaboration (desugar Tier 1 → Tier 0)</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">Lower an author's surface statement to a kernel triple. Total, meaning-preserving, linear time.</text>

  <!-- Signature -->
  <rect x="60" y="90" width="780" height="56" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/>
  <text x="80" y="124" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#115e59">elaborate :  Tier1Statement  →  KernelTriple</text>

  <!-- Flowchart -->
  <rect x="60" y="170" width="780" height="320" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.4"/>

  <!-- Input -->
  <rect x="100" y="200" width="240" height="80" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
  <rect x="100" y="200" width="240" height="26" rx="10" fill="#4f46e5"/>
  <text x="220" y="218" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Input (Tier 1)</text>
  <text x="220" y="248" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#3730a3" text-anchor="middle">Rex IS Mammal</text>
  <text x="220" y="266" font-size="9" font-style="italic" fill="#4338ca" text-anchor="middle">a surface statement</text>

  <!-- Arrow -->
  <line x1="340" y1="240" x2="400" y2="240" stroke="#475569" stroke-width="1.8" marker-end="url(#ela-arr)"/>

  <!-- Step 1: Parse -->
  <rect x="400" y="190" width="180" height="50" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="490" y="210" font-size="10.5" font-weight="700" fill="#78350f" text-anchor="middle">1. Parse</text>
  <text x="490" y="226" font-size="9" fill="#92600e" text-anchor="middle">recognize IS = classification</text>

  <!-- Step 2: Recognize κ -->
  <rect x="400" y="252" width="180" height="50" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="490" y="272" font-size="10.5" font-weight="700" fill="#78350f" text-anchor="middle">2. Recognize κ</text>
  <text x="490" y="288" font-size="9" fill="#92600e" text-anchor="middle">the reserved kind-property</text>

  <!-- Step 3: Lower -->
  <rect x="400" y="314" width="180" height="50" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="490" y="334" font-size="10.5" font-weight="700" fill="#78350f" text-anchor="middle">3. Lower to HAS</text>
  <text x="490" y="350" font-size="9" fill="#92600e" text-anchor="middle">produce kernel triple</text>

  <!-- Step arrows -->
  <line x1="490" y1="240" x2="490" y2="252" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#ela-arr-small)"/>
  <line x1="490" y1="302" x2="490" y2="314" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#ela-arr-small)"/>

  <!-- Arrow to output -->
  <line x1="580" y1="339" x2="640" y2="339" stroke="#475569" stroke-width="1.8" marker-end="url(#ela-arr)"/>

  <!-- Output -->
  <rect x="640" y="280" width="180" height="120" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <rect x="640" y="280" width="180" height="26" rx="10" fill="#0d9488"/>
  <text x="730" y="298" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Output (Tier 0)</text>
  <text x="730" y="328" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#115e59" text-anchor="middle">HAS(Rex,</text>
  <text x="730" y="346" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#115e59" text-anchor="middle">     κ,</text>
  <text x="730" y="364" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#115e59" text-anchor="middle">     Mammal)</text>
  <text x="730" y="386" font-size="9" font-style="italic" fill="#0d9488" text-anchor="middle">a kernel triple</text>

  <!-- Properties -->
  <rect x="60" y="510" width="780" height="70" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="80" y="532" font-size="11" font-weight="700" fill="#3730a3">Properties</text>
  <text x="80" y="550" font-size="10" fill="#4338ca">• <tspan font-weight="700">Total</tspan> — every well-formed Tier 1 statement elaborates.</text>
  <text x="80" y="564" font-size="10" fill="#4338ca">• <tspan font-weight="700">Meaning-preserving</tspan> — the kernel triple is logically equivalent to the surface statement.</text>
  <text x="80" y="578" font-size="10" fill="#4338ca">• <tspan font-weight="700">Linear time</tspan> in the size of the surface statement. No global analysis required.</text>

  <defs>
    <marker id="ela-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="ela-arr-small" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
