<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="ui-sans-serif, system-ui, sans-serif">
  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">OOP's escape hatch — the method body</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">A method signature is a label. The body lives in another language with another semantics.</text>

  <!-- Class diagram -->
  <rect x="60" y="100" width="320" height="240" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="60" y="100" width="320" height="32" rx="10" fill="#4f46e5"/>
  <text x="220" y="121" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Class diagram (the model)</text>

  <text x="80" y="156" font-size="11" font-weight="700" fill="#3730a3">class LoadCell</text>
  <text x="80" y="180" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#4338ca">  e_max : Mass</text>
  <text x="80" y="196" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#4338ca">  accuracy_class : Class</text>
  <text x="80" y="220" font-size="11" font-weight="700" fill="#3730a3">  measure(force) : Indication</text>
  <text x="80" y="244" font-size="11" font-weight="700" fill="#3730a3">  calibrate(reference)</text>
  <text x="80" y="268" font-size="11" font-weight="700" fill="#3730a3">  self_test() : Report</text>

  <text x="80" y="304" font-size="10" font-style="italic" fill="#4f46e5">Signatures only.</text>
  <text x="80" y="318" font-size="10" font-style="italic" fill="#4f46e5">What happens inside? Not modelled.</text>

  <!-- Escape hatch arrow -->
  <line x1="380" y1="220" x2="520" y2="220" stroke="#dc2626" stroke-width="2.4" stroke-dasharray="6,3" marker-end="url(#oop-arr)"/>
  <text x="450" y="208" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">ESCAPE HATCH</text>
  <text x="450" y="240" font-size="9" font-style="italic" fill="#dc2626" text-anchor="middle">"here, code happens"</text>

  <!-- Method body in another language -->
  <rect x="520" y="100" width="320" height="240" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <rect x="520" y="100" width="320" height="32" rx="10" fill="#dc2626"/>
  <text x="680" y="121" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Method body (Java/Python/C++)</text>

  <text x="540" y="156" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#7f1d1d">public Indication measure</text>
  <text x="540" y="172" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#7f1d1d">    (Force force) {</text>
  <text x="540" y="194" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#7f1d1d">  // 100 lines of:</text>
  <text x="540" y="210" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#7f1d1d">  // - register reads</text>
  <text x="540" y="226" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#7f1d1d">  // - ADC sampling</text>
  <text x="540" y="242" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#7f1d1d">  // - filter pipeline</text>
  <text x="540" y="258" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#7f1d1d">  // - calibration curve</text>
  <text x="540" y="274" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#7f1d1d">  // - error correction</text>
  <text x="540" y="290" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#7f1d1d">  // - unit conversion</text>
  <text x="540" y="312" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#7f1d1d">}</text>

  <text x="540" y="332" font-size="9" font-style="italic" fill="#dc2626">Different grammar.</text>

  <!-- The drift problem -->
  <rect x="60" y="370" width="780" height="100" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text x="80" y="394" font-size="11" font-weight="700" fill="#78350f">The drift problem</text>
  <text x="80" y="414" font-size="10.5" fill="#92600e">The model documents intent. The code implements it. Nothing formal ties the two together —</text>
  <text x="80" y="428" font-size="10.5" fill="#92600e">which is why diagrams and codebases drift out of sync in practice. The model becomes documentation</text>
  <text x="80" y="442" font-size="10.5" fill="#92600e">rather than truth. Every team has lived this.</text>
  <text x="80" y="462" font-size="10" font-style="italic" fill="#d97706">Universally recognized failure mode of OOP-as-modelling.</text>

  <!-- Foundation alternative -->
  <rect x="60" y="490" width="780" height="90" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/>
  <text x="80" y="514" font-size="11" font-weight="700" fill="#115e59">The foundation has no escape hatch</text>
  <text x="80" y="534" font-size="10.5" fill="#0d9488">A transition decomposes into smaller transitions by the same composition operator, all the way down,</text>
  <text x="80" y="548" font-size="10.5" fill="#0d9488">terminating in whatever atomic transitions the runtime provides. Behavior is inside the model</text>
  <text x="80" y="562" font-size="10.5" fill="#0d9488">all the way down — there is no point at which the system says "and here, code happens."</text>

  <defs>
    <marker id="oop-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>
</svg>
