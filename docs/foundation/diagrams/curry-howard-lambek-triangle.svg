<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">Curry–Howard–Lambek correspondence</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">Three equivalent viewpoints on the same structure. A theorem in any one is a theorem in all three.</text>

  <!-- Triangle vertices -->
  <!-- CCC (top) -->
  <rect x="320" y="120" width="260" height="100" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2.4"/>
  <rect x="320" y="120" width="260" height="32" rx="12" fill="#0d9488"/>
  <text x="450" y="141" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Cartesian closed category</text>
  <text x="450" y="170" font-size="11" fill="#115e59" text-anchor="middle">objects + morphisms</text>
  <text x="450" y="186" font-size="11" fill="#115e59" text-anchor="middle">+ finite products</text>
  <text x="450" y="202" font-size="11" fill="#115e59" text-anchor="middle">+ exponentials</text>

  <!-- λ-calculus (bottom-left) -->
  <rect x="100" y="380" width="260" height="100" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2.4"/>
  <rect x="100" y="380" width="260" height="32" rx="12" fill="#d97706"/>
  <text x="230" y="401" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Typed λ-calculus</text>
  <text x="230" y="430" font-size="11" fill="#78350f" text-anchor="middle">functions + types</text>
  <text x="230" y="446" font-size="11" fill="#78350f" text-anchor="middle">+ abstraction</text>
  <text x="230" y="462" font-size="11" fill="#78350f" text-anchor="middle">+ application</text>

  <!-- Constructive logic (bottom-right) -->
  <rect x="540" y="380" width="260" height="100" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2.4"/>
  <rect x="540" y="380" width="260" height="32" rx="12" fill="#dc2626"/>
  <text x="670" y="401" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Constructive logic</text>
  <text x="670" y="430" font-size="11" fill="#7f1d1d" text-anchor="middle">propositions as types</text>
  <text x="670" y="446" font-size="11" fill="#7f1d1d" text-anchor="middle">proofs as programs</text>
  <text x="670" y="462" font-size="11" fill="#7f1d1d" text-anchor="middle">cut elimination = β-reduction</text>

  <!-- Equivalence edges -->
  <!-- CCC ↔ λ-calculus -->
  <line x1="350" y1="220" x2="230" y2="380" stroke="#475569" stroke-width="2"/>
  <line x1="240" y1="370" x2="360" y2="230" stroke="#475569" stroke-width="2"/>
  <text x="240" y="304" font-size="11" font-weight="700" fill="#475569">Lambek (1972)</text>

  <!-- CCC ↔ constructive logic -->
  <line x1="550" y1="220" x2="670" y2="380" stroke="#475569" stroke-width="2"/>
  <line x1="660" y1="370" x2="540" y2="230" stroke="#475569" stroke-width="2"/>
  <text x="660" y="304" font-size="11" font-weight="700" fill="#475569">Lambek (1972)</text>

  <!-- λ-calculus ↔ constructive logic -->
  <line x1="360" y1="430" x2="540" y2="430" stroke="#475569" stroke-width="2"/>
  <line x1="530" y1="440" x2="370" y2="440" stroke="#475569" stroke-width="2"/>
  <text x="450" y="424" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Curry–Howard (1958/1969)</text>

  <!-- Foundation positioned at the CCC vertex -->
  <line x1="450" y1="220" x2="450" y2="252" stroke="#4f46e5" stroke-width="2" stroke-dasharray="4,3"/>
  <rect x="280" y="252" width="340" height="80" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="450" y="276" font-size="12" font-weight="700" fill="#3730a3" text-anchor="middle">The Primmel foundation</text>
  <text x="450" y="296" font-size="10.5" fill="#4338ca" text-anchor="middle">Its kernel is a category (Chapter 9 §9.1).</text>
  <text x="450" y="312" font-size="10.5" fill="#4338ca" text-anchor="middle">If Cartesian closed (likely), it inherits the</text>
  <text x="450" y="326" font-size="10.5" fill="#4338ca" text-anchor="middle">other two corners — operational semantics included.</text>

  <!-- Bottom thesis -->
  <rect x="60" y="510" width="780" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="80" y="534" font-size="11" font-weight="700" fill="#7f1d1d">The payoff</text>
  <text x="80" y="554" font-size="10.5" fill="#991b1b">Sound operational semantics are already a solved problem for Cartesian closed categories.</text>
  <text x="80" y="568" font-size="10.5" fill="#991b1b">The kernel doesn't have to invent its own execution theory; it inherits one.</text>
</svg>
