<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">Closure Rule 2 — values hold references</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">ι : O ↪ V — an object can be embedded as a value. Relations become HAS-with-reference.</text>

  <!-- Formal signature -->
  <rect x="60" y="90" width="280" height="80" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
  <text x="80" y="116" font-size="12" font-weight="700" fill="#0f172a">Formal signature</text>
  <text x="80" y="142" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#0f172a">ι  :  O  ↪  V</text>
  <text x="80" y="160" font-size="10" fill="#475569">embedding — every object can be a value</text>

  <!-- Without Rule 2 vs with Rule 2 -->
  <rect x="380" y="90" width="460" height="240" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <rect x="380" y="90" width="460" height="32" rx="10" fill="#16a34a"/>
  <text x="610" y="111" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Example — "Alice owns Rex"</text>

  <!-- Rex object -->
  <circle cx="450" cy="200" r="40" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="450" y="200" font-size="11" font-weight="700" fill="#3730a3" text-anchor="middle">Rex</text>
  <text x="450" y="216" font-size="8.5" fill="#4f46e5" text-anchor="middle">object</text>

  <!-- owner property slot -->
  <rect x="510" y="180" width="90" height="40" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="555" y="198" font-size="9.5" font-weight="700" fill="#78350f" text-anchor="middle">owner</text>
  <text x="555" y="212" font-size="9" fill="#92600e" text-anchor="middle">(property)</text>

  <!-- value with reference -->
  <rect x="620" y="180" width="100" height="40" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="670" y="198" font-size="9.5" font-weight="700" fill="#14532d" text-anchor="middle">ι(Alice)</text>
  <text x="670" y="212" font-size="9" fill="#166534" text-anchor="middle">(value = ref)</text>

  <!-- Reference arrow to Alice -->
  <line x1="720" y1="200" x2="770" y2="200" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="3,2" marker-end="url(#ref-arr)"/>

  <!-- Alice object -->
  <circle cx="810" cy="200" r="32" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="810" y="200" font-size="10" font-weight="700" fill="#3730a3" text-anchor="middle">Alice</text>
  <text x="810" y="214" font-size="8" fill="#4f46e5" text-anchor="middle">object</text>

  <text x="610" y="270" font-size="10" fill="#475569" text-anchor="middle">The value isn't the literal string "Alice" — it's a reference</text>
  <text x="610" y="284" font-size="10" fill="#475569" text-anchor="middle">to the object Alice. If Alice's properties change, the reference still points at her.</text>
  <text x="610" y="306" font-size="10" font-style="italic" fill="#166534" text-anchor="middle">HAS(Rex)(owner) = ι(Alice)  — one fact, not two.</text>

  <!-- What this rule eliminates -->
  <rect x="60" y="220" width="280" height="280" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <rect x="60" y="220" width="280" height="32" rx="10" fill="#dc2626"/>
  <text x="200" y="241" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">What this rule eliminates</text>

  <text x="80" y="276" font-size="10.5" font-weight="700" fill="#7f1d1d">No RELATION primitive needed</text>
  <g font-size="10" fill="#991b1b">
    <text x="100" y="296">owns        → HAS with v = ι(y)</text>
    <text x="100" y="312">adjacent-to → HAS with v = ι(y)</text>
    <text x="100" y="328">depends-on  → HAS with v = ι(y)</text>
    <text x="100" y="344">part-of     → HAS with v = ι(y)</text>
    <text x="100" y="360">employed-by → HAS with v = ι(y)</text>
    <text x="100" y="376">connectsTo  → HAS with v = ι(y)</text>
  </g>

  <text x="80" y="408" font-size="10.5" font-weight="700" fill="#7f1d1d">When relations need their own facts</text>
  <text x="80" y="426" font-size="10" fill="#991b1b">Reify the relation as its own object</text>
  <text x="80" y="440" font-size="10" fill="#991b1b">(the ER-diagram junction-entity move).</text>
  <text x="80" y="458" font-size="10" font-style="italic" fill="#7f1d1d">Same machinery, no new sort.</text>
  <text x="80" y="480" font-size="10" fill="#991b1b">"Membership" becomes an object</text>
  <text x="80" y="494" font-size="10" fill="#991b1b">with its own start-date, role, etc.</text>

  <!-- Bottom: consequences -->
  <rect x="380" y="350" width="460" height="200" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="400" y="374" font-size="11.5" font-weight="700" fill="#3730a3">What this rule enables</text>
  <text x="400" y="396" font-size="10.5" fill="#4338ca">1. All relational vocabulary is derivable, not primitive.</text>
  <text x="400" y="416" font-size="10.5" fill="#4338ca">2. Reference values stay stable even as target properties change.</text>
  <text x="400" y="436" font-size="10.5" fill="#4338ca">3. Mapping (Volume I ch 5) is HAS-with-reference between models.</text>
  <text x="400" y="456" font-size="10.5" fill="#4338ca">4. Subject chain (Volume II ch 2) is HAS-with-reference up/down</text>
  <text x="400" y="470" font-size="10.5" fill="#4338ca">   the family/group/model/sample hierarchy.</text>
  <text x="400" y="490" font-size="10.5" fill="#4338ca">5. Composition between transitions can carry references in V_in / V_out.</text>
  <text x="400" y="520" font-size="10" font-style="italic" fill="#4f46e5">One embedding, half the relational vocabulary of UML evaporates.</text>

  <!-- Bottom strip -->
  <rect x="60" y="520" width="280" height="60" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.4"/>
  <text x="80" y="542" font-size="11" font-weight="700" fill="#0f172a">The trap</text>
  <text x="80" y="560" font-size="10" fill="#475569">"x relates to y" is not a fourth bucket —</text>
  <text x="80" y="572" font-size="10" fill="#475569">it's HAS with an object-valued value.</text>

  <defs>
    <marker id="ref-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
