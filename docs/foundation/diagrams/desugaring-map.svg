<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">The desugaring map — Tier 1 to Tier 0</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">Each Tier 1 primitive has a definable Tier 0 equivalent. Elaboration is meaning-preserving.</text>

  <!-- Left column: Tier 1 -->
  <rect x="60" y="100" width="320" height="430" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <rect x="60" y="100" width="320" height="36" rx="12" fill="#475569"/>
  <text x="220" y="123" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Tier 1 — surface (8 primitives)</text>

  <g font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#0f172a">
    <text x="80" y="166">OBJECT(x)</text>
    <text x="80" y="206">VALUE(a)</text>
    <text x="80" y="246">IS(x, k) — kind</text>
    <text x="80" y="286">IS(x, y) — identity</text>
    <text x="80" y="326">PROPERTY(p)</text>
    <text x="80" y="366">HAS(x, p, v)</text>
    <text x="80" y="406">DOES(x, t)</text>
    <text x="80" y="446">TRANSITION(t)</text>
    <text x="80" y="486">PROCESS(p)</text>
  </g>

  <!-- Right column: Tier 0 -->
  <rect x="520" y="100" width="320" height="430" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <rect x="520" y="100" width="320" height="36" rx="12" fill="#0d9488"/>
  <text x="680" y="123" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Tier 0 — kernel (entities + τ + ∘)</text>

  <g font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#115e59">
    <text x="540" y="166">id_x  :  x → x</text>
    <text x="540" y="206">a  :  1 → A   (content-equality axiom)</text>
    <text x="540" y="246">HAS(x, κ, k)   (κ is a reserved property)</text>
    <text x="540" y="286">kernel-level entity reference</text>
    <text x="540" y="326">p  :  O → V   (projection transition)</text>
    <text x="540" y="366">p(x) = v   (point in graph of p)</text>
    <text x="540" y="406">t  ∈  τ  ;  x participates</text>
    <text x="540" y="446">t  ∈  τ</text>
    <text x="540" y="486">ρ(t) ∈ U   (no change — Rule 3)</text>
  </g>

  <!-- Elaboration arrows (dashed, going right) -->
  <g stroke="#4f46e5" stroke-width="1.4" fill="none" stroke-dasharray="4,3">
    <line x1="220" y1="162" x2="520" y2="162" marker-end="url(#desug)"/>
    <line x1="220" y1="202" x2="520" y2="202" marker-end="url(#desug)"/>
    <line x1="220" y1="242" x2="520" y2="242" marker-end="url(#desug)"/>
    <line x1="220" y1="282" x2="520" y2="282" marker-end="url(#desug)"/>
    <line x1="220" y1="322" x2="520" y2="322" marker-end="url(#desug)"/>
    <line x1="220" y1="362" x2="520" y2="362" marker-end="url(#desug)"/>
    <line x1="220" y1="402" x2="520" y2="402" marker-end="url(#desug)"/>
    <line x1="220" y1="442" x2="520" y2="442" marker-end="url(#desug)"/>
    <line x1="220" y1="482" x2="520" y2="482" marker-end="url(#desug)"/>
  </g>

  <text x="370" y="92" font-size="10" font-weight="700" fill="#4f46e5" text-anchor="middle">elaborate ↓</text>

  <!-- Annotations -->
  <g font-size="9" font-style="italic" fill="#475569">
    <text x="370" y="158" text-anchor="middle">object = identity morphism</text>
    <text x="370" y="198" text-anchor="middle">value = arrow from terminal</text>
    <text x="370" y="238" text-anchor="middle">classification = property</text>
    <text x="370" y="278" text-anchor="middle">identity stays in kernel</text>
    <text x="370" y="318" text-anchor="middle">slot = projection transition</text>
    <text x="370" y="358" text-anchor="middle">attribution = function application</text>
    <text x="370" y="398" text-anchor="middle">participation is kernel-level</text>
    <text x="370" y="438" text-anchor="middle">transition is primitive in kernel</text>
    <text x="370" y="478" text-anchor="middle">process was already ρ(T)</text>
  </g>

  <!-- Bottom takeaway -->
  <rect x="60" y="544" width="780" height="40" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="450" y="568" font-size="11" font-weight="700" fill="#3730a3" text-anchor="middle">Unify representation (kernel); preserve semantics (surface).</text>

  <defs>
    <marker id="desug" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f46e5"/>
    </marker>
  </defs>
</svg>
