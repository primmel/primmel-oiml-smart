<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">RELATES-TO = HAS with v = ι(y)</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">Relational vocabulary reduces to HAS with object-valued values. One embedding eliminates half of UML's relations.</text>

  <!-- Equation -->
  <rect x="60" y="90" width="780" height="56" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/>
  <text x="80" y="124" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#115e59">RELATES-TO(x, y)  ≡  HAS(x, p, ι(y))   for some property p</text>

  <!-- Example: Alice owns Rex -->
  <rect x="60" y="170" width="780" height="200" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
  <rect x="60" y="170" width="780" height="32" rx="10" fill="#475569"/>
  <text x="450" y="191" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Example — every relational verb reduces the same way</text>

  <!-- Six relation examples in a grid -->
  <g font-size="10" font-family="ui-monospace, Menlo, monospace">
    <rect x="80" y="220" width="220" height="50" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
    <text x="190" y="240" font-size="10.5" font-weight="700" fill="#78350f" text-anchor="middle">"x owns y"</text>
    <text x="190" y="258" font-size="9.5" fill="#92600e" text-anchor="middle">HAS(x, owner, ι(y))</text>

    <rect x="320" y="220" width="220" height="50" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
    <text x="430" y="240" font-size="10.5" font-weight="700" fill="#78350f" text-anchor="middle">"x adjacent-to y"</text>
    <text x="430" y="258" font-size="9.5" fill="#92600e" text-anchor="middle">HAS(x, adjacency, ι(y))</text>

    <rect x="560" y="220" width="220" height="50" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
    <text x="670" y="240" font-size="10.5" font-weight="700" fill="#78350f" text-anchor="middle">"x depends-on y"</text>
    <text x="670" y="258" font-size="9.5" fill="#92600e" text-anchor="middle">HAS(x, dependency, ι(y))</text>

    <rect x="80" y="290" width="220" height="50" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
    <text x="190" y="310" font-size="10.5" font-weight="700" fill="#78350f" text-anchor="middle">"x part-of y"</text>
    <text x="190" y="328" font-size="9.5" fill="#92600e" text-anchor="middle">HAS(x, parent, ι(y))</text>

    <rect x="320" y="290" width="220" height="50" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
    <text x="430" y="310" font-size="10.5" font-weight="700" fill="#78350f" text-anchor="middle">"x employed-by y"</text>
    <text x="430" y="328" font-size="9.5" fill="#92600e" text-anchor="middle">HAS(x, employer, ι(y))</text>

    <rect x="560" y="290" width="220" height="50" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
    <text x="670" y="310" font-size="10.5" font-weight="700" fill="#78350f" text-anchor="middle">"x connectsTo y"</text>
    <text x="670" y="328" font-size="9.5" fill="#92600e" text-anchor="middle">HAS(x, connection, ι(y))</text>
  </g>

  <text x="450" y="358" font-size="11" font-style="italic" fill="#475569" text-anchor="middle">Six relational verbs, one reduction. The embedding ι : O ↪ V (Closure Rule 2) does all the work.</text>

  <!-- When relations need their own facts -->
  <rect x="60" y="390" width="780" height="190" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="80" y="414" font-size="11.5" font-weight="700" fill="#3730a3">When the relation itself needs to bear properties</text>
  <text x="80" y="436" font-size="10.5" fill="#4338ca">Sometimes a relation has its own attributes — start-date, role, terms.</text>
  <text x="80" y="454" font-size="10.5" fill="#4338ca">Example: Alice's employment at ACME has start-date 2020-03-15, role "engineer", salary …</text>

  <text x="80" y="484" font-size="10.5" font-weight="700" fill="#3730a3">Solution: reify the relation as its own object</text>
  <text x="80" y="504" font-size="10.5" fill="#4338ca">Create an object `employment_alice_acme` that bears the IS/HAS facts:</text>
  <text x="80" y="522" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#4338ca">  HAS(employment_alice_acme, employer, ι(ACME))</text>
  <text x="80" y="536" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#4338ca">  HAS(employment_alice_acme, employee, ι(Alice))</text>
  <text x="80" y="550" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#4338ca">  HAS(employment_alice_acme, start-date, 2020-03-15)</text>
  <text x="80" y="564" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#4338ca">  HAS(employment_alice_acme, role, "engineer")</text>
  <text x="80" y="576" font-size="10" font-style="italic" fill="#4f46e5">The ER-diagram junction-entity move. Same machinery, no new sort.</text>
</svg>
