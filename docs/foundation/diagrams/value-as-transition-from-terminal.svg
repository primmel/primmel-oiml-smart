<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">Value = transition from terminal</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">Lawvere: an element a ∈ A is a morphism a : 1 → A from the terminal object.</text>

  <!-- Equation -->
  <rect x="60" y="90" width="780" height="80" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/>
  <text x="450" y="124" font-size="14" font-family="ui-monospace, Menlo, monospace" font-weight="700" fill="#115e59" text-anchor="middle">Value(a)  ⟹  a  :  1 → A</text>
  <text x="450" y="150" font-size="11" fill="#0d9488" text-anchor="middle">A value is an entity that never participates in a non-trivial transition as its domain.</text>

  <!-- The picture -->
  <rect x="60" y="200" width="780" height="240" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
  <rect x="60" y="200" width="780" height="32" rx="10" fill="#475569"/>
  <text x="450" y="221" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">A value is a leaf in the composition graph</text>

  <!-- Terminal object 1 -->
  <rect x="140" y="290" width="80" height="56" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="180" y="316" font-size="14" font-weight="700" fill="#3730a3" text-anchor="middle">1</text>
  <text x="180" y="334" font-size="9" fill="#4338ca" text-anchor="middle">terminal object</text>

  <!-- Arrow a : 1 → A -->
  <line x1="220" y1="318" x2="500" y2="318" stroke="#16a34a" stroke-width="2.4" marker-end="url(#valarr)"/>
  <text x="360" y="304" font-size="13" font-weight="700" fill="#16a34a" text-anchor="middle">a</text>
  <text x="360" y="338" font-size="9" font-style="italic" fill="#166534" text-anchor="middle">"pick out element a of A"</text>

  <!-- A (the set/type) -->
  <rect x="520" y="270" width="240" height="100" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="640" y="294" font-size="13" font-weight="700" fill="#14532d" text-anchor="middle">A</text>
  <text x="640" y="310" font-size="9" fill="#166534" text-anchor="middle">a type / set / value-domain</text>
  <g font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#166534">
    <text x="540" y="334">{ 42, "red", 3.14, … }</text>
    <text x="540" y="354">the elements a can pick out</text>
  </g>

  <text x="450" y="402" font-size="11" font-style="italic" fill="#475569" text-anchor="middle">A constant is a nullary function. A literal is an arrow from the terminal object.</text>
  <text x="450" y="420" font-size="11" font-style="italic" fill="#475569" text-anchor="middle">"42" is the morphism that picks out the element 42 of the integer type.</text>

  <!-- Caveat: content equality -->
  <rect x="60" y="460" width="780" height="120" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="80" y="484" font-size="11.5" font-weight="700" fill="#7f1d1d">Caveat — content equality must be an axiom</text>
  <text x="80" y="506" font-size="10.5" fill="#991b1b">Objects are individuated by identity; values by content. Two occurrences of 42 are the same value,</text>
  <text x="80" y="520" font-size="10.5" fill="#991b1b">but two orders with identical fields are different objects.</text>
  <text x="80" y="544" font-size="10.5" fill="#991b1b">Collapsing V into U does not eliminate this distinction — it relocates it. The kernel needs an axiom</text>
  <text x="80" y="558" font-size="10.5" fill="#991b1b">marking certain entities as content-identified (immutable, equal by structure).</text>
  <text x="80" y="572" font-size="10" font-style="italic" fill="#dc2626">This is the one place where the reduction genuinely removes information rather than re-encoding it.</text>

  <defs>
    <marker id="valarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
