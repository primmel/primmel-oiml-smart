<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">Specification equals implementation</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">One artifact, eight uses. The model is not a description of the program; it is the program.</text>

  <!-- Central artifact -->
  <rect x="280" y="240" width="340" height="120" rx="14" fill="#f0fdfa" stroke="#0d9488" stroke-width="2.4"/>
  <rect x="280" y="240" width="340" height="32" rx="14" fill="#0d9488"/>
  <text x="450" y="261" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">The artifact</text>
  <text x="450" y="292" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#115e59" text-anchor="middle">U + τ + ∘</text>
  <text x="450" y="316" font-size="10" fill="#0d9488" text-anchor="middle">one model, the program</text>
  <text x="450" y="340" font-size="9" font-style="italic" fill="#115e59" text-anchor="middle">no translation, no code-gen, no drift</text>

  <!-- 8 uses radiating out -->
  <!-- Top: describe, exchange -->
  <line x1="320" y1="240" x2="180" y2="180" stroke="#475569" stroke-width="1.4"/>
  <line x1="450" y1="240" x2="450" y2="170" stroke="#475569" stroke-width="1.4"/>
  <line x1="580" y1="240" x2="720" y2="180" stroke="#475569" stroke-width="1.4"/>

  <rect x="100" y="140" width="160" height="56" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="180" y="166" font-size="11" font-weight="700" fill="#3730a3" text-anchor="middle">1. Describe</text>
  <text x="180" y="184" font-size="9" fill="#4338ca" text-anchor="middle">surface vocabulary</text>

  <rect x="370" y="140" width="160" height="56" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="450" y="166" font-size="11" font-weight="700" fill="#3730a3" text-anchor="middle">2. Exchange</text>
  <text x="450" y="184" font-size="9" fill="#4338ca" text-anchor="middle">interchange format</text>

  <rect x="640" y="140" width="160" height="56" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="720" y="166" font-size="11" font-weight="700" fill="#3730a3" text-anchor="middle">3. Instantiate</text>
  <text x="720" y="184" font-size="9" fill="#4338ca" text-anchor="middle">runtime factory</text>

  <!-- Sides -->
  <line x1="280" y1="300" x2="140" y2="300" stroke="#475569" stroke-width="1.4"/>
  <line x1="620" y1="300" x2="760" y2="300" stroke="#475569" stroke-width="1.4"/>

  <rect x="40" y="270" width="120" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="100" y="296" font-size="11" font-weight="700" fill="#78350f" text-anchor="middle">8. Modify</text>
  <text x="100" y="314" font-size="9" fill="#92600e" text-anchor="middle">extensibility</text>

  <rect x="740" y="270" width="120" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="800" y="296" font-size="11" font-weight="700" fill="#78350f" text-anchor="middle">4. Execute</text>
  <text x="800" y="314" font-size="9" fill="#92600e" text-anchor="middle">kernel evaluation</text>

  <!-- Bottom: inspect, pause/resume, compose -->
  <line x1="320" y1="360" x2="180" y2="420" stroke="#475569" stroke-width="1.4"/>
  <line x1="450" y1="360" x2="450" y2="430" stroke="#475569" stroke-width="1.4"/>
  <line x1="580" y1="360" x2="720" y2="420" stroke="#475569" stroke-width="1.4"/>

  <rect x="100" y="424" width="160" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="180" y="450" font-size="11" font-weight="700" fill="#14532d" text-anchor="middle">7. Compose</text>
  <text x="180" y="468" font-size="9" fill="#166534" text-anchor="middle">closure under ∘</text>

  <rect x="370" y="430" width="160" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="450" y="456" font-size="11" font-weight="700" fill="#14532d" text-anchor="middle">6. Pause &amp; resume</text>
  <text x="450" y="474" font-size="9" fill="#166534" text-anchor="middle">state-location σ</text>

  <rect x="640" y="424" width="160" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="720" y="450" font-size="11" font-weight="700" fill="#14532d" text-anchor="middle">5. Inspect</text>
  <text x="720" y="468" font-size="9" fill="#166534" text-anchor="middle">resugaring</text>

  <!-- Bottom: what it means -->
  <rect x="60" y="510" width="780" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="80" y="534" font-size="11" font-weight="700" fill="#7f1d1d">Why this is more than executable code</text>
  <text x="80" y="554" font-size="10.5" fill="#991b1b">Ordinary code executes, but usually does not provide a single, uniform ontology through which its identity,</text>
  <text x="80" y="568" font-size="10.5" fill="#991b1b">structure, data, behavior, execution position, and composition can all be examined.</text>
</svg>
