<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">Adoption thesis — engines first, standards follow</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">The virtuous loop: small trusted kernel → independent implementations → standardization follows.</text>

  <!-- The loop -->
  <rect x="60" y="100" width="780" height="320" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
  <rect x="60" y="100" width="780" height="32" rx="10" fill="#475569"/>
  <text x="450" y="121" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">The adoption loop</text>

  <!-- Step 1: small trusted kernel -->
  <rect x="100" y="160" width="200" height="100" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="200" y="186" font-size="11" font-weight="700" fill="#115e59" text-anchor="middle">1. Small trusted kernel</text>
  <text x="200" y="210" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#0d9488" text-anchor="middle">U + τ + ∘</text>
  <text x="200" y="232" font-size="10" fill="#115e59" text-anchor="middle">composition + application</text>
  <text x="200" y="250" font-size="9" font-style="italic" fill="#0d9488" text-anchor="middle">a weekend project</text>

  <!-- Arrow -->
  <line x1="300" y1="210" x2="360" y2="210" stroke="#475569" stroke-width="1.6" marker-end="url(#ad-arr)"/>

  <!-- Step 2: independent implementations -->
  <rect x="360" y="160" width="200" height="100" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="460" y="186" font-size="11" font-weight="700" fill="#78350f" text-anchor="middle">2. 2nd, 3rd impls</text>
  <text x="460" y="208" font-size="10" fill="#92600e" text-anchor="middle">because the kernel is</text>
  <text x="460" y="222" font-size="10" fill="#92600e" text-anchor="middle">small enough to reimplement</text>
  <text x="460" y="246" font-size="9" font-style="italic" fill="#d97706" text-anchor="middle"> interoperability pressure</text>

  <!-- Arrow -->
  <line x1="560" y1="210" x2="620" y2="210" stroke="#475569" stroke-width="1.6" marker-end="url(#ad-arr)"/>

  <!-- Step 3: standardization -->
  <rect x="620" y="160" width="200" height="100" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="720" y="186" font-size="11" font-weight="700" fill="#7f1d1d" text-anchor="middle">3. Standardization</text>
  <text x="720" y="208" font-size="10" fill="#991b1b" text-anchor="middle">codifies what the engines</text>
  <text x="720" y="222" font-size="10" fill="#991b1b" text-anchor="middle">already do</text>
  <text x="720" y="246" font-size="9" font-style="italic" fill="#dc2626" text-anchor="middle">standards follow adoption</text>

  <!-- Loop back arrow -->
  <path d="M 720 260 Q 720 320 460 320 Q 200 320 200 270" stroke="#475569" stroke-width="1.4" stroke-dasharray="4,3" fill="none" marker-end="url(#ad-arr)"/>
  <text x="450" y="340" font-size="10" font-style="italic" fill="#475569" text-anchor="middle">standardization clarifies the contract → more implementations → more adoption</text>

  <!-- Examples -->
  <text x="450" y="380" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Historical examples</text>

  <!-- Adoption thesis -->
  <rect x="60" y="440" width="780" height="140" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="80" y="464" font-size="11.5" font-weight="700" fill="#3730a3">Standardization does not drive adoption. Executability drives adoption, and standardization follows it.</text>

  <text x="80" y="492" font-size="10" fill="#4338ca">• <tspan font-weight="700">SQL</tspan> — System R, Oracle, Ingres (engines, 1970s) → SQL-86 / SQL-92 (standard)</text>
  <text x="80" y="510" font-size="10" fill="#4338ca">• <tspan font-weight="700">RDF</tspan> — Jena, Sesame (triplestores, ~2000) → RDF 1.0 / OWL (2004)</text>
  <text x="80" y="528" font-size="10" fill="#4338ca">• <tspan font-weight="700">BPMN</tspan> — jBPM, Activiti (engines, ~2002) → BPMN 2.0 (2011)</text>
  <text x="80" y="552" font-size="10" font-weight="700" fill="#dc2626">Counter-example:</text>
  <text x="80" y="570" font-size="10" fill="#991b1b">• <tspan font-weight="700">OPM</tspan> — ISO/PAS 19450 (2015, standard first) → no engine ecosystem emerged → negligible adoption</text>

  <defs>
    <marker id="ad-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
</svg>
