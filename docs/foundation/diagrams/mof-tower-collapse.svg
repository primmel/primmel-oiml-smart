<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="ui-sans-serif, system-ui, sans-serif">
  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">MOF tower collapse</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">UML needs four meta-layers. The foundation describes itself with its own eight terms.</text>

  <!-- Left: MOF tower -->
  <rect x="60" y="100" width="380" height="440" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <rect x="60" y="100" width="380" height="36" rx="10" fill="#dc2626"/>
  <text x="250" y="123" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">UML — the four-layer tower</text>

  <!-- M3 -->
  <rect x="100" y="160" width="300" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="250" y="184" font-size="11.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">M3 — MOF (Meta-Object Facility)</text>
  <text x="250" y="202" font-size="9.5" fill="#991b1b" text-anchor="middle">describes M2… and awkwardly, itself</text>

  <!-- M2 -->
  <rect x="100" y="232" width="300" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="250" y="256" font-size="11.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">M2 — UML metamodel</text>
  <text x="250" y="274" font-size="9.5" fill="#991b1b" text-anchor="middle">hundreds of metaclasses</text>

  <!-- M1 -->
  <rect x="100" y="304" width="300" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="250" y="328" font-size="11.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">M1 — your model</text>
  <text x="250" y="346" font-size="9.5" fill="#991b1b" text-anchor="middle">the UML diagrams you write</text>

  <!-- M0 -->
  <rect x="100" y="376" width="300" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="250" y="400" font-size="11.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">M0 — running instances</text>
  <text x="250" y="418" font-size="9.5" fill="#991b1b" text-anchor="middle">the actual system at runtime</text>

  <!-- Arrows -->
  <line x1="250" y1="220" x2="250" y2="232" stroke="#dc2626" stroke-width="1.4" marker-end="url(#mof1)"/>
  <line x1="250" y1="292" x2="250" y2="304" stroke="#dc2626" stroke-width="1.4" marker-end="url(#mof1)"/>
  <line x1="250" y1="364" x2="250" y2="376" stroke="#dc2626" stroke-width="1.4" marker-end="url(#mof1)"/>

  <text x="250" y="466" font-size="10" font-style="italic" fill="#dc2626" text-anchor="middle">Each layer describes the one below.</text>
  <text x="250" y="482" font-size="10" font-style="italic" fill="#dc2626" text-anchor="middle">Four different languages.</text>
  <text x="250" y="510" font-size="10" font-weight="700" fill="#7f1d1d" text-anchor="middle">Closure attempted by fiat:</text>
  <text x="250" y="524" font-size="10" fill="#991b1b" text-anchor="middle">"M3 is self-describing."</text>

  <!-- Right: Foundation -->
  <rect x="460" y="100" width="380" height="440" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <rect x="460" y="100" width="380" height="36" rx="10" fill="#0d9488"/>
  <text x="650" y="123" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Foundation — flat self-description</text>

  <!-- The eight terms, self-describing -->
  <rect x="500" y="170" width="300" height="200" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="2.4"/>
  <text x="650" y="194" font-size="12" font-weight="700" fill="#115e59" text-anchor="middle">The eight terms</text>
  <text x="650" y="220" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#0d9488" text-anchor="middle">IS, HAS, DOES</text>
  <text x="650" y="236" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#0d9488" text-anchor="middle">object, property, value,</text>
  <text x="650" y="252" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#0d9488" text-anchor="middle">process, transition</text>

  <text x="650" y="288" font-size="11" font-weight="700" fill="#115e59" text-anchor="middle">…describe themselves.</text>

  <text x="650" y="318" font-size="10" fill="#0d9488" text-anchor="middle">"Property" is an object.</text>
  <text x="650" y="332" font-size="10" fill="#0d9488" text-anchor="middle">"Transition-type" is an object.</text>
  <text x="650" y="346" font-size="10" fill="#0d9488" text-anchor="middle">The model of the modelling</text>
  <text x="650" y="360" font-size="10" fill="#0d9488" text-anchor="middle">system is just more model.</text>

  <!-- Reflexive completeness -->
  <rect x="500" y="400" width="300" height="120" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="650" y="424" font-size="11" font-weight="700" fill="#3730a3" text-anchor="middle">Reflexively complete</text>
  <text x="650" y="446" font-size="10" fill="#4338ca" text-anchor="middle">No meta-level requires</text>
  <text x="650" y="460" font-size="10" fill="#4338ca" text-anchor="middle">a different vocabulary.</text>
  <text x="650" y="488" font-size="10" font-style="italic" fill="#4f46e5" text-anchor="middle">Closure Rule 1 (§3.7):</text>
  <text x="650" y="502" font-size="10" font-style="italic" fill="#4f46e5" text-anchor="middle">kinds are objects.</text>
</svg>
