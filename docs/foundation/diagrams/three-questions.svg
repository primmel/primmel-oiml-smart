<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="ui-sans-serif, system-ui, sans-serif">
  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">The three natural questions</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">Every description of any entity answers exactly one of three questions.</text>

  <!-- Central entity: a dog -->
  <circle cx="450" cy="300" r="62" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.4"/>
  <text x="450" y="296" font-size="14" font-weight="700" fill="#3730a3" text-anchor="middle">Rex</text>
  <text x="450" y="314" font-size="10.5" fill="#4f46e5" text-anchor="middle">an entity</text>

  <!-- IS arrow (upper-left) -->
  <line x1="396" y1="262" x2="220" y2="170" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="60" y="130" width="240" height="80" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <rect x="60" y="130" width="240" height="26" rx="12" fill="#16a34a"/>
  <text x="180" y="148" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">IS — what is it?</text>
  <text x="180" y="176" font-size="11.5" fill="#14532d" text-anchor="middle">"She is a Labrador."</text>
  <text x="180" y="194" font-size="10.5" fill="#4d7c0f" text-anchor="middle">change it → a different thing</text>

  <!-- HAS arrow (upper-right) -->
  <line x1="504" y1="262" x2="680" y2="170" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <rect x="600" y="130" width="240" height="80" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <rect x="600" y="130" width="240" height="26" rx="12" fill="#d97706"/>
  <text x="720" y="148" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">HAS — what does it have?</text>
  <text x="720" y="176" font-size="11.5" fill="#78350f" text-anchor="middle">"She has a brown coat."</text>
  <text x="720" y="194" font-size="10.5" fill="#92600e" text-anchor="middle">varies without identity change</text>

  <!-- DOES arrow (down) -->
  <line x1="450" y1="364" x2="450" y2="450" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <rect x="330" y="460" width="240" height="100" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <rect x="330" y="460" width="240" height="26" rx="12" fill="#dc2626"/>
  <text x="450" y="478" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">DOES — what does it do?</text>
  <text x="450" y="506" font-size="11.5" fill="#7f1d1d" text-anchor="middle">"She fetches the ball."</text>
  <text x="450" y="524" font-size="10.5" fill="#991b1b" text-anchor="middle">input → transform → output</text>
  <text x="450" y="542" font-size="10.5" fill="#991b1b" text-anchor="middle">behavior with a signature</text>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>
</svg>
