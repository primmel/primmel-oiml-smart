<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">Algorithm — resugaring (Tier 0 → Tier 1)</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">Project a kernel triple back to surface vocabulary for display. Partial — not every triple has a surface form.</text>

  <!-- Signature -->
  <rect x="60" y="90" width="780" height="56" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/>
  <text x="80" y="124" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#115e59">resugar :  KernelTriple  ⇀  Tier1Statement</text>

  <!-- Flowchart -->
  <rect x="60" y="170" width="780" height="320" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.4"/>

  <!-- Input -->
  <rect x="100" y="200" width="240" height="100" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8"/>
  <rect x="100" y="200" width="240" height="26" rx="10" fill="#0d9488"/>
  <text x="220" y="218" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Input (kernel triple)</text>
  <text x="220" y="248" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#115e59" text-anchor="middle">HAS(Rex,</text>
  <text x="220" y="264" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#115e59" text-anchor="middle">     κ,</text>
  <text x="220" y="280" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#115e59" text-anchor="middle">     Mammal)</text>

  <!-- Arrow -->
  <line x1="340" y1="250" x2="400" y2="250" stroke="#475569" stroke-width="1.8" marker-end="url(#res-arr)"/>

  <!-- Steps -->
  <rect x="400" y="200" width="180" height="50" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="490" y="220" font-size="10.5" font-weight="700" fill="#78350f" text-anchor="middle">1. Recognize κ</text>
  <text x="490" y="236" font-size="9" fill="#92600e" text-anchor="middle">is this the kind-property?</text>

  <rect x="400" y="262" width="180" height="50" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="490" y="282" font-size="10.5" font-weight="700" fill="#78350f" text-anchor="middle">2. Match pattern</text>
  <text x="490" y="298" font-size="9" fill="#92600e" text-anchor="middle">value is a kind-object?</text>

  <rect x="400" y="324" width="180" height="50" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="490" y="344" font-size="10.5" font-weight="700" fill="#78350f" text-anchor="middle">3. Project to IS</text>
  <text x="490" y="360" font-size="9" fill="#92600e" text-anchor="middle">emit Tier 1 statement</text>

  <line x1="490" y1="250" x2="490" y2="262" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#res-arr-small)"/>
  <line x1="490" y1="312" x2="490" y2="324" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#res-arr-small)"/>

  <!-- Arrow to output -->
  <line x1="580" y1="349" x2="640" y2="349" stroke="#475569" stroke-width="1.8" marker-end="url(#res-arr)"/>

  <!-- Output -->
  <rect x="640" y="290" width="180" height="100" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
  <rect x="640" y="290" width="180" height="26" rx="10" fill="#4f46e5"/>
  <text x="730" y="308" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Output (Tier 1)</text>
  <text x="730" y="340" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#3730a3" text-anchor="middle">Rex IS Mammal</text>
  <text x="730" y="368" font-size="9" font-style="italic" fill="#4338ca" text-anchor="middle">for display</text>

  <!-- Why partial -->
  <rect x="60" y="510" width="780" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="80" y="532" font-size="11" font-weight="700" fill="#7f1d1d">Why resugaring is partial</text>
  <text x="80" y="550" font-size="10" fill="#991b1b">The kernel is strictly more expressive than the surface — by design. Some kernel triples have</text>
  <text x="80" y="564" font-size="10" fill="#991b1b">no Tier 1 form. Those triples are displayed as themselves.</text>
  <text x="80" y="578" font-size="10" font-style="italic" fill="#dc2626">Constraint: resugaring must be invertible where it succeeds — round-tripping must preserve the original.</text>

  <defs>
    <marker id="res-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="res-arr-small" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
