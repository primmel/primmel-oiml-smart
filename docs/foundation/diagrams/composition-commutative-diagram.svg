<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="ui-sans-serif, system-ui, sans-serif">
  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">Composition closure — the commutative triangle</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">Given f : A → B and g : B → C, the composite g ∘ f : A → C exists and equals h.</text>

  <!-- The triangle -->
  <rect x="60" y="100" width="780" height="320" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
  <rect x="60" y="100" width="780" height="32" rx="10" fill="#475569"/>
  <text x="450" y="121" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">A commutative triangle</text>

  <!-- A -->
  <circle cx="200" cy="340" r="28" fill="#ffffff" stroke="#0f172a" stroke-width="2.4"/>
  <text x="200" y="345" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">A</text>

  <!-- B -->
  <circle cx="700" cy="340" r="28" fill="#ffffff" stroke="#0f172a" stroke-width="2.4"/>
  <text x="700" y="345" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">B</text>

  <!-- C -->
  <circle cx="450" cy="170" r="28" fill="#ffffff" stroke="#0f172a" stroke-width="2.4"/>
  <text x="450" y="175" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">C</text>

  <!-- f : A → B -->
  <line x1="230" y1="340" x2="670" y2="340" stroke="#0d9488" stroke-width="2" marker-end="url(#cd-arr1)"/>
  <text x="450" y="362" font-size="14" font-weight="700" fill="#0d9488" text-anchor="middle">f</text>
  <text x="450" y="378" font-size="9" font-style="italic" fill="#115e59" text-anchor="middle">A → B</text>

  <!-- g : B → C (curved up) -->
  <path d="M 690 314 Q 600 240 470 192" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#cd-arr2)"/>
  <text x="610" y="240" font-size="14" font-weight="700" fill="#16a34a">g</text>
  <text x="610" y="256" font-size="9" font-style="italic" fill="#14532d">B → C</text>

  <!-- h = g ∘ f : A → C (curved up directly) -->
  <path d="M 220 314 Q 320 240 430 192" stroke="#dc2626" stroke-width="2.4" fill="none" marker-end="url(#cd-arr3)"/>
  <text x="290" y="240" font-size="14" font-weight="700" fill="#dc2626">h = g ∘ f</text>
  <text x="290" y="256" font-size="9" font-style="italic" fill="#991b1b">A → C</text>

  <!-- Commutativity annotation -->
  <text x="450" y="400" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">h = g ∘ f  (the triangle commutes)</text>
  <text x="450" y="418" font-size="10" font-style="italic" fill="#475569" text-anchor="middle">Following f then g equals following h directly. The composite is unique.</text>

  <!-- Equation block -->
  <rect x="60" y="440" width="780" height="140" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/>
  <text x="80" y="464" font-size="12" font-weight="700" fill="#115e59">The categorical law</text>

  <text x="80" y="492" font-size="14" font-family="ui-monospace, Menlo, monospace" fill="#0d9488">∀ f : A → B,  g : B → C.</text>
  <text x="80" y="516" font-size="14" font-family="ui-monospace, Menlo, monospace" fill="#0d9488">  ∃! h : A → C.  h = g ∘ f</text>

  <text x="80" y="548" font-size="10.5" font-style="italic" fill="#115e59">The composite exists (closure) and is unique (well-defined).</text>
  <text x="80" y="562" font-size="10.5" font-style="italic" fill="#115e59">This is Theorem 1 of Chapter 4, restated categorically.</text>

  <defs>
    <marker id="cd-arr1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0d9488"/>
    </marker>
    <marker id="cd-arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="cd-arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>
</svg>
