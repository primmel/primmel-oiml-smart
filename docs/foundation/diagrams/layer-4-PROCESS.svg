<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="ui-sans-serif, system-ui, sans-serif">
  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">Layer 4 — PROCESS: the reification bridge</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">ρ : T → O — a transition reified as an object, so it can bear IS-facts and HAS-facts.</text>

  <!-- Formal signature -->
  <rect x="60" y="90" width="280" height="80" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
  <text x="80" y="116" font-size="12" font-weight="700" fill="#0f172a">Formal signature</text>
  <text x="80" y="142" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#0f172a">ρ  :  T  →  O</text>
  <text x="80" y="160" font-size="10" fill="#475569">reification: transition → object</text>

  <!-- Left: the transition t -->
  <rect x="380" y="100" width="180" height="160" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <rect x="380" y="100" width="180" height="32" rx="10" fill="#dc2626"/>
  <text x="470" y="121" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">transition t</text>

  <text x="470" y="156" font-size="10.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">a rule</text>
  <text x="470" y="174" font-size="9.5" fill="#991b1b" text-anchor="middle">"boil water"</text>
  <text x="470" y="200" font-size="10" fill="#991b1b" text-anchor="middle">V_in → V_out</text>
  <text x="470" y="216" font-size="10" fill="#991b1b" text-anchor="middle">input: cold water</text>
  <text x="470" y="230" font-size="10" fill="#991b1b" text-anchor="middle">output: boiling water</text>
  <text x="470" y="250" font-size="9" font-style="italic" fill="#dc2626" text-anchor="middle">a definition — abstract</text>

  <!-- The ρ arrow -->
  <line x1="560" y1="180" x2="660" y2="180" stroke="#4f46e5" stroke-width="2.4" marker-end="url(#rho-arrow)"/>
  <text x="610" y="170" font-size="14" font-weight="700" fill="#4f46e5" text-anchor="middle">ρ</text>
  <text x="610" y="200" font-size="9.5" font-style="italic" fill="#4f46e5" text-anchor="middle">reify</text>

  <!-- Right: the process ρ(t) — an object -->
  <rect x="660" y="100" width="180" height="200" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="660" y="100" width="180" height="32" rx="10" fill="#4f46e5"/>
  <text x="750" y="121" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">ρ(t) — the process</text>

  <text x="750" y="156" font-size="10.5" font-weight="700" fill="#3730a3" text-anchor="middle">an object</text>
  <text x="750" y="174" font-size="9.5" fill="#4338ca" text-anchor="middle">"the boiling happening now"</text>

  <!-- Its IS -->
  <text x="750" y="200" font-size="10" font-weight="700" fill="#14532d" text-anchor="middle">IS-facts</text>
  <text x="750" y="216" font-size="9" fill="#166534" text-anchor="middle">which run is this?</text>
  <text x="750" y="230" font-size="9" fill="#166534" text-anchor="middle">started-at 11:02</text>

  <!-- Its HAS -->
  <text x="750" y="256" font-size="10" font-weight="700" fill="#78350f" text-anchor="middle">HAS-facts</text>
  <text x="750" y="272" font-size="9" fill="#92600e" text-anchor="middle">current-position</text>
  <text x="750" y="286" font-size="9" fill="#92600e" text-anchor="middle">at "heating" step</text>

  <!-- Why this matters -->
  <rect x="60" y="200" width="280" height="280" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <rect x="60" y="200" width="280" height="32" rx="10" fill="#16a34a"/>
  <text x="200" y="221" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Why this matters</text>

  <text x="80" y="254" font-size="10.5" fill="#166534">Rules need to be named,</text>
  <text x="80" y="270" font-size="10.5" fill="#166534">instantiated, paused, retried,</text>
  <text x="80" y="286" font-size="10.5" fill="#166534">tracked.</text>

  <text x="80" y="316" font-size="10.5" font-weight="700" fill="#14532d">A process is the move that lets</text>
  <text x="80" y="332" font-size="10.5" font-weight="700" fill="#14532d">transitions bear facts.</text>

  <text x="80" y="362" font-size="10.5" fill="#166534">Because ρ(t) ∈ O, the whole</text>
  <text x="80" y="378" font-size="10.5" fill="#166534">Layer 0–2 machinery applies:</text>
  <text x="80" y="394" font-size="10.5" fill="#166534">individuation, attribution,</text>
  <text x="80" y="410" font-size="10.5" fill="#166534">reference.</text>

  <text x="80" y="440" font-size="10" font-style="italic" fill="#4d7c0f">Process means</text>
  <text x="80" y="454" font-size="10" font-style="italic" fill="#4d7c0f">"transition-as-object"</text>
  <text x="80" y="468" font-size="10" font-style="italic" fill="#4d7c0f">and nothing more.</text>

  <!-- Bottom: the loop closes -->
  <rect x="380" y="330" width="460" height="150" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="400" y="354" font-size="11.5" font-weight="700" fill="#3730a3">The onion closes on itself</text>
  <text x="400" y="376" font-size="10.5" fill="#4338ca">Layer 4 folds the dynamic axis (DOES/TRANSITION) back into the static</text>
  <text x="400" y="390" font-size="10.5" fill="#4338ca">axis (IS/HAS/OBJECT). One set of machinery serves both.</text>

  <text x="400" y="414" font-size="10.5" font-weight="700" fill="#3730a3">PROCESS = ρ(T) ⊆ O</text>
  <text x="400" y="430" font-size="10" fill="#4338ca">A process is just an object that happens to be a reified transition.</text>
  <text x="400" y="444" font-size="10" fill="#4338ca">It inherits the object machinery without adding a new sort.</text>
  <text x="400" y="466" font-size="10" font-style="italic" fill="#4f46e5">Closure Rule 3 makes this formal — see §3.9.</text>

  <!-- Bottom takeaway -->
  <rect x="60" y="500" width="780" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="80" y="522" font-size="11" font-weight="700" fill="#7f1d1d">The trap</text>
  <text x="80" y="540" font-size="10.5" fill="#991b1b">Any use of "process" that a transition doesn't already cover signals redundancy.</text>
  <text x="80" y="554" font-size="10.5" fill="#991b1b">"Process" and "transition" pick out the same thing at different grains — see Chapter 9.</text>

  <defs>
    <marker id="rho-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f46e5"/>
    </marker>
  </defs>
</svg>
