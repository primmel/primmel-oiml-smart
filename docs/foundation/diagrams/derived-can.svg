<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="ui-sans-serif, system-ui, sans-serif">
  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">CAN = DOES ∧ ¬running(ρ(t))</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">A modal operator on DOES. Strips the actualization commitment — "defined but not currently running."</text>

  <!-- Equation -->
  <rect x="60" y="90" width="780" height="56" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/>
  <text x="80" y="124" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#115e59">CAN(x, t)  ≡  DOES(x, t)  ∧  ¬running(ρ(t))</text>

  <!-- The two conditions -->
  <rect x="60" y="170" width="780" height="200" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
  <rect x="60" y="170" width="780" height="32" rx="10" fill="#475569"/>
  <text x="450" y="191" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">CAN is a conjunction — both halves are existing facts</text>

  <!-- DOES(x, t) -->
  <rect x="100" y="220" width="320" height="130" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="260" y="244" font-size="11.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">DOES(x, t)</text>
  <text x="260" y="270" font-size="10" fill="#991b1b" text-anchor="middle">the transition t is defined</text>
  <text x="260" y="284" font-size="10" fill="#991b1b" text-anchor="middle">for entity x</text>
  <text x="260" y="312" font-size="9" font-style="italic" fill="#dc2626" text-anchor="middle">already a primitive</text>
  <text x="260" y="326" font-size="9" font-style="italic" fill="#dc2626" text-anchor="middle">of the algebra</text>

  <!-- AND -->
  <text x="450" y="294" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">∧</text>

  <!-- ¬running(ρ(t)) -->
  <rect x="480" y="220" width="320" height="130" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="640" y="244" font-size="11.5" font-weight="700" fill="#3730a3" text-anchor="middle">¬running(ρ(t))</text>
  <text x="640" y="270" font-size="10" fill="#4338ca" text-anchor="middle">no instance of t is</text>
  <text x="640" y="284" font-size="10" fill="#4338ca" text-anchor="middle">currently executing</text>
  <text x="640" y="312" font-size="9" font-style="italic" fill="#4f46e5" text-anchor="middle">a quantifier over the</text>
  <text x="640" y="326" font-size="9" font-style="italic" fill="#4f46e5" text-anchor="middle">population of O</text>

  <!-- Boundary problem -->
  <rect x="60" y="390" width="780" height="190" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="80" y="414" font-size="11.5" font-weight="700" fill="#7f1d1d">The boundary problem that exposed CAN</text>
  <text x="80" y="438" font-size="10.5" fill="#991b1b">Any entity "can" do an unbounded number of things under some hypothetical condition.</text>
  <text x="80" y="458" font-size="10.5" font-style="italic" fill="#991b1b">A rock "can" be thrown, ground, used as a paperweight, melted at 1200°C...</text>
  <text x="80" y="484" font-size="10.5" fill="#991b1b">A bucket that's infinite and untestable without external condition-specification isn't</text>
  <text x="80" y="498" font-size="10.5" fill="#991b1b">doing real partitioning work — it's a placeholder for "insert hypothetical here."</text>
  <text x="80" y="524" font-size="10.5" font-weight="700" fill="#7f1d1d">Resolution:</text>
  <text x="80" y="544" font-size="10.5" fill="#991b1b">CAN without a condition is too coarse to be useful.</text>
  <text x="80" y="560" font-size="10.5" fill="#991b1b">CAN with a condition is just "DOES under condition C" — still the same primitive.</text>
  <text x="80" y="574" font-size="10" font-style="italic" fill="#dc2626">Either way, CAN is not a primitive.</text>
</svg>
