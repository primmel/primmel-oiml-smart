<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="50" y="34" font-size="18" font-weight="700" fill="#0f172a">The process model — abstract and executable forms</text>
  <text x="50" y="54" font-size="12.5" fill="#475569">One process, two definition forms. The author’s ladder: abstract first, executable when simulation or automation demands.</text>

  <!-- abstract form -->
  <rect x="50" y="80" width="370" height="220" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <rect x="50" y="80" width="370" height="40" rx="12" fill="#16a34a"/>
  <text x="235" y="106" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">abstract process — requirement-level</text>
  <g font-size="11.5" fill="#14532d">
    <text x="70" y="146" font-weight="700">IS — the signature</text>
    <text x="86" y="166">IN parameters:  stimulus, conditions</text>
    <text x="86" y="184">OUT parameters: observables</text>
    <text x="86" y="202">invariants + state skeleton</text>
    <text x="86" y="220">actor/executor, obligation</text>
    <text x="70" y="252" font-weight="700">reads as:</text>
    <text x="86" y="272" font-style="italic">“a process is required to fulfil these provisions”</text>
  </g>
  <text x="70" y="292" font-size="10" fill="#166534">always valid — no steps needed</text>

  <!-- executable form -->
  <rect x="480" y="80" width="370" height="220" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <rect x="480" y="80" width="370" height="40" rx="12" fill="#dc2626"/>
  <text x="665" y="106" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">executable process — the twin</text>

  <!-- mini flow -->
  <circle cx="512" cy="152" r="9" fill="#0f172a"/>
  <rect x="540" y="136" width="96" height="32" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
  <text x="588" y="156" font-size="10.5" fill="#7f1d1d" text-anchor="middle">stabilize</text>
  <rect x="664" y="136" width="96" height="32" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
  <text x="712" y="156" font-size="10.5" fill="#7f1d1d" text-anchor="middle">apply load</text>
  <rect x="540" y="196" width="96" height="32" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="588" y="216" font-size="10.5" fill="#1e3a8a" text-anchor="middle">hold 30 min</text>
  <rect x="664" y="196" width="96" height="32" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="712" y="216" font-size="10.5" fill="#1e3a8a" text-anchor="middle">record OUT</text>
  <circle cx="800" cy="212" r="9" fill="none" stroke="#0f172a" stroke-width="3"/>

  <g stroke="#475569" stroke-width="1.5" fill="none">
    <line x1="521" y1="152" x2="536" y2="152" marker-end="url(#arrp)"/>
    <line x1="636" y1="152" x2="660" y2="152" marker-end="url(#arrp)"/>
    <line x1="712" y1="168" x2="712" y2="192" marker-end="url(#arrp)"/>
    <line x1="664" y1="212" x2="640" y2="212" marker-end="url(#arrp)"/>
    <line x1="588" y1="196" x2="588" y2="172" marker-end="url(#arrp)"/>
    <line x1="760" y1="212" x2="787" y2="212" marker-end="url(#arrp)"/>
  </g>
  <text x="588" y="246" font-size="9.5" fill="#2563eb" text-anchor="middle">blue = machine step</text>
  <text x="712" y="126" font-size="9.5" fill="#dc2626" text-anchor="middle">red = actor step</text>

  <!-- ladder arrow -->
  <line x1="424" y1="190" x2="474" y2="190" stroke="#9333ea" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrp)"/>
  <text x="449" y="180" font-size="10" fill="#9333ea" text-anchor="middle">refine when needed</text>

  <!-- shared anatomy -->
  <rect x="50" y="330" width="800" height="96" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="70" y="354" font-size="12" font-weight="700" fill="#0f172a">A process is itself a subject — the anatomy recurs</text>
  <text x="70" y="378" font-size="11.5" fill="#16a34a" font-weight="700">IS</text>
  <text x="100" y="378" font-size="11.5" fill="#334155">signature, invariants, designed envelope, executor, obligation</text>
  <text x="70" y="398" font-size="11.5" fill="#d97706" font-weight="700">HAS</text>
  <text x="100" y="398" font-size="11.5" fill="#334155">state, registers/variables, actual context, process characteristics (duration, rate)</text>
  <text x="520" y="378" font-size="11.5" fill="#dc2626" font-weight="700">DOES</text>
  <text x="570" y="378" font-size="11.5" fill="#334155">steps and sub-processes,</text>
  <text x="570" y="394" font-size="11.5" fill="#334155">down to atomic steps</text>

  <!-- evidence bar -->
  <rect x="50" y="446" width="800" height="86" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="70" y="470" font-size="12" font-weight="700" fill="#3730a3">Process I/O = evidence</text>
  <text x="70" y="492" font-size="11.5" fill="#334155">Steps consume and produce records in registries. The execution trace of one run — values, conditions log,</text>
  <text x="70" y="508" font-size="11.5" fill="#334155">state trajectory, timestamps — is the process’s exhibited HAS at run time, stored in the workspace (.pws/).</text>
</svg>
