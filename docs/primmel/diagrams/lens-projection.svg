<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9333ea"/>
    </marker>
  </defs>

  <text x="50" y="34" font-size="18" font-weight="700" fill="#0f172a">The lens: an implementation read through a reference</text>
  <text x="50" y="54" font-size="12.5" fill="#475569">map_profile qms-ref projects ims-demo onto the qms-ref tree — the levels are computed by the calculus, never authored.</text>

  <!-- implementation model -->
  <rect x="50" y="86" width="230" height="330" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="165" y="112" font-size="13" font-weight="700" fill="#3730a3" text-anchor="middle">ims-demo</text>
  <text x="165" y="128" font-size="10.5" fill="#4f46e5" text-anchor="middle">implementation — five processes (fictional)</text>

  <rect x="70" y="146" width="190" height="42" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="165" y="164" font-size="11" fill="#3730a3" text-anchor="middle">PolicyAndObjectives</text>
  <text x="165" y="180" font-size="9.5" fill="#64748b" text-anchor="middle">two pairs into qms-ref</text>

  <rect x="70" y="198" width="190" height="42" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="165" y="216" font-size="11" fill="#3730a3" text-anchor="middle">InternalAudit</text>
  <text x="165" y="232" font-size="9.5" fill="#64748b" text-anchor="middle">one pair into qms-ref</text>

  <rect x="70" y="250" width="190" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="165" y="268" font-size="11" fill="#64748b" text-anchor="middle">RiskProcess</text>
  <text x="165" y="284" font-size="9.5" fill="#94a3b8" text-anchor="middle">outside this lens (ISMS only)</text>

  <rect x="70" y="302" width="190" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="165" y="320" font-size="11" fill="#64748b" text-anchor="middle">AccessAndIncidents</text>
  <text x="165" y="336" font-size="9.5" fill="#94a3b8" text-anchor="middle">outside this lens (ISMS only)</text>

  <rect x="70" y="354" width="190" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="165" y="372" font-size="11" fill="#64748b" text-anchor="middle">LogisticsOutsourcing</text>
  <text x="165" y="388" font-size="9.5" fill="#94a3b8" text-anchor="middle">mapped nowhere</text>

  <!-- the lens -->
  <rect x="310" y="196" width="96" height="110" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="1.6"/>
  <text x="358" y="238" font-size="10.5" font-weight="700" fill="#7e22ce" text-anchor="middle">map_profile</text>
  <text x="358" y="254" font-size="11.5" font-weight="700" fill="#7e22ce" text-anchor="middle">qms-ref</text>
  <text x="358" y="272" font-size="9.5" fill="#9333ea" text-anchor="middle">the lens</text>

  <line x1="260" y1="167" x2="310" y2="225" stroke="#9333ea" stroke-width="1.6" marker-end="url(#arrl)"/>
  <line x1="260" y1="219" x2="310" y2="252" stroke="#9333ea" stroke-width="1.6" marker-end="url(#arrl)"/>

  <!-- the projected reference tree (reference-shaped) -->
  <text x="430" y="86" font-size="10.5" fill="#64748b">the projected view is REFERENCE-SHAPED: the qms-ref tree,</text>
  <text x="430" y="100" font-size="10.5" fill="#64748b">each node decorated with its computed level + mappedBy</text>

  <rect x="430" y="116" width="200" height="42" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="530" y="134" font-size="11" font-weight="600" fill="#166534" text-anchor="middle">PlanQms — FULL</text>
  <text x="530" y="150" font-size="9.5" fill="#16a34a" text-anchor="middle">aggregated from its children</text>

  <line x1="500" y1="158" x2="470" y2="176" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="560" y1="158" x2="580" y2="176" stroke="#94a3b8" stroke-width="1.2"/>

  <rect x="445" y="176" width="170" height="34" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="530" y="197" font-size="10" fill="#166534" text-anchor="middle">QualityPolicy — full</text>
  <rect x="445" y="216" width="170" height="34" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="530" y="237" font-size="10" fill="#166534" text-anchor="middle">QualityObjectives — full</text>

  <rect x="430" y="286" width="200" height="42" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="530" y="304" font-size="11" font-weight="600" fill="#1e40af" text-anchor="middle">ImproveQms — MINIMAL</text>
  <text x="530" y="320" font-size="9.5" fill="#2563eb" text-anchor="middle">gateway: the minimum is met</text>

  <line x1="500" y1="328" x2="470" y2="346" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="560" y1="328" x2="580" y2="346" stroke="#94a3b8" stroke-width="1.2"/>

  <rect x="445" y="346" width="170" height="34" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="530" y="367" font-size="10" fill="#166534" text-anchor="middle">CorrectiveAction — full</text>
  <rect x="445" y="386" width="170" height="34" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="530" y="407" font-size="10" fill="#b91c1c" text-anchor="middle">ContinualImprovement — none</text>

  <line x1="406" y1="225" x2="450" y2="193" stroke="#9333ea" stroke-width="1.6" marker-end="url(#arrl)"/>
  <line x1="406" y1="252" x2="450" y2="233" stroke="#9333ea" stroke-width="1.6" marker-end="url(#arrl)"/>
  <line x1="406" y1="278" x2="450" y2="363" stroke="#9333ea" stroke-width="1.6" marker-end="url(#arrl)"/>

  <!-- legend / reading notes -->
  <rect x="660" y="116" width="190" height="304" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="755" y="140" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">reading the lens</text>

  <rect x="676" y="156" width="58" height="18" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
  <text x="705" y="169" font-size="9.5" font-weight="600" fill="#166534" text-anchor="middle">full</text>
  <text x="742" y="169" font-size="9.5" fill="#475569">all fulfilled</text>

  <rect x="676" y="182" width="58" height="18" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="705" y="195" font-size="9.5" font-weight="600" fill="#1e40af" text-anchor="middle">minimal</text>
  <text x="742" y="195" font-size="9.5" fill="#475569">gateway minimum</text>

  <rect x="676" y="208" width="58" height="18" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="705" y="221" font-size="9.5" font-weight="600" fill="#92400e" text-anchor="middle">partial</text>
  <text x="742" y="221" font-size="9.5" fill="#475569">some, not enough</text>

  <rect x="676" y="234" width="58" height="18" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="705" y="247" font-size="9.5" font-weight="600" fill="#b91c1c" text-anchor="middle">none</text>
  <text x="742" y="247" font-size="9.5" fill="#475569">the open gap</text>

  <text x="676" y="282" font-size="9.5" fill="#475569">every node drills down to its</text>
  <text x="676" y="296" font-size="9.5" fill="#475569">mappedBy sources with the pair's</text>
  <text x="676" y="310" font-size="9.5" fill="#475569">description + justification —</text>
  <text x="676" y="324" font-size="9.5" fill="#475569">the auditor's surface.</text>

  <text x="676" y="352" font-size="9.5" fill="#475569">levels: inherit down, aggregate</text>
  <text x="676" y="366" font-size="9.5" fill="#475569">up — computed, never authored.</text>

  <text x="676" y="394" font-size="9.5" fill="#475569">a view never edits the model</text>
  <text x="676" y="408" font-size="9.5" fill="#475569">or its mappings (C26).</text>

  <!-- outside this lens -->
  <rect x="50" y="452" width="800" height="76" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="70" y="478" font-size="11" font-weight="700" fill="#334155">Outside this lens — first-class output, never an omission</text>
  <text x="70" y="498" font-size="10.5" fill="#475569">RiskProcess, AccessAndIncidents, LogisticsOutsourcing: the implementation processes with no resolving pair into qms-ref.</text>
  <text x="70" y="516" font-size="10.5" fill="#475569">They are exactly the IMS's non-QMS operations — the composition fold (next diagram) needs them to prove every element serves a standard.</text>
</svg>
