<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="arrD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="50" y="34" font-size="18" font-weight="700" fill="#0f172a">The model-native Digital Product Passport</text>
  <text x="50" y="54" font-size="12.5" fill="#475569">The passport is a projection of the model — served by it, verified through it, never a document that can drift from it.</text>

  <!-- subject model + live instance -->
  <rect x="50" y="90" width="240" height="200" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="170" y="116" font-size="13" font-weight="700" fill="#3730a3" text-anchor="middle">subject model + live instance</text>
  <g font-size="10.5" fill="#3730a3">
    <text x="66" y="146" font-weight="700">IS — the identity</text>
    <text x="80" y="164" font-size="10" fill="#4f46e5">metadata, provenance, structure</text>
    <text x="80" y="180" font-size="10" fill="#4f46e5">design parameters, promises</text>
    <text x="66" y="208" font-weight="700">HAS — the live state</text>
    <text x="80" y="226" font-size="10" fill="#4f46e5">attributes, characteristics, artifacts</text>
    <text x="66" y="254" font-weight="700">DOES — the behavior</text>
    <text x="80" y="272" font-size="10" fill="#4f46e5">processes, invocable endpoint</text>
  </g>

  <!-- projection arrow -->
  <line x1="290" y1="190" x2="336" y2="190" stroke="#475569" stroke-width="2" marker-end="url(#arrD)"/>
  <text x="313" y="180" font-size="10" fill="#475569" text-anchor="middle">project</text>

  <!-- passport -->
  <rect x="340" y="80" width="280" height="220" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="480" y="106" font-size="13.5" font-weight="700" fill="#166534" text-anchor="middle">PASSPORT (a projection)</text>
  <g font-size="10.5" fill="#14532d">
    <text x="356" y="136">identity — designation, ids, manufacturer</text>
    <text x="356" y="158">composition — structure, materials</text>
    <text x="356" y="180">claims — promises-as-verified</text>
    <text x="356" y="202">compliance status — live verdict summary</text>
    <text x="356" y="224">artifacts — evidence files, certificates</text>
    <text x="356" y="246">sustainability data — regulatory attributes</text>
  </g>
  <rect x="356" y="262" width="248" height="26" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="480" y="279" font-size="9.5" fill="#166534" text-anchor="middle">access classes: public / restricted / authority</text>

  <!-- identifier + carrier -->
  <line x1="480" y1="300" x2="480" y2="346" stroke="#475569" stroke-width="1.8" marker-end="url(#arrD)"/>
  <rect x="340" y="350" width="280" height="60" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text x="480" y="373" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="middle">unique identifier + data carrier</text>
  <text x="480" y="391" font-size="10" fill="#92600e" text-anchor="middle">on-product QR / RFID → resolves to the passport endpoint</text>

  <!-- consumers -->
  <g>
    <rect x="120" y="450" width="200" height="56" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
    <text x="220" y="473" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">EU DPP registry</text>
    <text x="220" y="490" font-size="9.5" fill="#475569" text-anchor="middle">identifier lookup (2026-07-19)</text>

    <rect x="380" y="450" width="200" height="56" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
    <text x="480" y="473" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">customers &amp; recyclers</text>
    <text x="480" y="490" font-size="9.5" fill="#475569" text-anchor="middle">public access class</text>

    <rect x="640" y="450" width="200" height="56" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
    <text x="740" y="473" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">market surveillance</text>
    <text x="740" y="490" font-size="9.5" fill="#475569" text-anchor="middle">authority access class + verdicts</text>

    <line x1="480" y1="410" x2="220" y2="446" stroke="#475569" stroke-width="1.4" marker-end="url(#arrD)"/>
    <line x1="480" y1="410" x2="480" y2="446" stroke="#475569" stroke-width="1.4" marker-end="url(#arrD)"/>
    <line x1="480" y1="410" x2="740" y2="446" stroke="#475569" stroke-width="1.4" marker-end="url(#arrD)"/>
  </g>

  <!-- JTC24 mapping -->
  <rect x="50" y="540" width="860" height="84" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="70" y="563" font-size="11.5" font-weight="700" fill="#0f172a">CEN/CENELEC JTC24's eight standard areas, answered by the frame:</text>
  <text x="70" y="583" font-size="10.5" fill="#475569">unique identifiers → provenance ids · data carriers → artifact + endpoint linkage · access rights → roles/scopes · interoperability → one language</text>
  <text x="70" y="600" font-size="10.5" fill="#475569">data exchange → endpoint operations · storage/persistence → workspace (.pws/) · authentication/integrity → version-pinned evidence · APIs → the passport endpoint itself</text>
</svg>
