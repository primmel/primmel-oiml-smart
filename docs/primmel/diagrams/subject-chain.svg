<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arr3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9333ea"/>
    </marker>
  </defs>

  <text x="50" y="34" font-size="18" font-weight="700" fill="#0f172a">The subject chain and instantiation</text>
  <text x="50" y="54" font-size="12.5" fill="#475569">A Sample is an instance of a Model. Attribute resolution delegates upward; instances never copy down.</text>

  <!-- delegation arc -->
  <path d="M 770 130 C 770 60, 150 60, 150 128" fill="none" stroke="#9333ea" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr3)"/>
  <text x="450" y="82" font-size="11.5" fill="#9333ea" text-anchor="middle">attribute resolution delegates upward (INV-10) — a lower value overrides; values are never copied down</text>

  <!-- chain boxes -->
  <g>
    <rect x="60" y="130" width="160" height="64" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
    <text x="140" y="156" font-size="13.5" font-weight="700" fill="#3730a3" text-anchor="middle">ModelFamily</text>
    <text x="140" y="174" font-size="10" fill="#4f46e5" text-anchor="middle">VIML 4.02</text>

    <rect x="280" y="130" width="160" height="64" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
    <text x="360" y="156" font-size="13.5" font-weight="700" fill="#3730a3" text-anchor="middle">ModelGroup</text>
    <text x="360" y="174" font-size="10" fill="#4f46e5" text-anchor="middle">domain level (e.g. R 60 §3.4.2)</text>

    <rect x="500" y="130" width="160" height="64" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.4"/>
    <text x="580" y="156" font-size="13.5" font-weight="700" fill="#3730a3" text-anchor="middle">Model (“type”)</text>
    <text x="580" y="174" font-size="10" fill="#4f46e5" text-anchor="middle">VIML 4.06 — centre of conformity</text>

    <rect x="700" y="130" width="160" height="64" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2.4"/>
    <text x="780" y="156" font-size="13.5" font-weight="700" fill="#92400e" text-anchor="middle">Sample</text>
    <text x="780" y="174" font-size="10" fill="#92600e" text-anchor="middle">VIML 4.09 — one physical unit</text>
  </g>

  <!-- chain arrows -->
  <g stroke="#475569" stroke-width="1.8" fill="none">
    <line x1="220" y1="162" x2="276" y2="162" marker-end="url(#arr2)"/>
    <line x1="440" y1="162" x2="496" y2="162" marker-end="url(#arr2)"/>
    <line x1="660" y1="162" x2="696" y2="162" marker-end="url(#arr2)"/>
  </g>
  <text x="248" y="152" font-size="10" fill="#475569" text-anchor="middle">has many</text>
  <text x="468" y="152" font-size="10" fill="#475569" text-anchor="middle">has many</text>
  <text x="678" y="152" font-size="10" fill="#475569" text-anchor="middle">instantiates</text>

  <!-- scope badges -->
  <g font-size="10.5">
    <rect x="60" y="214" width="160" height="118" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="72" y="234" font-weight="700" fill="#334155">family scope</text>
    <text x="72" y="252" fill="#475569">family criteria, shared</text>
    <text x="72" y="266" fill="#475569">specs, e_min, p_LC,</text>
    <text x="72" y="280" fill="#475569">technology, materials</text>
    <text x="72" y="308" fill="#64748b">inherited defaults</text>

    <rect x="280" y="214" width="160" height="118" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="292" y="234" font-weight="700" fill="#334155">group scope</text>
    <text x="292" y="252" fill="#475569">identical metrological</text>
    <text x="292" y="266" fill="#475569">characteristics: class,</text>
    <text x="292" y="280" fill="#475569">n_lc, y, z, v_min, dr</text>
    <text x="292" y="308" fill="#64748b">unit of sample selection</text>

    <rect x="500" y="214" width="160" height="118" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="512" y="234" font-weight="700" fill="#334155">model scope</text>
    <text x="512" y="252" fill="#475569">distinguishes one catalog</text>
    <text x="512" y="266" fill="#475569">model: e_max, mr_max,</text>
    <text x="512" y="280" fill="#475569">software id, interfaces</text>
    <text x="512" y="308" fill="#64748b">what gets type-approved</text>

    <rect x="700" y="214" width="160" height="118" rx="8" fill="#fffbeb" stroke="#d97706"/>
    <text x="712" y="234" font-weight="700" fill="#92400e">sample scope</text>
    <text x="712" y="252" fill="#78350f">test context — chosen</text>
    <text x="712" y="266" fill="#78350f">under test: d_min, d_max,</text>
    <text x="712" y="280" fill="#78350f">v, n, mr, serial no.</text>
    <text x="712" y="308" fill="#92600e">never inherited</text>
  </g>

  <!-- instance anatomy -->
  <rect x="60" y="366" width="800" height="124" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="80" y="392" font-size="12.5" font-weight="700" fill="#0f172a">The Sample as a subject instance</text>
  <g font-size="11.5" fill="#334155">
    <text x="80" y="418" font-weight="700" fill="#16a34a">IS — inherited by delegation</text>
    <text x="80" y="436" fill="#475569">the Model’s design parameters, designed conditions, promises and structure resolve through the chain</text>
    <text x="480" y="418" font-weight="700" fill="#d97706">HAS — its own exhibition</text>
    <text x="480" y="436" fill="#475569">serial number, test-context values, operational state, actual context, measured characteristics</text>
    <text x="80" y="466" font-weight="700" fill="#dc2626">DOES — executes the Model’s behaviors</text>
    <text x="80" y="484" fill="#475569">processes run on the Sample; the execution trace (runs, evidence) is the Sample’s exhibited HAS at run time</text>
  </g>
</svg>
