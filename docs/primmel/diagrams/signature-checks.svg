<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrPc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">Typed transition boundaries — the composition signature checks</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">C74 one name, one type · C75 every read covered · C76 every call bound — computed over the composed package, post-merge.</text>

  <!-- the load_weight chain -->
  <text x="60" y="90" font-size="13" font-weight="700" fill="#1e293b">The first consumer — R 60 <tspan font-family="ui-monospace, monospace" font-size="12">load_weight</tspan> (R 60-1, 4 Figure 2; executor machine)</text>

  <!-- chain chips -->
  <g font-size="10.5" text-anchor="middle">
    <rect x="60" y="106" width="104" height="52" rx="9" fill="#f8fafc" stroke="#475569" stroke-width="1.4"/>
    <text x="112" y="128" font-weight="700" fill="#1e293b">transduce</text>
    <text x="112" y="146" font-size="9" fill="#64748b">force conversion</text>
    <rect x="186" y="106" width="104" height="52" rx="9" fill="#f8fafc" stroke="#475569" stroke-width="1.4"/>
    <text x="238" y="128" font-weight="700" fill="#1e293b">linearize</text>
    <text x="238" y="146" font-size="9" fill="#64748b">passive analogue</text>
    <rect x="312" y="106" width="104" height="52" rx="9" fill="#f8fafc" stroke="#475569" stroke-width="1.4"/>
    <text x="364" y="128" font-weight="700" fill="#1e293b">amplify</text>
    <text x="364" y="146" font-size="9" fill="#64748b">active analogue</text>
    <rect x="438" y="106" width="104" height="52" rx="9" fill="#f8fafc" stroke="#475569" stroke-width="1.4"/>
    <text x="490" y="128" font-weight="700" fill="#1e293b">digitize</text>
    <text x="490" y="146" font-size="9" fill="#64748b">A/D conversion</text>
    <rect x="564" y="106" width="104" height="52" rx="9" fill="#f8fafc" stroke="#475569" stroke-width="1.4"/>
    <text x="616" y="128" font-weight="700" fill="#1e293b">filter</text>
    <text x="616" y="146" font-size="9" fill="#64748b">digital filtering</text>
    <rect x="690" y="106" width="110" height="52" rx="9" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
    <text x="745" y="128" font-weight="700" fill="#3730a3">scale ⟿ calls</text>
    <text x="745" y="146" font-size="9" fill="#4f46e5">scale_indication</text>
  </g>
  <g stroke="#475569" stroke-width="1.5" fill="none">
    <line x1="164" y1="132" x2="182" y2="132" marker-end="url(#arrP)"/>
    <line x1="290" y1="132" x2="308" y2="132" marker-end="url(#arrP)"/>
    <line x1="416" y1="132" x2="434" y2="132" marker-end="url(#arrP)"/>
    <line x1="542" y1="132" x2="562" y2="132" marker-end="url(#arrP)"/>
    <line x1="668" y1="132" x2="686" y2="132" marker-end="url(#arrP)"/>
  </g>
  <!-- typed edge labels -->
  <g font-size="8.5" fill="#64748b" text-anchor="middle">
    <text x="60" y="102" text-anchor="start">in: applied_load : mass · e_lim : mass</text>
    <text x="173" y="176">raw : V</text>
    <text x="299" y="176">linearized : V</text>
    <text x="425" y="176">amplified : V</text>
    <text x="553" y="176">raw_counts : count</text>
    <text x="679" y="176">filtered : count</text>
    <text x="800" y="102" text-anchor="end">out: indication : mass</text>
  </g>

  <!-- gateway -->
  <g>
    <path d="M 745 190 L 785 218 L 745 246 L 705 218 z" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
    <text x="745" y="222" font-size="9.5" font-weight="700" fill="#78350f" text-anchor="middle">overload?</text>
    <line x1="745" y1="158" x2="745" y2="186" stroke="#475569" stroke-width="1.5" marker-end="url(#arrP)"/>
    <text x="660" y="252" font-size="9.5" fill="#991b1b" text-anchor="middle">flag = 1 → refused</text>
    <text x="830" y="252" font-size="9.5" fill="#166534" text-anchor="middle">else → deliver</text>
    <path d="M 705 218 L 660 218 L 660 240" fill="none" stroke="#dc2626" stroke-width="1.3"/>
    <path d="M 785 218 L 830 218 L 830 240" fill="none" stroke="#16a34a" stroke-width="1.3"/>
  </g>

  <!-- the three checks -->
  <text x="60" y="300" font-size="13" font-weight="700" fill="#1e293b">The three boundary checks — each violation trips exactly its own check</text>

  <rect x="60" y="316" width="250" height="150" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
  <text x="76" y="340" font-size="12.5" font-weight="700" fill="#3730a3">C74 — one name, one type</text>
  <text x="76" y="362" font-size="10" fill="#475569">process-io-type-coherence</text>
  <text x="76" y="384" font-size="10" fill="#475569">a name carries ONE type across</text>
  <text x="76" y="400" font-size="10" fill="#475569">signature · registers · step I/O</text>
  <text x="76" y="424" font-size="10" font-weight="600" fill="#991b1b">seed: raw_signal as count at one site</text>
  <text x="76" y="440" font-size="10" fill="#991b1b">⇒ exactly one C74 error, no collateral</text>
  <text x="76" y="458" font-size="9.5" fill="#4f46e5">types are quantity-register kinds/units (INV-1)</text>

  <rect x="325" y="316" width="250" height="150" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
  <text x="341" y="340" font-size="12.5" font-weight="700" fill="#3730a3">C75 — every read covered</text>
  <text x="341" y="362" font-size="10" fill="#475569">process-flow-io-cover</text>
  <text x="341" y="384" font-size="10" fill="#475569">a step reads only what an incoming</text>
  <text x="341" y="400" font-size="10" fill="#475569">path writes — no read-from-nothing</text>
  <text x="341" y="424" font-size="10" font-weight="600" fill="#991b1b">seed: a step reads a value no path</text>
  <text x="341" y="440" font-size="10" fill="#991b1b">writes ⇒ exactly one C75 error</text>
  <text x="341" y="458" font-size="9.5" fill="#4f46e5">the chain above: write → read, stage by stage</text>

  <rect x="590" y="316" width="250" height="150" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
  <text x="606" y="340" font-size="12.5" font-weight="700" fill="#3730a3">C76 — every call bound</text>
  <text x="606" y="362" font-size="10" fill="#475569">subprocess-signature-bound</text>
  <text x="606" y="384" font-size="10" fill="#475569">a calls step binds the sub-process's</text>
  <text x="606" y="400" font-size="10" fill="#475569">signature: every IN fed, every OUT</text>
  <text x="606" y="416" font-size="10" fill="#475569">landed, types kind-compatible</text>
  <text x="606" y="440" font-size="10" font-weight="600" fill="#991b1b">seed: unit mismatch at the call</text>
  <text x="606" y="456" font-size="10" fill="#991b1b">boundary ⇒ exactly one C76 error</text>

  <!-- scale_indication binding detail -->
  <rect x="60" y="490" width="780" height="70" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.4"/>
  <text x="76" y="511" font-size="11" font-weight="700" fill="#1e293b">The C76 case, verbatim — scale binds the abstract scaling stage:</text>
  <text x="76" y="529" font-size="9.5" fill="#475569" font-family="ui-monospace, monospace">calls scale_indication { with { in  { filtered_counts : filtered_counts   e_lim : e_lim }</text>
  <text x="76" y="546" font-size="9.5" fill="#475569" font-family="ui-monospace, monospace">                              out { indication : indication   overload_flag : overload_flag } } }</text>

  <!-- bottom bar -->
  <rect x="60" y="578" width="780" height="48" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="80" y="599" font-size="11.5" font-weight="600" fill="#0f172a">Executable has a checkable definition of done: steps realize the signature (C13), boundaries cohere (C74),</text>
  <text x="80" y="616" font-size="11" fill="#475569">dataflow covers (C75), calls are bound (C76) — an anatomy that passes is one a simulator can execute as-is.</text>
</svg>
