<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrS" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9333ea"/>
    </marker>
  </defs>

  <text x="48" y="36" font-size="18" font-weight="700" fill="#0f172a">The three-layer stack: what the twin is — and what certification proves</text>
  <text x="48" y="56" font-size="12.5" fill="#475569">Physical device → full digital twin → the Primmel twin as governed projection → certification of the projection's fidelity.</text>

  <!-- layer 1: physical device -->
  <rect x="60" y="90" width="520" height="72" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="320" y="116" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">PHYSICAL DEVICE</text>
  <text x="320" y="136" font-size="10.5" fill="#475569" text-anchor="middle">the measuring instrument in the world — its physics, its display, its faults</text>

  <!-- arrow: representation -->
  <line x1="320" y1="166" x2="320" y2="192" stroke="#64748b" stroke-width="1.6" marker-start="url(#arrS)" marker-end="url(#arrS)"/>
  <text x="336" y="184" font-size="10" fill="#64748b">representation — any shape</text>

  <!-- layer 2: full digital twin -->
  <rect x="60" y="196" width="520" height="88" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="320" y="222" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">FULL DIGITAL TWIN</text>
  <text x="320" y="240" font-size="10.5" fill="#475569" text-anchor="middle">the manufacturer's complete representation — simulation, telemetry, history</text>
  <text x="320" y="256" font-size="10.5" fill="#475569" text-anchor="middle">arbitrarily rich; nothing here constrains it, nothing certifies its "completeness"</text>

  <!-- arrow: projection -->
  <line x1="320" y1="288" x2="320" y2="318" stroke="#9333ea" stroke-width="1.8" marker-start="url(#arrV)" marker-end="url(#arrV)"/>
  <text x="336" y="300" font-size="10" font-weight="600" fill="#7e22ce">PROJECTION — declared by the governed aspect set</text>
  <text x="336" y="313" font-size="9.5" fill="#7e22ce">(the explicit projection mapping — TODO.v2/16, ch. 14 §14.3)</text>

  <!-- layer 3: primmel twin -->
  <rect x="60" y="322" width="520" height="88" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="320" y="348" font-size="13" font-weight="700" fill="#3730a3" text-anchor="middle">PRIMMEL TWIN</text>
  <text x="320" y="366" font-size="10.5" fill="#4f46e5" text-anchor="middle">the governed STATE PROJECTION — declared registers + freshness + provenance</text>
  <text x="320" y="382" font-size="10.5" fill="#4f46e5" text-anchor="middle">you read what the standard governs from it</text>

  <!-- arrow: fidelity proof -->
  <line x1="320" y1="414" x2="320" y2="444" stroke="#64748b" stroke-width="1.6" marker-start="url(#arrS)" marker-end="url(#arrS)"/>
  <text x="336" y="434" font-size="10" fill="#64748b">fidelity proof — served ≡ physical within δ + freshness, continuously</text>

  <!-- layer 4: twin certification -->
  <rect x="60" y="448" width="520" height="88" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="320" y="474" font-size="13" font-weight="700" fill="#166534" text-anchor="middle">TWIN CERTIFICATION</text>
  <text x="320" y="492" font-size="10.5" fill="#166534" text-anchor="middle">certifies the PROJECTION's fidelity — per unit, per register, within declared δ</text>
  <text x="320" y="508" font-size="10.5" fill="#166534" text-anchor="middle">never the full twin's completeness</text>

  <!-- the admin-shell contrast -->
  <rect x="624" y="196" width="296" height="214" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="772" y="224" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">NOT this</text>
  <text x="772" y="246" font-size="10.5" fill="#991b1b" text-anchor="middle">the twin as a command API —</text>
  <text x="772" y="262" font-size="10.5" fill="#991b1b" text-anchor="middle">verbs, remote control</text>
  <text x="772" y="278" font-size="10.5" fill="#991b1b" text-anchor="middle">(the "administration shell")</text>
  <line x1="660" y1="296" x2="884" y2="296" stroke="#fca5a5" stroke-width="1"/>
  <text x="772" y="318" font-size="10" fill="#b91c1c" text-anchor="middle">A command surface drives the instrument;</text>
  <text x="772" y="334" font-size="10" fill="#b91c1c" text-anchor="middle">it can be wrong about everything the</text>
  <text x="772" y="350" font-size="10" fill="#b91c1c" text-anchor="middle">standard governs and still answer verbs.</text>
  <text x="772" y="376" font-size="10" font-weight="600" fill="#991b1b" text-anchor="middle">The Primmel twin is read-only governance:</text>
  <text x="772" y="392" font-size="10" fill="#991b1b" text-anchor="middle">a state projection, certified for fidelity.</text>

  <!-- footer note -->
  <text x="60" y="572" font-size="10.5" fill="#64748b">Each layer up says less, more precisely — until the claim is small enough to be falsifiable, and a certificate can honestly carry it.</text>
</svg>
