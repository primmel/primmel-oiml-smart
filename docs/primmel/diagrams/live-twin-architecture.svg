<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="arrL" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9333ea"/>
    </marker>
  </defs>

  <text x="50" y="34" font-size="18" font-weight="700" fill="#0f172a">The live twin under continuous compliance</text>
  <text x="50" y="54" font-size="12.5" fill="#475569">The product serves its own model; the engine judges it continuously; the evidence accumulates for audit.</text>

  <!-- physical product -->
  <rect x="50" y="100" width="150" height="90" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="125" y="130" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">the product</text>
  <text x="125" y="150" font-size="10.5" fill="#475569" text-anchor="middle">a running load cell,</text>
  <text x="125" y="164" font-size="10.5" fill="#475569" text-anchor="middle">a fridge, a building</text>
  <line x1="200" y1="145" x2="246" y2="145" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrL)"/>
  <text x="223" y="136" font-size="9.5" fill="#64748b" text-anchor="middle">sensors</text>

  <!-- live twin -->
  <rect x="250" y="80" width="220" height="240" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="360" y="106" font-size="13.5" font-weight="700" fill="#3730a3" text-anchor="middle">LIVE TWIN</text>
  <text x="360" y="122" font-size="10" fill="#4f46e5" text-anchor="middle">a subject instance, served</text>
  <rect x="266" y="136" width="188" height="34" rx="7" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
  <text x="360" y="150" font-size="10" font-weight="700" fill="#166534" text-anchor="middle">IS — identity, promises,</text>
  <text x="360" y="163" font-size="9.5" fill="#166534" text-anchor="middle">endpoint declaration</text>
  <rect x="266" y="176" width="188" height="34" rx="7" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="360" y="190" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">HAS — live values, state,</text>
  <text x="360" y="203" font-size="9.5" fill="#92400e" text-anchor="middle">served with timestamps</text>
  <rect x="266" y="216" width="188" height="34" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="360" y="230" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">DOES — processes,</text>
  <text x="360" y="243" font-size="9.5" fill="#991b1b" text-anchor="middle">remotely invocable</text>
  <rect x="266" y="262" width="188" height="42" rx="7" fill="#ffffff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="360" y="279" font-size="10" font-weight="700" fill="#3730a3" text-anchor="middle">ENDPOINT</text>
  <text x="360" y="294" font-size="9.5" fill="#4f46e5" text-anchor="middle">query · subscribe · invoke</text>

  <!-- gateway -->
  <line x1="470" y1="200" x2="516" y2="200" stroke="#475569" stroke-width="1.8" marker-end="url(#arrL)"/>
  <rect x="520" y="130" width="160" height="140" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="1.8"/>
  <text x="600" y="156" font-size="12.5" font-weight="700" fill="#6b21a8" text-anchor="middle">API GATEWAY</text>
  <text x="600" y="176" font-size="10" fill="#7e22ce" text-anchor="middle">connector profiles</text>
  <text x="600" y="194" font-size="10" fill="#7e22ce" text-anchor="middle">pull (schedule) · push (signal)</text>
  <text x="600" y="212" font-size="10" fill="#7e22ce" text-anchor="middle">authentication (roles)</text>
  <text x="600" y="230" font-size="10" font-weight="700" fill="#7e22ce" text-anchor="middle">freshness checks</text>
  <text x="600" y="248" font-size="9.5" fill="#9333ea" text-anchor="middle">stale ⇒ indeterminate, never silent</text>

  <!-- engine -->
  <line x1="680" y1="200" x2="726" y2="200" stroke="#475569" stroke-width="1.8" marker-end="url(#arrL)"/>
  <rect x="730" y="80" width="190" height="190" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="825" y="106" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle">COMPLIANCE ENGINE</text>
  <text x="825" y="126" font-size="10.5" fill="#7f1d1d" text-anchor="middle">monitor processes</text>
  <text x="825" y="150" font-size="10" fill="#7f1d1d" text-anchor="middle">trigger → evaluate (OCL) →</text>
  <text x="825" y="164" font-size="10" fill="#7f1d1d" text-anchor="middle">verdict → evidence → escalate</text>
  <text x="825" y="192" font-size="9.5" fill="#991b1b" text-anchor="middle">the same statements as the lab —</text>
  <text x="825" y="206" font-size="9.5" fill="#991b1b" text-anchor="middle">INV-9, continuously re-executed</text>

  <!-- reference model -->
  <rect x="730" y="300" width="190" height="56" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
  <text x="825" y="323" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">reference model</text>
  <text x="825" y="340" font-size="10" fill="#475569" text-anchor="middle">the Recommendation package</text>
  <line x1="825" y1="300" x2="825" y2="276" stroke="#475569" stroke-width="1.6" marker-end="url(#arrL)"/>
  <text x="836" y="292" font-size="9.5" fill="#64748b">requirements, limits, promises</text>

  <!-- workspace -->
  <line x1="825" y1="270" x2="825" y2="396" stroke="#475569" stroke-width="1.8" marker-end="url(#arrL)"/>
  <rect x="640" y="400" width="280" height="120" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="780" y="426" font-size="12.5" font-weight="700" fill="#166534" text-anchor="middle">WORKSPACE (.pws/)</text>
  <text x="780" y="446" font-size="10.5" fill="#14532d" text-anchor="middle">time-stamped evidence streams</text>
  <text x="780" y="462" font-size="10.5" fill="#14532d" text-anchor="middle">verdict history per promise</text>
  <text x="780" y="478" font-size="10.5" fill="#14532d" text-anchor="middle">artifact instances, state trajectories</text>
  <text x="780" y="502" font-size="10" font-style="italic" fill="#166534" text-anchor="middle">facts are permanent; judgments re-runnable</text>

  <!-- auditor -->
  <rect x="400" y="400" width="180" height="70" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
  <text x="490" y="428" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">AUDITOR</text>
  <text x="490" y="448" font-size="10" fill="#475569" text-anchor="middle">queries the evidence chain</text>
  <text x="490" y="462" font-size="10" fill="#475569" text-anchor="middle">instead of chasing documents</text>
  <line x1="580" y1="440" x2="636" y2="440" stroke="#9333ea" stroke-width="1.8" marker-end="url(#arrV)"/>

  <!-- bottom note -->
  <rect x="50" y="556" width="870" height="48" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="70" y="578" font-size="11.5" font-weight="600" fill="#0f172a">One sentence: the product reports what it IS, HAS and DOES in the language the standard already speaks —</text>
  <text x="70" y="594" font-size="11.5" fill="#475569">and the standard judges it continuously, with the same OCL, the same verdict chain, and evidence that accumulates instead of expiring.</text>
</svg>
