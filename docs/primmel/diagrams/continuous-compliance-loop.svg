<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="arrC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="50" y="34" font-size="18" font-weight="700" fill="#0f172a">The monitor loop — continuous compliance</text>
  <text x="50" y="54" font-size="12.5" fill="#475569">Every pass through this loop is one continuous-evaluation cycle. The same OCL as the lab — re-executed forever.</text>

  <!-- trigger -->
  <rect x="60" y="110" width="180" height="110" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="1.8"/>
  <text x="150" y="136" font-size="12.5" font-weight="700" fill="#6b21a8" text-anchor="middle">1 · TRIGGER</text>
  <text x="150" y="158" font-size="10.5" fill="#7e22ce" text-anchor="middle">schedule (timer event)</text>
  <text x="150" y="176" font-size="10.5" fill="#7e22ce" text-anchor="middle">signal (artifact arrived)</text>
  <text x="150" y="194" font-size="10.5" fill="#7e22ce" text-anchor="middle">change (value moved)</text>

  <!-- fetch -->
  <rect x="300" y="110" width="180" height="110" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
  <text x="390" y="136" font-size="12.5" font-weight="700" fill="#3730a3" text-anchor="middle">2 · FETCH</text>
  <text x="390" y="158" font-size="10.5" fill="#4f46e5" text-anchor="middle">query the endpoint</text>
  <text x="390" y="176" font-size="10.5" fill="#4f46e5" text-anchor="middle">(or the subscription pushed)</text>
  <text x="390" y="194" font-size="10.5" fill="#4f46e5" text-anchor="middle">values + timestamps</text>

  <!-- freshness -->
  <rect x="540" y="110" width="180" height="110" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <text x="630" y="136" font-size="12.5" font-weight="700" fill="#92400e" text-anchor="middle">3 · FRESHNESS</text>
  <text x="630" y="158" font-size="10.5" fill="#92600e" text-anchor="middle">within validity window?</text>
  <text x="630" y="182" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle">stale ⇒ indeterminate</text>
  <text x="630" y="198" font-size="10" fill="#92600e" text-anchor="middle">never a silent pass</text>

  <!-- evaluate -->
  <rect x="780" y="110" width="150" height="110" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="855" y="136" font-size="12.5" font-weight="700" fill="#991b1b" text-anchor="middle">4 · EVALUATE</text>
  <text x="855" y="158" font-size="10.5" fill="#7f1d1d" text-anchor="middle">OCL limits and</text>
  <text x="855" y="174" font-size="10.5" fill="#7f1d1d" text-anchor="middle">promise conditions</text>
  <text x="855" y="194" font-size="9.5" fill="#991b1b" text-anchor="middle">(INV-9: same statements)</text>

  <!-- verdict -->
  <rect x="780" y="290" width="150" height="110" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="855" y="316" font-size="12.5" font-weight="700" fill="#991b1b" text-anchor="middle">5 · VERDICT</text>
  <text x="855" y="338" font-size="10.5" fill="#7f1d1d" text-anchor="middle">pass · fail</text>
  <text x="855" y="356" font-size="10.5" fill="#7f1d1d" text-anchor="middle">indeterminate · invalid</text>
  <text x="855" y="376" font-size="9.5" fill="#991b1b" text-anchor="middle">per requirement × twin</text>

  <!-- evidence -->
  <rect x="540" y="290" width="180" height="110" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="630" y="316" font-size="12.5" font-weight="700" fill="#166534" text-anchor="middle">6 · EVIDENCE</text>
  <text x="630" y="338" font-size="10.5" fill="#14532d" text-anchor="middle">values seen + rule results</text>
  <text x="630" y="356" font-size="10.5" fill="#14532d" text-anchor="middle">+ verdict, time-stamped</text>
  <text x="630" y="376" font-size="10" fill="#166534" text-anchor="middle">appended to workspace</text>

  <!-- escalate/audit -->
  <rect x="300" y="290" width="180" height="110" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
  <text x="390" y="316" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">7 · ACT</text>
  <text x="390" y="338" font-size="10.5" fill="#475569" text-anchor="middle">pass: nothing (history accrues)</text>
  <text x="390" y="356" font-size="10.5" fill="#475569" text-anchor="middle">fail/invalid: escalate</text>
  <text x="390" y="374" font-size="10.5" fill="#475569" text-anchor="middle">audit: query any window</text>

  <!-- loop arrows -->
  <g stroke="#475569" stroke-width="1.8" fill="none">
    <line x1="240" y1="165" x2="296" y2="165" marker-end="url(#arrC)"/>
    <line x1="480" y1="165" x2="536" y2="165" marker-end="url(#arrC)"/>
    <line x1="720" y1="165" x2="776" y2="165" marker-end="url(#arrC)"/>
    <line x1="855" y1="220" x2="855" y2="286" marker-end="url(#arrC)"/>
    <line x1="780" y1="345" x2="724" y2="345" marker-end="url(#arrC)"/>
    <line x1="540" y1="345" x2="484" y2="345" marker-end="url(#arrC)"/>
    <path d="M 390 400 C 390 480, 150 480, 150 226" marker-end="url(#arrC)"/>
  </g>
  <text x="255" y="470" font-size="10.5" fill="#64748b">…and the loop repeats — the standard never sleeps</text>

  <!-- firewall note -->
  <rect x="60" y="520" width="870" height="56" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="80" y="543" font-size="11.5" font-weight="600" fill="#0f172a">The firewalls hold in the loop: evidence records facts (what was seen), verdicts are judgments (what the rules say about it) —</text>
  <text x="80" y="561" font-size="11.5" fill="#475569">a later engine can re-judge the same evidence against new limits (INV-5) without the twin ever being queried again.</text>
</svg>
