<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9333ea"/>
    </marker>
    <marker id="arrt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="50" y="34" font-size="18" font-weight="700" fill="#0f172a">Mapping and the coverage calculus</text>
  <text x="50" y="54" font-size="12.5" fill="#475569">A ⇒ B: fulfilling the implementation fulfils the reference. Coverage propagates up; mappings inherit down.</text>

  <!-- implementation model -->
  <rect x="50" y="86" width="250" height="330" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="175" y="112" font-size="13" font-weight="700" fill="#3730a3" text-anchor="middle">implementation model</text>
  <text x="175" y="128" font-size="10.5" fill="#4f46e5" text-anchor="middle">Organization O — how we actually operate</text>

  <rect x="75" y="150" width="200" height="46" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="175" y="170" font-size="11.5" fill="#3730a3" text-anchor="middle">Op A — batch log</text>
  <text x="175" y="186" font-size="9.5" fill="#64748b" text-anchor="middle">writes record automatically</text>

  <rect x="75" y="220" width="200" height="46" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="175" y="240" font-size="11.5" fill="#3730a3" text-anchor="middle">Op B — competency file</text>
  <text x="175" y="256" font-size="9.5" fill="#64748b" text-anchor="middle">per-employee registry</text>

  <rect x="75" y="290" width="200" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="175" y="310" font-size="11.5" fill="#64748b" text-anchor="middle">Op C — maintenance</text>
  <text x="175" y="326" font-size="9.5" fill="#94a3b8" text-anchor="middle">not mapped to anything</text>

  <!-- reference model -->
  <rect x="560" y="86" width="290" height="330" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
  <text x="705" y="112" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">reference model</text>
  <text x="705" y="128" font-size="10.5" fill="#64748b" text-anchor="middle">Standard S — the published requirements</text>

  <rect x="585" y="146" width="240" height="42" rx="8" fill="#fffbeb" stroke="#eab308" stroke-width="1.6"/>
  <text x="705" y="165" font-size="11.5" fill="#92400e" text-anchor="middle">Process 1 — competence</text>
  <text x="705" y="181" font-size="9.5" fill="#eab308" text-anchor="middle">PARTIAL cover</text>

  <rect x="600" y="206" width="150" height="38" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="675" y="222" font-size="10.5" fill="#166534" text-anchor="middle">Process 5</text>
  <text x="675" y="236" font-size="9" fill="#16a34a" text-anchor="middle">FULL cover</text>

  <rect x="762" y="206" width="76" height="38" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="800" y="222" font-size="10.5" fill="#64748b" text-anchor="middle">Process 6</text>
  <text x="800" y="236" font-size="9" fill="#94a3b8" text-anchor="middle">no cover</text>

  <rect x="585" y="272" width="240" height="42" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text x="705" y="291" font-size="11.5" fill="#92400e" text-anchor="middle">Process 2 — equipment (gateway: 5 or 6)</text>
  <text x="705" y="307" font-size="9.5" fill="#d97706" text-anchor="middle">MINIMAL cover</text>

  <rect x="600" y="332" width="150" height="38" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="675" y="348" font-size="10.5" fill="#166534" text-anchor="middle">Process 3</text>
  <text x="675" y="362" font-size="9" fill="#16a34a" text-anchor="middle">FULL cover</text>

  <rect x="762" y="332" width="76" height="38" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="800" y="348" font-size="10.5" fill="#64748b" text-anchor="middle">Process 4</text>
  <text x="800" y="362" font-size="9" fill="#94a3b8" text-anchor="middle">no cover</text>

  <!-- tree edges -->
  <g stroke="#94a3b8" stroke-width="1.3" fill="none">
    <line x1="660" y1="188" x2="665" y2="204" marker-end="url(#arrt)"/>
    <line x1="760" y1="188" x2="795" y2="204" marker-end="url(#arrt)"/>
    <line x1="660" y1="314" x2="665" y2="330" marker-end="url(#arrt)"/>
    <line x1="760" y1="314" x2="795" y2="330" marker-end="url(#arrt)"/>
  </g>

  <!-- mappings -->
  <g stroke="#9333ea" stroke-width="2" fill="none" stroke-dasharray="7 4">
    <path d="M 275 173 C 420 173, 480 210, 596 222" marker-end="url(#arrm)"/>
    <path d="M 275 243 C 420 243, 460 340, 596 348" marker-end="url(#arrm)"/>
  </g>
  <text x="420" y="162" font-size="11" fill="#9333ea">Op A ⇒ Process 5</text>
  <text x="420" y="255" font-size="11" fill="#9333ea">Op B ⇒ Process 3</text>

  <!-- legend -->
  <rect x="50" y="446" width="800" height="72" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <circle cx="74" cy="470" r="6" fill="#16a34a"/><text x="88" y="474" font-size="11" fill="#334155">full cover — all requirements fulfilled</text>
  <circle cx="330" cy="470" r="6" fill="#d97706"/><text x="344" y="474" font-size="11" fill="#334155">minimal cover — gateway minimum met</text>
  <circle cx="580" cy="470" r="6" fill="#eab308"/><text x="594" y="474" font-size="11" fill="#334155">partial — some, not enough</text>
  <circle cx="74" cy="498" r="6" fill="#94a3b8"/><text x="88" y="502" font-size="11" fill="#334155">no cover</text>
  <text x="330" y="502" font-size="11" fill="#7e22ce">mapping inherits down (mapped ⇒ subtree covered) · coverage propagates up · transitive at process level: A⇒B, B⇒C ⊢ A⇒C</text>
</svg>
