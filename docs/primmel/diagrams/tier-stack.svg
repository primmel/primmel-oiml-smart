<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="40" y="34" font-size="18" font-weight="700" fill="#0f172a">The Primmel tier system</text>
  <text x="40" y="54" font-size="12.5" fill="#475569">Every model lives on exactly one tier. Dependencies point only upward.</text>

  <!-- Foundations -->
  <rect x="40" y="70" width="560" height="76" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="60" y="96" font-size="14" font-weight="700" fill="#334155">Foundations</text>
  <text x="60" y="116" font-size="12" fill="#475569">vocabulary (VIM/VIML registers) · parties &amp; roles · units &amp; value types · time primitives</text>
  <text x="60" y="133" font-size="11" fill="#64748b">referenced by everything — anchored to nothing in the subject</text>

  <!-- Primary -->
  <rect x="40" y="160" width="560" height="76" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="60" y="186" font-size="14" font-weight="700" fill="#3730a3">Primary — the Subject</text>
  <text x="60" y="206" font-size="12" fill="#475569">the subject chain (Family → Group → Model → Sample) + aspect models (IS / HAS / DOES)</text>
  <text x="60" y="223" font-size="11" fill="#64748b">what the subject is, what it exhibits, what it does</text>

  <!-- Secondary -->
  <rect x="40" y="250" width="560" height="76" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="60" y="276" font-size="14" font-weight="700" fill="#92400e">Secondary — anchored models</text>
  <text x="60" y="296" font-size="12" fill="#475569">requirements (constraints) · conformance tests (operations) · forms (evidence views)</text>
  <text x="60" y="313" font-size="11" fill="#64748b">every element carries a typed anchor set into primary aspect paths — no subject facts owned here</text>

  <!-- Tertiary -->
  <rect x="40" y="340" width="560" height="76" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="60" y="366" font-size="14" font-weight="700" fill="#991b1b">Tertiary — execution &amp; judgment</text>
  <text x="60" y="386" font-size="12" fill="#475569">runs &amp; evidence · verdicts · evaluations · decisions · certificates · workflow processes</text>
  <text x="60" y="403" font-size="11" fill="#64748b">facts are permanent; judgments are re-runnable functions of definitions + evidence</text>

  <!-- upward dependency arrows -->
  <g stroke="#64748b" stroke-width="1.8" fill="none">
    <line x1="86" y1="340" x2="86" y2="330" marker-end="url(#arr)"/>
    <line x1="86" y1="250" x2="86" y2="240" marker-end="url(#arr)"/>
    <line x1="86" y1="160" x2="86" y2="150" marker-end="url(#arr)"/>
  </g>
  <text x="98" y="248" font-size="10.5" fill="#64748b" transform="rotate(-90 98 248)"></text>
  <text x="98" y="334" font-size="10.5" fill="#64748b">anchors</text>
  <text x="98" y="244" font-size="10.5" fill="#64748b">binds</text>
  <text x="98" y="154" font-size="10.5" fill="#64748b">uses</text>

  <!-- Cross-cutting -->
  <rect x="620" y="70" width="140" height="346" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="640" y="96" font-size="14" font-weight="700" fill="#6b21a8">Cross-cutting</text>
  <text x="640" y="122" font-size="11.5" fill="#7e22ce">provenance</text>
  <text x="640" y="142" font-size="11.5" fill="#7e22ce">time &amp; versioning</text>
  <text x="640" y="162" font-size="11.5" fill="#7e22ce">traceability spine</text>
  <text x="640" y="182" font-size="11.5" fill="#7e22ce">multilinguality</text>
  <text x="640" y="212" font-size="10.5" fill="#9333ea">applies to every</text>
  <text x="640" y="226" font-size="10.5" fill="#9333ea">element on</text>
  <text x="640" y="240" font-size="10.5" fill="#9333ea">every tier</text>

  <text x="40" y="452" font-size="11" fill="#64748b">Violation to watch for: a requirement that defines subject facts (breaks anchoring), or a report that contains a verdict (breaks the fact/judgment firewall).</text>
</svg>
