<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrow-indigo" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#4f46e5"/>
    </marker>
    <marker id="arrow-slate" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">Package composition — the shipped uses tree</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">R 60's seven-package chain in merge order, topologically composed and checked post-merge; the rec overlay references, never redefines.</text>

  <!-- the merge-order stack -->
  <!-- 1 iso-iec-17000 -->
  <rect x="60" y="84" width="440" height="52" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.4"/>
  <rect x="60" y="84" width="440" height="22" rx="10" fill="#475569"/>
  <text x="280" y="99" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1 · iso-iec-17000 — kind core</text>
  <text x="76" y="126" font-size="10.5" fill="#334155">CASCO vocabulary · the functional-approach activity-kind register</text>

  <line x1="280" y1="136" x2="280" y2="144" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow-slate)"/>

  <!-- 2 iso-iec-17065 -->
  <rect x="60" y="146" width="440" height="52" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.4"/>
  <rect x="60" y="146" width="440" height="22" rx="10" fill="#475569"/>
  <text x="280" y="161" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2 · iso-iec-17065 — kind core</text>
  <text x="76" y="188" font-size="10.5" fill="#334155">certification-body competence · clause-7 functional approach · role segregation</text>

  <line x1="280" y1="198" x2="280" y2="206" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow-slate)"/>

  <!-- 3 iso-iec-17025 -->
  <rect x="60" y="208" width="440" height="52" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.4"/>
  <rect x="60" y="208" width="440" height="22" rx="10" fill="#475569"/>
  <text x="280" y="223" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3 · iso-iec-17025 — kind core</text>
  <text x="76" y="250" font-size="10.5" fill="#334155">laboratory competence · the clause-7 test lifecycle</text>

  <line x1="280" y1="260" x2="280" y2="268" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow-slate)"/>

  <!-- 4 iso-iec-17067 -->
  <rect x="60" y="270" width="440" height="52" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.4"/>
  <rect x="60" y="270" width="440" height="22" rx="10" fill="#475569"/>
  <text x="280" y="285" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4 · iso-iec-17067 — kind core</text>
  <text x="76" y="312" font-size="10.5" fill="#334155">scheme types 1a–6 register · the scheme-content checklist</text>

  <line x1="280" y1="322" x2="280" y2="330" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow-slate)"/>

  <!-- 5 oiml-cs -->
  <rect x="60" y="332" width="440" height="52" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <rect x="60" y="332" width="440" height="22" rx="10" fill="#4f46e5"/>
  <text x="280" y="347" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">5 · oiml-cs — kind core</text>
  <text x="76" y="374" font-size="10.5" fill="#3730a3">the OIML-CS scheme: B 18 framework · PD-05 provisions · document modules</text>

  <line x1="280" y1="384" x2="280" y2="392" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow-slate)"/>

  <!-- 6 oiml-smart-core -->
  <rect x="60" y="394" width="440" height="52" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="1.6"/>
  <rect x="60" y="394" width="440" height="22" rx="10" fill="#9333ea"/>
  <text x="280" y="409" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">6 · oiml-smart-core — kind core</text>
  <text x="76" y="436" font-size="10.5" fill="#6b21a8">subject chain · parties · workflow entities · evaluation skeleton</text>

  <line x1="280" y1="446" x2="280" y2="454" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow-slate)"/>

  <!-- 7 module -->
  <rect x="60" y="456" width="440" height="52" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="1.6" stroke-dasharray="6 3"/>
  <rect x="60" y="456" width="440" height="22" rx="10" fill="#9333ea"/>
  <text x="280" y="471" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">7 · oiml-smart-module-specimen-governance — kind module</text>
  <text x="76" y="498" font-size="10.5" fill="#6b21a8">sample-selection rules · EUT continuity · test-execution entities — bound via with:</text>

  <line x1="280" y1="508" x2="280" y2="516" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow-indigo)"/>

  <!-- 8 rec overlay -->
  <rect x="60" y="518" width="440" height="60" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="60" y="518" width="440" height="24" rx="10" fill="#4f46e5"/>
  <text x="280" y="534" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">8 · oiml-r60 — kind rec · the overlay</text>
  <text x="76" y="560" font-size="10.5" fill="#3730a3">subject · requirements · conformance tests · forms · certificate</text>

  <!-- merge arrows into the composed model -->
  <g stroke="#94a3b8" stroke-width="1.6" fill="none">
    <line x1="500" y1="110" x2="540" y2="140" marker-end="url(#arrow-slate)"/>
    <line x1="500" y1="358" x2="540" y2="160" marker-end="url(#arrow-slate)"/>
    <line x1="500" y1="548" x2="540" y2="180" marker-end="url(#arrow-slate)"/>
  </g>

  <!-- the composed effective model -->
  <rect x="548" y="84" width="292" height="126" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
  <rect x="548" y="84" width="292" height="28" rx="12" fill="#4f46e5"/>
  <text x="694" y="102" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">The composed effective model</text>
  <g font-size="10.5" fill="#3730a3">
    <text x="564" y="132">topological merge of the uses graph</text>
    <text x="564" y="150">one id space across the composition</text>
    <text x="564" y="168">generators consume it unchanged</text>
    <text x="564" y="186">kernel checks run post-merge — the</text>
    <text x="564" y="202">package is checked as consumed</text>
  </g>

  <!-- REC-WINS overlay card -->
  <rect x="548" y="230" width="292" height="158" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="1.8"/>
  <rect x="548" y="230" width="292" height="28" rx="12" fill="#9333ea"/>
  <text x="694" y="248" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">The REC-WINS overlay</text>
  <g font-size="10.5" fill="#6b21a8">
    <text x="564" y="278">the rec ships composed copies of the</text>
    <text x="564" y="296">layer files it overlays; layers.prl</text>
    <text x="564" y="314">includes the rest verbatim</text>
    <text x="564" y="340">the YAML overlay is a GENERATED</text>
    <text x="564" y="358">minimal delta — the fixpoint</text>
    <text x="564" y="376">merge(layers, delta) ≡ package</text>
  </g>

  <!-- the composition gates -->
  <rect x="548" y="408" width="292" height="170" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="1.8"/>
  <rect x="548" y="408" width="292" height="28" rx="12" fill="#475569"/>
  <text x="694" y="426" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">The composition gates</text>
  <g font-size="10.5" fill="#334155">
    <text x="564" y="456">uses-no-redefine — identity scalars,</text>
    <text x="564" y="474">unioned multilingual arrays</text>
    <text x="564" y="492">layer-owned /req/cs/** namespaces</text>
    <text x="564" y="510">requires ⊆ provides — and every</text>
    <text x="564" y="528">provide consumed or explicitly waived</text>
    <text x="564" y="546">scheme_type resolves against a</text>
    <text x="564" y="564">register composed earlier</text>
  </g>

  <!-- bottom rule bar -->
  <rect x="60" y="616" width="780" height="58" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1"/>
  <text x="80" y="640" font-size="11.5" font-weight="600" fill="#0f172a">The composition law — reference, never redefine:</text>
  <text x="80" y="658" font-size="11" fill="#475569">an id defined upstream is used downstream; restating it is an explicit, cited error. Merge order: foundation → scheme → core → modules → rec.</text>
</svg>
