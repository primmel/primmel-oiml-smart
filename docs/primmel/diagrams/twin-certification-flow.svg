<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <text x="48" y="36" font-size="18" font-weight="700" fill="#0f172a">The twin-fidelity certification flow</text>
  <text x="48" y="56" font-size="12.5" fill="#475569">Probes close the two-channel relation; the verdict chain aggregates facts into the decision; validity rides surveillance.</text>

  <!-- ── row 1: determination (D1/D2) ─────────────────────────────── -->
  <text x="48" y="92" font-size="11" font-weight="700" fill="#64748b">DETERMINATION — admission + the probe schedule (TW-1, clause 6)</text>

  <rect x="48" y="104" width="200" height="112" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
  <text x="148" y="128" font-size="10.5" font-weight="700" fill="#3730a3" text-anchor="middle">STATIC-CONFORMANCE</text>
  <text x="148" y="143" font-size="10.5" font-weight="700" fill="#3730a3" text-anchor="middle">ADMISSION (6.1)</text>
  <text x="148" y="163" font-size="9.5" fill="#4f46e5" text-anchor="middle">served interface ≡ the pinned</text>
  <text x="148" y="176" font-size="9.5" fill="#4f46e5" text-anchor="middle">product package's endpoint</text>
  <text x="148" y="189" font-size="9.5" fill="#4f46e5" text-anchor="middle">declaration — else no probing</text>

  <line x1="248" y1="160" x2="286" y2="160" stroke="#475569" stroke-width="1.6" marker-end="url(#arrF)"/>
  <text x="267" y="150" font-size="9" fill="#64748b" text-anchor="middle">gates</text>

  <rect x="290" y="104" width="430" height="112" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="505" y="124" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">PROBE SCHEDULE — paired reference ↔ served readings, timestamped</text>
  <rect x="304" y="136" width="126" height="34" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="367" y="150" font-size="9.5" font-weight="600" fill="#334155" text-anchor="middle">range (6.2)</text>
  <text x="367" y="162" font-size="8.5" fill="#64748b" text-anchor="middle">load points of E_max</text>
  <rect x="442" y="136" width="126" height="34" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="505" y="150" font-size="9.5" font-weight="600" fill="#334155" text-anchor="middle">envelope (6.3)</text>
  <text x="505" y="162" font-size="8.5" fill="#64748b" text-anchor="middle">declared corners</text>
  <rect x="580" y="136" width="126" height="34" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="643" y="150" font-size="9.5" font-weight="600" fill="#334155" text-anchor="middle">transitions (6.4)</text>
  <text x="643" y="162" font-size="8.5" fill="#64748b" text-anchor="middle">incl. fault leg</text>
  <text x="505" y="188" font-size="9" fill="#64748b" text-anchor="middle">skew ≤ pairing window (≤ fresh_within per register) — INVALID, never a fail</text>
  <text x="505" y="203" font-size="9" fill="#64748b" text-anchor="middle">reference: instrument · attestation (limitation declared) · sim ground truth</text>

  <line x1="720" y1="160" x2="756" y2="160" stroke="#475569" stroke-width="1.6" marker-end="url(#arrF)"/>

  <rect x="760" y="104" width="160" height="112" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="840" y="128" font-size="10.5" font-weight="700" fill="#92400e" text-anchor="middle">D2 PROBE RECORDS</text>
  <text x="840" y="148" font-size="9.5" fill="#92400e" text-anchor="middle">facts only — values,</text>
  <text x="840" y="161" font-size="9.5" fill="#92400e" text-anchor="middle">timestamps, channel,</text>
  <text x="840" y="174" font-size="9.5" fill="#92400e" text-anchor="middle">limitation, skew;</text>
  <text x="840" y="192" font-size="9.5" fill="#92400e" text-anchor="middle">never the judgment</text>

  <!-- ── row 2: the verdict chain (D3) ────────────────────────────── -->
  <text x="380" y="248" font-size="11" font-weight="700" fill="#64748b">EVALUATION — the verdict chain (D3), one engine, no second dialect</text>

  <path d="M 840 216 L 840 232 L 140 232 L 140 256" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrF)"/>
  <text x="492" y="226" font-size="9" fill="#64748b" text-anchor="middle">evidence (with the engine snapshot — the re-judgment basis)</text>

  <rect x="48" y="260" width="184" height="96" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="140" y="284" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">PER-PROBE VERDICTS</text>
  <text x="140" y="303" font-size="9.5" fill="#475569" text-anchor="middle">pass · fail ·</text>
  <text x="140" y="316" font-size="9.5" fill="#475569" text-anchor="middle">indeterminate (stale) ·</text>
  <text x="140" y="329" font-size="9.5" fill="#475569" text-anchor="middle">invalid (pairing)</text>

  <line x1="232" y1="308" x2="256" y2="308" stroke="#475569" stroke-width="1.6" marker-end="url(#arrF)"/>

  <rect x="260" y="260" width="196" height="96" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="358" y="284" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">PER-REGISTER</text>
  <text x="358" y="298" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">SYNTHESIS</text>
  <text x="358" y="317" font-size="9.5" fill="#475569" text-anchor="middle">any fail ⇒ fail; indeterminate</text>
  <text x="358" y="330" font-size="9.5" fill="#475569" text-anchor="middle">⇒ indeterminate — silence is</text>
  <text x="358" y="343" font-size="9.5" fill="#475569" text-anchor="middle">not evidence</text>

  <line x1="456" y1="308" x2="480" y2="308" stroke="#475569" stroke-width="1.6" marker-end="url(#arrF)"/>

  <rect x="484" y="260" width="216" height="96" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="592" y="284" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">CERTIFICATION DECISION</text>
  <text x="592" y="303" font-size="9.5" fill="#475569" text-anchor="middle">all registers pass + admission</text>
  <text x="592" y="316" font-size="9.5" fill="#475569" text-anchor="middle">+ timestamp provenance + valid</text>
  <text x="592" y="329" font-size="9.5" fill="#475569" text-anchor="middle">type certificate ⇒ certify</text>
  <text x="592" y="345" font-size="9" fill="#64748b" text-anchor="middle">unprovable ⇒ inconclusive</text>

  <line x1="700" y1="308" x2="724" y2="308" stroke="#475569" stroke-width="1.6" marker-end="url(#arrF)"/>

  <rect x="728" y="260" width="192" height="96" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="824" y="284" font-size="10.5" font-weight="700" fill="#166534" text-anchor="middle">TWIN CERTIFICATE</text>
  <text x="824" y="303" font-size="9.5" fill="#166534" text-anchor="middle">scoped, conditional claim —</text>
  <text x="824" y="316" font-size="9.5" fill="#166534" text-anchor="middle">per UNIT: endpoint, registers,</text>
  <text x="824" y="329" font-size="9.5" fill="#166534" text-anchor="middle">δ + freshness, schedule, date;</text>
  <text x="824" y="345" font-size="9" fill="#166534" text-anchor="middle">register of certified twins</text>

  <!-- ── row 3: surveillance + the certificate-machine walk ───────── -->
  <text x="48" y="392" font-size="11" font-weight="700" fill="#64748b">SURVEILLANCE — the type-5 continuous half (non-dischargeable)</text>

  <path d="M 824 356 L 824 432 L 252 432" fill="none" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrG)"/>
  <text x="540" y="424" font-size="9" fill="#166534" text-anchor="middle">validity is CONDITIONAL on continuous surveillance — a sustained fail suspends; an unresolved fail withdraws</text>

  <rect x="48" y="404" width="200" height="58" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="148" y="428" font-size="10.5" font-weight="700" fill="#3730a3" text-anchor="middle">FLEET MONITOR (TCD-4)</text>
  <text x="148" y="444" font-size="9" fill="#4f46e5" text-anchor="middle">the same fidelity requirements,</text>
  <text x="148" y="456" font-size="9" fill="#4f46e5" text-anchor="middle">re-judged continuously</text>

  <!-- the machine walk -->
  <rect x="292" y="460" width="120" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="352" y="484" font-size="10" font-weight="700" fill="#166534" text-anchor="middle">ACTIVE</text>

  <line x1="412" y1="480" x2="448" y2="480" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrR)"/>
  <text x="430" y="452" font-size="8.5" fill="#dc2626" text-anchor="middle">fail ⇒ flag</text>

  <rect x="452" y="460" width="172" height="40" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="538" y="484" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">UNDER_INVESTIGATION</text>

  <line x1="624" y1="480" x2="660" y2="480" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrR)"/>
  <text x="642" y="452" font-size="8.5" fill="#dc2626" text-anchor="middle">cure window</text>

  <rect x="664" y="460" width="116" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="722" y="484" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">SUSPENDED</text>

  <line x1="780" y1="480" x2="812" y2="480" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrR)"/>
  <rect x="816" y="460" width="112" height="40" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="872" y="484" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">WITHDRAWN</text>

  <!-- reinstatement arc -->
  <path d="M 722 500 L 722 540 L 352 540 L 352 504" fill="none" stroke="#16a34a" stroke-width="1.4" marker-end="url(#arrG)"/>
  <text x="537" y="532" font-size="9" fill="#166534" text-anchor="middle">reinstate — a re-probe pass, or a re-judged window under the same δ on stored snapshots (the twin never re-queried)</text>
  <text x="872" y="516" font-size="8.5" fill="#64748b" text-anchor="middle">unresolved</text>

  <!-- declared policy + the fault line -->
  <rect x="48" y="566" width="864" height="80" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="64" y="588" font-size="9.5" fill="#475569">Declared policy (validity.yaml — scheme declarations, never code constants): validity window 12 months · cure window 30 days ·</text>
  <text x="64" y="602" font-size="9.5" fill="#475569">3 consecutive failed cycles suspends · unresolved 90 days withdraws · reinstatement needs a rectifying judgment.</text>
  <text x="64" y="622" font-size="9.5" font-weight="600" fill="#991b1b">The fault line: a served fault state faithfully reporting the instrument's fault opens a service case WITHOUT flagging the certificate — fault ≠ infidelity.</text>
  <text x="64" y="637" font-size="9.5" fill="#475569">A twin lying about a healthy instrument fails fidelity and flags the certificate; the wiring reads the escalation action, never the verdict alone.</text>
</svg>
