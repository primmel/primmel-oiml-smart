    <text x="450" y="140" font-size="9" fill="#6d64c9" text-anchor="middle">consumes M1–M4, M7 · M5/M6 planned</text>

    <rect x="630" y="84" width="210" height="64" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
    <text x="735" y="108" font-size="13" font-weight="700" fill="#3730a3" text-anchor="middle">oiml-r144 — R 144</text>
    <text x="735" y="126" font-size="10" fill="#4f46e5" text-anchor="middle">gas analyzers · rec overlay</text>
    <text x="735" y="140" font-size="9" fill="#6d64c9" text-anchor="middle">consumes M1–M7</text>
  </g>

