  <text x="651" y="406" font-size="8.5" fill="#7e22ce">requires: core</text>
  <text x="651" y="422" font-size="9" fill="#581c87">R 60 ●  R 144 ●  R 91 ○</text>

  <!-- M7 examination-docs -->
  <rect x="769" y="300" width="118" height="132" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="1.6"/>
  <rect x="769" y="300" width="118" height="34" rx="10" fill="#9333ea"/>
  <text x="828" y="314" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">M7</text>
  <text x="828" y="327" font-size="9" font-weight="600" fill="#f3e8ff" text-anchor="middle">examination-docs</text>
  <g font-size="9" fill="#6b21a8">
    <text x="777" y="346">documentation /</text>
    <text x="777" y="357">marking examination</text>
    <text x="777" y="368">checklists; verdict =</text>
    <text x="777" y="379">conjunction of items</text>
