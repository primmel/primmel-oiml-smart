  <rect x="0" y="0" width="900" height="676" fill="#ffffff"/>

  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">Core · shared modules · Recommendation packages</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">Seven parameterized families. Modules freeze skeletons; rec packages bind attribute ids, severities, acceptance expressions, clause URNs.</text>

  <!-- layer captions -->
  <g font-size="9.5" fill="#94a3b8" text-anchor="end">
    <text x="888" y="80">layer 3 · rec packages</text>
    <text x="888" y="290">layer 2b · shared modules</text>
    <text x="888" y="532">layer 2 · core</text>
  </g>

  <!-- ============ rec packages (top) ============ -->
  <g>
