  <text x="450" y="560" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">oiml-smart-core — the OIML core package</text>
  <text x="450" y="578" font-size="10" fill="#475569" text-anchor="middle">subject chain · parties · workflow entities · evaluation skeletons · obligation · value types</text>
  <text x="450" y="592" font-size="9" fill="#64748b" text-anchor="middle">(Volume II, chapters 1–8)</text>

  <!-- ============ legend ============ -->
