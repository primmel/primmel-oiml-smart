  <g font-size="9" fill="#6b21a8">
    <text x="21" y="346">EMC immunity: ESD,</text>
    <text x="21" y="357">bursts, surge, RF,</text>
    <text x="21" y="368">power variants</text>
    <text x="21" y="379">D 11 → IEC 61000-4-x</text>
  </g>
  <text x="21" y="394" font-size="8.5" fill="#7e22ce">provides: test+form skel.</text>
  <text x="21" y="406" font-size="8.5" fill="#7e22ce">requires: core</text>
  <text x="21" y="422" font-size="9" fill="#581c87">R 60 ●  R 91 ◐  R 144 ●</text>

