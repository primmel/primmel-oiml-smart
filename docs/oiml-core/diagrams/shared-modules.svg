    <text x="165" y="108" font-size="13" font-weight="700" fill="#3730a3" text-anchor="middle">oiml-r60 — R 60</text>
    <text x="165" y="126" font-size="10" fill="#4f46e5" text-anchor="middle">load cells · rec overlay</text>
    <text x="165" y="140" font-size="9" fill="#6d64c9" text-anchor="middle">consumes M1–M7</text>

