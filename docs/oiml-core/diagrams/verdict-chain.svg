<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">The verdict chain — from requirement to certificate</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">Every arrow is a reference. Only one arrow crosses the fact/judgment firewall — and it carries facts, never judgments back.</text>

  <!-- D1 band -->
  <rect x="60" y="76" width="780" height="116" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="80" y="98" font-size="11" font-weight="700" fill="#475569">D1 · SPECIFICATION — definitions (secondary tier)</text>

  <rect x="120" y="108" width="180" height="64" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
  <text x="210" y="130" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Requirement</text>
  <text x="210" y="146" font-size="9.5" fill="#475569" text-anchor="middle">statement · bindsTo aspect paths</text>
  <text x="210" y="159" font-size="9.5" fill="#475569" text-anchor="middle">OCL limit + uses</text>

  <line x1="300" y1="140" x2="472" y2="140" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="386" y="132" font-size="9.5" fill="#475569" text-anchor="middle">verifiedBy / verifies</text>

  <rect x="480" y="108" width="200" height="64" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
  <text x="580" y="130" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">ConformanceTest</text>
  <text x="580" y="146" font-size="9.5" fill="#475569" text-anchor="middle">verifies · observables · method</text>
  <text x="580" y="159" font-size="9.5" fill="#475569" text-anchor="middle">preconditions → invalid, never fail</text>

  <!-- D2 band -->
  <rect x="60" y="216" width="780" height="140" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <text x="80" y="238" font-size="11" font-weight="700" fill="#b45309">D2 · TEST EXECUTION — FACTS ONLY (tertiary)</text>

  <line x1="580" y1="172" x2="580" y2="248" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="592" y="206" font-size="9.5" fill="#475569">executes · methodVersion pin (INV-8)</text>

  <rect x="480" y="252" width="260" height="88" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="492" y="272" font-size="11.5" font-weight="700" fill="#92400e">TestRun</text>
  <text x="492" y="286" font-size="9.5" fill="#92600e">one conformance test × one sample</text>
  <rect x="492" y="294" width="236" height="36" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="500" y="309" font-size="9.5" font-weight="700" fill="#92400e">EvidenceRecord</text>
  <text x="500" y="321" font-size="8.5" fill="#92600e">fills output slots · repetition · conditions log</text>

  <line x1="480" y1="296" x2="328" y2="296" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="404" y="288" font-size="9.5" fill="#475569" text-anchor="middle">aggregates case results</text>

  <rect x="120" y="252" width="200" height="88" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="220" y="274" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">TestReport</text>
  <text x="220" y="290" font-size="9.5" fill="#92600e" text-anchor="middle">sample identity · case results</text>
  <text x="220" y="304" font-size="9.5" fill="#92600e" text-anchor="middle">definitionVersions (INV-8)</text>
  <text x="220" y="322" font-size="9.5" font-style="italic" fill="#dc2626" text-anchor="middle">no verdicts — INV-4</text>

  <!-- the firewall -->
  <line x1="40" y1="386" x2="860" y2="386" stroke="#dc2626" stroke-width="2" stroke-dasharray="10 6"/>
  <rect x="360" y="375" width="270" height="22" rx="5" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
  <text x="495" y="390" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">FACT / JUDGMENT FIREWALL — INV-4</text>

  <line x1="220" y1="340" x2="142" y2="444" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrRed)"/>
  <text x="206" y="378" font-size="9.5" fill="#dc2626">consumes facts only (INV-5)</text>

  <!-- D3 band -->
  <rect x="60" y="412" width="780" height="170" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="1.8"/>
  <text x="80" y="434" font-size="11" font-weight="700" fill="#7e22ce">D3 · EVALUATION — JUDGMENTS (tertiary): re-runnable functions of definitions + facts</text>

  <rect x="66" y="448" width="130" height="84" rx="10" fill="#ffffff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="131" y="468" font-size="10.5" font-weight="700" fill="#6b21a8" text-anchor="middle">SampleEvaluation</text>
  <text x="131" y="484" font-size="8.5" fill="#7e22ce" text-anchor="middle">1 report = 1 sample (INV-6)</text>
  <text x="131" y="497" font-size="8.5" fill="#7e22ce" text-anchor="middle">evidence re-validation</text>

  <line x1="196" y1="490" x2="216" y2="490" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="220" y="448" width="130" height="84" rx="10" fill="#ffffff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="285" y="468" font-size="10.5" font-weight="700" fill="#6b21a8" text-anchor="middle">Verdict</text>
  <text x="285" y="484" font-size="8.5" fill="#7e22ce" text-anchor="middle">per requirement × sample</text>
  <text x="285" y="497" font-size="8.5" fill="#7e22ce" text-anchor="middle">pass · fail ·</text>
  <text x="285" y="510" font-size="8.5" fill="#7e22ce" text-anchor="middle">indeterminate · invalid</text>

  <line x1="350" y1="490" x2="370" y2="490" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="374" y="448" width="130" height="84" rx="10" fill="#ffffff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="439" y="468" font-size="10.5" font-weight="700" fill="#6b21a8" text-anchor="middle">TypeEvaluation</text>
  <text x="439" y="484" font-size="8.5" fill="#7e22ce" text-anchor="middle">requirement × sample matrix</text>
  <text x="439" y="497" font-size="8.5" fill="#7e22ce" text-anchor="middle">ALL samples × ALL reqs</text>

  <line x1="504" y1="490" x2="524" y2="490" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="528" y="448" width="130" height="84" rx="10" fill="#ffffff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="593" y="468" font-size="10.5" font-weight="700" fill="#6b21a8" text-anchor="middle">EvaluationReport</text>
  <text x="593" y="484" font-size="8.5" fill="#7e22ce" text-anchor="middle">verdict aggregate</text>
  <text x="593" y="497" font-size="8.5" fill="#7e22ce" text-anchor="middle">issued to manufacturer</text>

  <line x1="658" y1="490" x2="678" y2="490" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="682" y="448" width="130" height="84" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="747" y="468" font-size="10.5" font-weight="700" fill="#3730a3" text-anchor="middle">Certificate</text>
  <text x="747" y="484" font-size="8.5" fill="#4f46e5" text-anchor="middle">type approval decision</text>
  <text x="747" y="497" font-size="8.5" fill="#4f46e5" text-anchor="middle">promises-as-verified</text>

  <text x="450" y="556" font-size="10" fill="#7e22ce" text-anchor="middle">re-executes limits → aggregates across specimens → issues the aggregate → the approval decision issues the certificate</text>

  <!-- bottom bar -->
  <rect x="60" y="598" width="780" height="56" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="80" y="620" font-size="11.5" font-weight="600" fill="#0f172a">Facts are permanent; judgments are re-runnable functions over definitions and facts (INV-4, INV-5).</text>
  <text x="80" y="638" font-size="11" fill="#475569">Re-evaluation — new limits, corrected derivations, surveillance — recomputes the right-hand side without touching the left.</text>
</svg>
