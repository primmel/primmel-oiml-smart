<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">The three-level synthesis of evaluation</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">Each level answers one question, consumes only the level below plus definitions — and is re-runnable (INV-5).</text>

  <!-- Level 1 -->
  <rect x="60" y="76" width="780" height="108" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <circle cx="100" cy="130" r="18" fill="#d97706"/>
  <text x="100" y="135" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="130" y="104" font-size="13.5" font-weight="700" fill="#92400e">Admissibility — per TestReport</text>
  <text x="130" y="122" font-size="10.5" fill="#78350f">TestReportDetermination — one per report in test_report_ids[]; all recorded before finalization.</text>
  <text x="130" y="140" font-size="9.5" fill="#92600e">in: TestReports (facts, D2) — the report-level gate</text>
  <g font-size="9" font-weight="600">
    <rect x="130" y="150" width="86" height="20" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="173" y="164" fill="#15803d" text-anchor="middle">ACCEPTED</text>
    <rect x="226" y="150" width="80" height="20" rx="6" fill="#fef2f2" stroke="#dc2626"/>
    <text x="266" y="164" fill="#b91c1c" text-anchor="middle">REJECTED</text>
    <rect x="316" y="150" width="190" height="20" rx="6" fill="#fffbeb" stroke="#d97706"/>
    <text x="411" y="164" fill="#b45309" text-anchor="middle">CONDITIONALLY_ACCEPTED</text>
  </g>
  <text x="822" y="104" font-size="10" font-style="italic" fill="#64748b" text-anchor="end">is the evidence usable?</text>

  <line x1="450" y1="184" x2="450" y2="196" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr2)"/>

  <!-- Level 2 -->
  <rect x="60" y="200" width="780" height="108" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="1.8"/>
  <circle cx="100" cy="254" r="18" fill="#9333ea"/>
  <text x="100" y="259" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="130" y="228" font-size="13.5" font-weight="700" fill="#6b21a8">Per-requirement verdict re-execution</text>
  <text x="130" y="246" font-size="10.5" fill="#7e22ce">Each applicable requirement’s OCL limit re-evaluated against the bound facts → one Verdict per requirement × sample.</text>
  <text x="130" y="264" font-size="9.5" fill="#9333ea">in: requirement limits (D1) + bound facts (D2) — overrides recorded, never silent</text>
  <g font-size="9" font-weight="600">
    <rect x="130" y="274" width="56" height="20" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="158" y="288" fill="#15803d" text-anchor="middle">pass</text>
    <rect x="196" y="274" width="52" height="20" rx="6" fill="#fef2f2" stroke="#dc2626"/>
    <text x="222" y="288" fill="#b91c1c" text-anchor="middle">fail</text>
    <rect x="258" y="274" width="104" height="20" rx="6" fill="#f8fafc" stroke="#64748b"/>
    <text x="310" y="288" fill="#475569" text-anchor="middle">indeterminate</text>
    <rect x="372" y="274" width="118" height="20" rx="6" fill="#fff7ed" stroke="#ea580c"/>
    <text x="431" y="288" fill="#c2410c" text-anchor="middle">invalid (voided run)</text>
  </g>
  <text x="822" y="228" font-size="10" font-style="italic" fill="#64748b" text-anchor="end">does the sample satisfy each requirement?</text>

  <line x1="450" y1="308" x2="450" y2="320" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr2)"/>

  <!-- Level 2b -->
  <rect x="60" y="324" width="780" height="108" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="1.8"/>
  <circle cx="100" cy="378" r="18" fill="#9333ea"/>
  <text x="100" y="383" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">2b</text>
  <text x="130" y="352" font-size="13.5" font-weight="700" fill="#6b21a8">Cross-sample model evaluation</text>
  <text x="130" y="370" font-size="10.5" fill="#7e22ce">Accepted reports gathered across all contributing labs; completeness (required vs covered forms) + failures → ModelEvaluation.</text>
  <text x="130" y="388" font-size="9.5" fill="#9333ea">in: accepted reports, all labs — type conformity only across specimens (INV-6)</text>
  <g font-size="9" font-weight="600">
    <rect x="130" y="398" width="56" height="20" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="158" y="412" fill="#15803d" text-anchor="middle">PASS</text>
    <rect x="196" y="398" width="52" height="20" rx="6" fill="#fef2f2" stroke="#dc2626"/>
    <text x="222" y="412" fill="#b91c1c" text-anchor="middle">FAIL</text>
    <rect x="258" y="398" width="106" height="20" rx="6" fill="#fffbeb" stroke="#d97706"/>
    <text x="311" y="412" fill="#b45309" text-anchor="middle">CONDITIONAL</text>
    <rect x="374" y="398" width="100" height="20" rx="6" fill="#f8fafc" stroke="#64748b"/>
    <text x="424" y="412" fill="#475569" text-anchor="middle">INCOMPLETE</text>
  </g>
  <text x="822" y="352" font-size="10" font-style="italic" fill="#64748b" text-anchor="end">does the type conform across specimens?</text>

  <line x1="450" y1="432" x2="450" y2="444" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr2)"/>

  <!-- Level 3 -->
  <rect x="60" y="448" width="780" height="108" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
  <circle cx="100" cy="502" r="18" fill="#4f46e5"/>
  <text x="100" y="507" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="130" y="476" font-size="13.5" font-weight="700" fill="#3730a3">Overall decision</text>
  <text x="130" y="494" font-size="10.5" fill="#4338ca">all PASS → APPROVED · any FAIL → REJECTED · mixed → CONDITIONALLY_APPROVED · any INCOMPLETE → PENDING</text>
  <text x="130" y="512" font-size="9.5" fill="#4f46e5">in: model evaluations — the family-level aggregate over test_report_determinations</text>
  <text x="130" y="532" font-size="9.5" fill="#4f46e5">review + sign-off per PD-05 §4.5 (reviewer, supervisor, finalized_at/by)</text>
  <text x="822" y="476" font-size="10" font-style="italic" fill="#64748b" text-anchor="end">does the application succeed?</text>

  <line x1="450" y1="556" x2="450" y2="576" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr2)"/>
  <text x="464" y="570" font-size="9.5" fill="#475569">on APPROVED: the TypeApprovalDecision issues →</text>

  <!-- Certificate -->
  <rect x="300" y="580" width="300" height="56" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="450" y="602" font-size="13" font-weight="700" fill="#3730a3" text-anchor="middle">Certificate</text>
  <text x="450" y="620" font-size="10" fill="#4f46e5" text-anchor="middle">promises-as-verified · BIML registration</text>

  <text x="450" y="660" font-size="10.5" fill="#475569" text-anchor="middle">Determination → verdicts → model evaluation → decision: no level answers another level’s question.</text>
</svg>
