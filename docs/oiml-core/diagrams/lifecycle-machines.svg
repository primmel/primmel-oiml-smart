<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9333ea"/>
    </marker>
  </defs>

  <text x="60" y="34" font-size="18" font-weight="700" fill="#0f172a">The seven workflow lifecycle machines — declared data, machine-routed</text>
  <text x="60" y="54" font-size="12.5" fill="#475569">Every status mutation routes through the walker: walkTransition validates the edge, enforces the guard, applies the status, runs the cascades.</text>

  <!-- Row 1 -->
  <rect x="60" y="84" width="190" height="128" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="72" y="104" font-size="11.5" font-weight="700" fill="#1e293b">application</text>
  <text x="72" y="122" font-size="9.5" fill="#475569">DRAFT → SUBMITTED →</text>
  <text x="72" y="136" font-size="9.5" fill="#475569">SAMPLES_RECEIVED → UNDER_REVIEW</text>
  <text x="72" y="150" font-size="9.5" fill="#475569">→ ACCEPTED | REJECTED</text>
  <text x="72" y="168" font-size="9.5" fill="#64748b">CHANGES_REQUESTED resubmit loop</text>
  <text x="72" y="184" font-size="9.5" fill="#64748b">WITHDRAWN from 5 states</text>
  <text x="72" y="202" font-size="9" font-weight="600" fill="#4f46e5">initial DRAFT</text>

  <rect x="266" y="84" width="190" height="128" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="278" y="104" font-size="11.5" font-weight="700" fill="#1e293b">test_request</text>
  <text x="278" y="122" font-size="9.5" fill="#475569">DRAFT → ISSUED →</text>
  <text x="278" y="136" font-size="9.5" fill="#475569">ACCEPTED_BY_LAB → IN_PROGRESS</text>
  <text x="278" y="150" font-size="9.5" fill="#475569">→ COMPLETED</text>
  <text x="278" y="168" font-size="9.5" fill="#64748b">REJECTED_BY_LAB · WITHDRAWN</text>
  <text x="278" y="184" font-size="9.5" fill="#64748b">complete fans out: report +</text>
  <text x="278" y="197" font-size="9.5" fill="#64748b">assignments + forms (below)</text>

  <rect x="472" y="84" width="190" height="128" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
  <text x="484" y="104" font-size="11.5" font-weight="700" fill="#3730a3">test_assignment ★ task 61</text>
  <text x="484" y="122" font-size="9.5" fill="#475569">PENDING → ACCEPTED →</text>
  <text x="484" y="136" font-size="9.5" fill="#475569">IN_PROGRESS → COMPLETED</text>
  <text x="484" y="150" font-size="9.5" fill="#475569">FAILED · OMITTED · redo bridge</text>
  <text x="484" y="168" font-size="9.5" fill="#64748b">date-stamp self-cascades</text>
  <text x="484" y="184" font-size="9.5" fill="#64748b">(accepted_/started_/completed_)</text>
  <text x="484" y="202" font-size="9" font-weight="600" fill="#4f46e5">one form × one sample × one lab</text>

  <rect x="678" y="84" width="182" height="128" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="690" y="104" font-size="11.5" font-weight="700" fill="#1e293b">test_report</text>
  <text x="690" y="122" font-size="9.5" fill="#475569">DRAFT → SUBMITTED →</text>
  <text x="690" y="136" font-size="9.5" fill="#475569">UNDER_REVIEW → ACCEPTED</text>
  <text x="690" y="150" font-size="9.5" fill="#475569">| REJECTED</text>
  <text x="690" y="168" font-size="9.5" fill="#64748b">return-to-lab bridges back to</text>
  <text x="690" y="182" font-size="9.5" fill="#64748b">DRAFT — forms follow via cascade</text>

  <!-- Row 2 -->
  <rect x="60" y="232" width="190" height="128" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="72" y="252" font-size="11.5" font-weight="700" fill="#1e293b">form_instance</text>
  <text x="72" y="270" font-size="9.5" fill="#475569">DRAFT → IN_PROGRESS →</text>
  <text x="72" y="284" font-size="9.5" fill="#475569">SUBMITTED → LOCKED →</text>
  <text x="72" y="298" font-size="9.5" fill="#475569">ACCEPTED | REJECTED</text>
  <text x="72" y="316" font-size="9.5" fill="#64748b">redo bridge: [IN_PROGRESS,</text>
  <text x="72" y="330" font-size="9.5" fill="#64748b">SUBMITTED] → DRAFT (task 61)</text>

  <rect x="266" y="232" width="190" height="128" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text x="278" y="252" font-size="11.5" font-weight="700" fill="#78350f">evaluation_report ⚠</text>
  <text x="278" y="270" font-size="9.5" fill="#475569">DRAFT → IN_REVIEW →</text>
  <text x="278" y="284" font-size="9.5" fill="#475569">ALL_TR_REVIEWED → APPROVED |</text>
  <text x="278" y="298" font-size="9.5" fill="#475569">REJECTED | CONDITIONALLY_APPROVED</text>
  <text x="278" y="316" font-size="9.5" fill="#92600e">reopen from any terminal state</text>
  <text x="278" y="332" font-size="9" font-weight="600" fill="#b45309">R42 warning leg: no status field —</text>
  <text x="278" y="346" font-size="9" font-weight="600" fill="#b45309">the lifecycle rides overall_decision</text>

  <rect x="472" y="232" width="190" height="128" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="484" y="252" font-size="11.5" font-weight="700" fill="#1e293b">certificate</text>
  <text x="484" y="270" font-size="9.5" fill="#475569">DRAFT → PENDING_REGISTRATION</text>
  <text x="484" y="284" font-size="9.5" fill="#475569">→ ACTIVE ⇄ SUSPENDED</text>
  <text x="484" y="298" font-size="9.5" fill="#475569">EXPIRED · UNDER_INVESTIGATION</text>
  <text x="484" y="312" font-size="9.5" fill="#475569">· WITHDRAWN</text>
  <text x="484" y="330" font-size="9.5" fill="#64748b">PD-05 re-registration (task 61):</text>
  <text x="484" y="344" font-size="9.5" fill="#64748b">renew / revise / transfer_ownership</text>

  <rect x="678" y="232" width="182" height="128" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text x="690" y="252" font-size="11.5" font-weight="700" fill="#78350f">sample_verification ⚠</text>
  <text x="690" y="270" font-size="9.5" fill="#475569">a projection machine riding</text>
  <text x="690" y="284" font-size="9.5" fill="#475569">MeasuringInstrumentSample.</text>
  <text x="690" y="298" font-size="9.5" fill="#475569">verification_state</text>
  <text x="690" y="316" font-size="9" font-weight="600" fill="#b45309">R42 warning leg: no same-named</text>
  <text x="690" y="330" font-size="9" font-weight="600" fill="#b45309">entity class — states cannot be</text>
  <text x="690" y="344" font-size="9" font-weight="600" fill="#b45309">enum-checked; documented, not silent</text>

  <!-- Walker strip -->
  <rect x="60" y="388" width="800" height="54" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
  <text x="450" y="410" font-size="12" font-weight="700" fill="#3730a3" text-anchor="middle">the walker — state-walk.ts walkTransition</text>
  <text x="450" y="428" font-size="10.5" fill="#4f46e5" text-anchor="middle">validate edge → enforce declared guard → apply status → run declared cascades · every service mutation delegates (task 61, grep-pinned)</text>

  <!-- Cascade fan-out: test_run -->
  <text x="60" y="482" font-size="13" font-weight="700" fill="#1e293b">The declared run-family cascades — <tspan font-family="ui-monospace, monospace" font-size="12">test_run</tspan> (added by task 61)</text>

  <rect x="60" y="496" width="240" height="96" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
  <text x="72" y="518" font-size="11" font-weight="700" fill="#1e293b">complete — guard: admissible</text>
  <text x="72" y="536" font-size="9.5" fill="#475569">[PLANNED, IN_PROGRESS] → COMPLETED</text>
  <text x="72" y="552" font-size="9.5" fill="#64748b">the guard names a caller-supplied</text>
  <text x="72" y="566" font-size="9.5" fill="#64748b">computed input — never re-derived</text>
  <text x="72" y="582" font-size="9.5" fill="#64748b">by the machine</text>

  <rect x="380" y="496" width="220" height="96" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="392" y="518" font-size="11" font-weight="700" fill="#14532d">⇒ form_instance SUBMITTED</text>
  <text x="392" y="536" font-size="9.5" fill="#166534">where id = ${this.form_instance_id}</text>
  <text x="392" y="550" font-size="9.5" fill="#166534">AND status != SUBMITTED</text>
  <text x="392" y="568" font-size="11" font-weight="700" fill="#14532d">⇒ test_assignment COMPLETED</text>
  <text x="392" y="584" font-size="9.5" fill="#166534">completed_date: now</text>

  <rect x="640" y="496" width="220" height="96" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="652" y="518" font-size="11" font-weight="700" fill="#7f1d1d">invalidate ⇒ INVALIDATED</text>
  <text x="652" y="536" font-size="9.5" fill="#991b1b">⇒ test_assignment FAILED</text>
  <text x="652" y="552" font-size="9.5" fill="#991b1b">redo ⇒ assignment IN_PROGRESS</text>
  <text x="652" y="566" font-size="9.5" fill="#991b1b">+ form back to DRAFT</text>
  <text x="652" y="584" font-size="9.5" fill="#991b1b">a voided run, never a fail</text>

  <g stroke="#9333ea" stroke-width="1.6" fill="none">
    <line x1="300" y1="530" x2="376" y2="530" marker-end="url(#arrL)"/>
    <path d="M 300 560 C 340 590, 580 500, 636 524" marker-end="url(#arrL)"/>
  </g>

  <!-- R42 band -->
  <rect x="60" y="618" width="800" height="52" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.4"/>
  <text x="76" y="638" font-size="11.5" font-weight="700" fill="#1e293b">R42 state-machine-integrity — the machines are data, checked like data</text>
  <text x="76" y="656" font-size="10.5" fill="#475569">machine → declared entity class · states ⊆ the entity's status enum · initial ∈ states · endpoints ∈ states · guards resolve to the closed vocabulary (admissible)</text>

  <!-- bottom bar -->
  <rect x="60" y="690" width="800" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="80" y="711" font-size="11.5" font-weight="600" fill="#0f172a">Behavior preserved: zero assertion changes; the tested service won all twelve declaration discrepancies.</text>
  <text x="80" y="728" font-size="11" fill="#475569">The machines are not documentation of what the services do — they are what the services do.</text>
</svg>
